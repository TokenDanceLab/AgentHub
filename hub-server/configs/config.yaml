server:
  port: 8080
  log_level: info
  log_file: ""
  admin_port: 6060
  # env: production|development|staging|... — overridden by AGENTHUB_ENV env var
  env: ""
db:
  host: localhost
  port: 5432
  user: agenthub
  password: ""  # set via AGENTHUB_DB_PASSWORD env var for non-localhost DB
  name: agenthub
  application_name: agenthub
  max_open_conns: 20
  max_idle_conns: 10
  conn_max_lifetime: 30m
  conn_max_idle_time: 5m
redis:
  host: localhost
  port: 6379
  password: ""
  db: 0
  pool_size: 100
  min_idle_conns: 10
jwt:
  # AGENTHUB_JWT_SECRET env var takes precedence over this value.
  secret: ""
  access_ttl: 15m
  refresh_ttl: 720h
upload:
  dir: ./uploads
  max_size: 10485760
  allowed_mime_types:
    - text/plain
    - text/markdown
    - text/csv
    - application/json
    - application/pdf
    - image/png
    - image/jpeg
    - image/gif
    - image/webp
s3:
  endpoint: ""
  access_key: ""
  secret_key: ""
  bucket: ""
  region: ""
  use_ssl: true
agent_team:
  max_delegation_depth: 3
  max_active_subagents_per_run: 5
  max_route_repeats: 3
  max_tasks_per_team_run: 20
  assignment_timeout: 30m
  max_team_run_budget_tokens: 200000
  max_team_run_budget_usage_pct: 95
tokendance_id:
  issuer_url: "${AGENTHUB_TOKENDANCE_ID_ISSUER_URL:-https://id.example.com}"
  jwks_uri: ""
  client_id: ""
  client_secret: ""
  redirect_uri: ""
  allowed_redirect_uris: []

# Outbound HTTP egress policy (#1540). Default-deny: an empty allowlist
# refuses every dial to loopback/private/link-local/metadata networks, so
# hub-initiated execution-target pings fail closed until an administrator
# explicitly allows the target ranges (CIDR or hostname). Plain http is
# refused unless allow_plain_http is set — https is the default.
egress:
  allow_cidrs: []
  allow_hostnames: []
  allow_plain_http: false
  timeout: 5s
