server:
  port: 8080
  log_level: info
  log_file: ""
  admin_port: 6060
db:
  host: postgres
  port: 5432
  user: agenthub
  password: dev_password
  name: agenthub
redis:
  host: redis
  port: 6379
  password: ""
  db: 0
  pool_size: 100
  min_idle_conns: 10
jwt:
  # AGENTHUB_JWT_SECRET env var takes precedence over this value.
  secret: ""
  access_ttl: 15m
  refresh_ttl: 720h
upload:
  dir: ./uploads
  max_size: 10485760
agent_team:
  max_delegation_depth: 3
  max_active_subagents_per_run: 5
  max_route_repeats: 3
  max_tasks_per_team_run: 20
  assignment_timeout: 30m
  max_team_run_budget_tokens: 200000
  max_team_run_budget_usage_pct: 95
