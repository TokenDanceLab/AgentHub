# ──────────────────────────────────────────────
# AgentHub — hk2 nginx configuration
# ──────────────────────────────────────────────
# Domain: hub.vectorcontrol.tech (canonical)
# Alias:  agenthub.vectorcontrol.tech → 301 to canonical
#
# Architecture:
#   Static homepage: /opt/vectorcontrol-hk2-stack/agenthub-home/out/
#   Hub API + WS:    127.0.0.1:8090 (Docker agenthub-hub)
#   OIDC auth:       oauth2-proxy @ 127.0.0.1:4181
#
# Prerequisites:
#   - SSL cert managed by certbot (HTTP-01 via api.vectorcontrol.tech cert)
#   - oauth2-proxy running with TokenDance ID issuer
#   - DNS: hub.vectorcontrol.tech A record pointing to hk2 public IP
#
# Install: copy to /etc/nginx/sites-available/ and symlink to sites-enabled/
# ──────────────────────────────────────────────

# ── Rate limiting zone ────────────────────────
limit_req_zone $binary_remote_addr zone=agenthub_api:10m rate=200r/m;
limit_req_zone $binary_remote_addr zone=agenthub_auth:10m rate=10r/m;

# ── Upstream for Hub API ─────────────────────
upstream agenthub_backend {
    server 127.0.0.1:8090;
    keepalive 32;
}

# ── Canonical: hub.vectorcontrol.tech ─────────
server {
    listen 443 ssl http2;
    server_name hub.vectorcontrol.tech;

    # TLS — uses the api.vectorcontrol.tech wildcard cert
    ssl_certificate     /etc/letsencrypt/live/api.vectorcontrol.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.vectorcontrol.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    server_tokens off;

    client_max_body_size 12m;

    # ── Security headers ─────────────────────
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── OAuth2 proxy auth backend ────────────
    location = /_vc_auth {
        internal;
        proxy_pass http://127.0.0.1:4181/oauth2/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /oauth2/sign_in {
        proxy_pass http://127.0.0.1:4181/oauth2/sign_in;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    location = /oauth2/callback {
        proxy_pass http://127.0.0.1:4181/oauth2/callback;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    # ── OIDC callback — Hub code exchange ────
    # /auth/tokendance/callback is the browser-side redirect target.
    # The browser sends the code + PKCE to Hub's POST /client/auth/oidc/callback.
    location /auth/tokendance/ {
        proxy_pass http://agenthub_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Hub API — OAuth protected ────────────
    location /api/ {
        auth_request /_vc_auth;
        error_page 401 = /oauth2/sign_in;

        limit_req zone=agenthub_api burst=50 nodelay;

        proxy_pass http://agenthub_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── Hub health — unauthenticated ─────────
    location /health {
        proxy_pass http://agenthub_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── WebSocket — /client/ws (Edge relay) ──
    location /client/ws {
        auth_request /_vc_auth;
        error_page 401 = /oauth2/sign_in;

        proxy_pass http://agenthub_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ── Hub client endpoints — OAuth protected ─
    location /client/ {
        auth_request /_vc_auth;
        error_page 401 = /oauth2/sign_in;

        proxy_pass http://agenthub_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Static homepage (AgentHub Home) ──────
    # Served from the Astro static export directory.
    location / {
        root /opt/vectorcontrol-hk2-stack/agenthub-home/out;
        index index.html;
        try_files $uri $uri/ $uri.html /index.html;

        # Cache static assets aggressively
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # HTML files: short cache, allow revalidation
        location ~* \.html$ {
            expires 1h;
            add_header Cache-Control "public, must-revalidate";
        }
    }

    # ── Static site special files ─────────────
    location = /robots.txt {
        root /opt/vectorcontrol-hk2-stack/agenthub-home/out;
    }

    location = /sitemap.xml {
        root /opt/vectorcontrol-hk2-stack/agenthub-home/out;
        default_type text/xml;
    }

    location = /llms.txt {
        root /opt/vectorcontrol-hk2-stack/agenthub-home/out;
        default_type text/plain;
    }

    location = /site.webmanifest {
        root /opt/vectorcontrol-hk2-stack/agenthub-home/out;
        default_type application/manifest+json;
    }

    # ── Access log ────────────────────────────
    access_log /var/log/nginx/agenthub-access.log;
    error_log  /var/log/nginx/agenthub-error.log;
}

# ── Alias: agenthub.vectorcontrol.tech → 301 ──
server {
    listen 443 ssl http2;
    server_name agenthub.vectorcontrol.tech;

    ssl_certificate     /etc/letsencrypt/live/api.vectorcontrol.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.vectorcontrol.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    return 301 https://hub.vectorcontrol.tech$request_uri;
}

# ── HTTP → HTTPS redirect ─────────────────────
server {
    listen 80;
    server_name hub.vectorcontrol.tech agenthub.vectorcontrol.tech;
    return 301 https://hub.vectorcontrol.tech$request_uri;
}
