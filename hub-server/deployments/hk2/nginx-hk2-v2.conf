# ──────────────────────────────────────────────
# AgentHub — hk2 nginx configuration (v2: Web App)
# ──────────────────────────────────────────────
# Domain: hub.vectorcontrol.tech (canonical)
# Alias:  agenthub.vectorcontrol.tech → 301 to canonical
#
# Architecture:
#   Web App (SPA):   /opt/vectorcontrol-hk2-stack/agenthub-web/dist/
#   Hub API + WS:    127.0.0.1:8090 (Docker agenthub-hub)
#   OIDC auth:       Handled by SPA (PKCE flow, no oauth2-proxy needed)
#
# Changes from v1:
#   - Replaced static homepage with Web App SPA
#   - Removed oauth2-proxy (SPA has its own OIDC PKCE auth)
#   - Removed /auth/tokendance/ proxy (SPA catches this route)
#   - Added SPA fallback (try_files → /index.html)
#
# Prerequisites:
#   - SSL cert managed by certbot (HTTP-01 via api.vectorcontrol.tech cert)
#   - DNS: hub.vectorcontrol.tech A record pointing to hk2 public IP
#
# Install: copy to /etc/nginx/sites-available/ and symlink to sites-enabled/
# ──────────────────────────────────────────────

# ── Rate limiting zone ────────────────────────
limit_req_zone $binary_remote_addr zone=agenthub_api:10m rate=200r/m;

# ── Upstream for Hub API ─────────────────────
upstream agenthub_backend {
    server 127.0.0.1:8090;
    keepalive 32;
}

# ── Canonical: hub.vectorcontrol.tech ─────────
server {
    listen 443 ssl http2;
    server_name hub.vectorcontrol.tech;

    # TLS — uses the api.vectorcontrol.tech wildcard cert
    ssl_certificate     /etc/letsencrypt/live/api.vectorcontrol.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.vectorcontrol.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    server_tokens off;

    client_max_body_size 12m;

    # ── Security headers ─────────────────────
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── Hub health — unauthenticated ─────────
    location /health {
        proxy_pass http://agenthub_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Hub public API — unauthenticated ─────
    location /api/public/ {
        proxy_pass http://agenthub_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Hub OIDC endpoints — unauthenticated ─
    # SPA calls POST /client/auth/oidc/authorize and /client/auth/oidc/callback
    location /client/auth/ {
        limit_req zone=agenthub_api burst=20 nodelay;

        proxy_pass http://agenthub_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Hub client API — Bearer token auth (SPA) ─
    location /client/ {
        limit_req zone=agenthub_api burst=50 nodelay;

        proxy_pass http://agenthub_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── Hub web API — Bearer token auth (SPA) ─
    location /web/ {
        limit_req zone=agenthub_api burst=50 nodelay;

        proxy_pass http://agenthub_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── WebSocket — /client/ws (IM + Edge relay) ──
    location /client/ws {
        proxy_pass http://agenthub_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ── Web App (SPA) ────────────────────────
    # Serves the React SPA. All unmatched routes fall back to index.html
    # so the client-side router can handle them (including the OIDC
    # callback at /auth/tokendance/callback).
    location / {
        root /opt/vectorcontrol-hk2-stack/agenthub-web/dist;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Cache hashed static assets aggressively
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # HTML and manifest: short cache, allow revalidation
        location ~* \.(html|json)$ {
            expires 1h;
            add_header Cache-Control "public, must-revalidate";
        }
    }

    # ── PWA special files ────────────────────
    location = /manifest.json {
        root /opt/vectorcontrol-hk2-stack/agenthub-web/dist;
        default_type application/manifest+json;
    }

    # ── Access log ────────────────────────────
    access_log /var/log/nginx/agenthub-access.log;
    error_log  /var/log/nginx/agenthub-error.log;
}

# ── Alias: agenthub.vectorcontrol.tech → 301 ──
server {
    listen 443 ssl http2;
    server_name agenthub.vectorcontrol.tech;

    ssl_certificate     /etc/letsencrypt/live/api.vectorcontrol.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.vectorcontrol.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    return 301 https://hub.vectorcontrol.tech$request_uri;
}

# ── HTTP → HTTPS redirect ─────────────────────
server {
    listen 80;
    server_name hub.vectorcontrol.tech agenthub.vectorcontrol.tech;
    return 301 https://hub.vectorcontrol.tech$request_uri;
}
