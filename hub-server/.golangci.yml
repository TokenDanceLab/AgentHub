version: "2"
run:
  tests: true
linters:
  enable:
    - cyclop
    - gocognit
    - gocyclo
    - gosec
    - misspell
    - prealloc
    - revive
    - unconvert
    - whitespace
  settings:
    cyclop:
      max-complexity: 21
    gocognit:
      min-complexity: 30
    gocyclo:
      min-complexity: 20
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        # `exported` (stutter) disabled deliberately: this repo's DTO names
        # intentionally mirror the openapi.yaml schema names (e.g.
        # message.MessageResponse, messagereaction.MessageReactionResponse),
        # and the stutter rename would break that contract correspondence.
        - name: increment-decrement
        - name: var-naming
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - cyclop
          - errcheck
          - gocognit
          - gocyclo
        path: _test\.go
      - linters:
          - revive
        text: context-as-argument
      - linters:
          - staticcheck
        text: SA1019
    paths:
      - reference
      - vendor
      - node_modules
      - tests
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - reference
      - vendor
      - node_modules
      - tests
      - third_party$
      - builtin$
      - examples$
