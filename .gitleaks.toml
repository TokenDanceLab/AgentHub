# Secret scanning config for `gitleaks` (https://github.com/gitleaks/gitleaks).
#
# The provider rules (AWS, GitHub, GitLab, Slack, Google, JWT, private keys,
# generic API keys, ...) come from gitleaks' default ruleset via `extend`, so
# this repo maintains no rule set of its own.
#
# The allowlist below keeps the ADR-028 invariant: a finding is silenced only
# when BOTH the exact file and the exact literal match (`condition = "AND"`).
# A new credential in one of these test files, or the same literal in another
# file, is still reported.
title = "AgentHub"

[extend]
useDefault = true

[[allowlists]]
description = "Fixture literals registered for edge-server/internal/adapters/claude/claude_adapter_integration_test.go"
condition = "AND"
paths = ['''^edge\-server/internal/adapters/claude/claude_adapter_integration_test\.go$''']
regexes = [
  '''sk\-claude\-key\-456''',
]

[[allowlists]]
description = "Fixture literals registered for edge-server/internal/adapters/sdk/sdk_fixture_mapper_test.go"
condition = "AND"
paths = ['''^edge\-server/internal/adapters/sdk/sdk_fixture_mapper_test\.go$''']
regexes = [
  '''attachment\-secret\-123456''',
  '''sk\-direct\-secret\-123456''',
  '''sk\-reason\-secret\-123456''',
  '''trace\-ref\-secret\-123456''',
]

[[allowlists]]
description = "Fixture literals registered for edge-server/internal/api/delivery_admission_test.go"
condition = "AND"
paths = ['''^edge\-server/internal/api/delivery_admission_test\.go$''']
