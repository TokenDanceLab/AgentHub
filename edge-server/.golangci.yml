version: "2"
run:
  tests: true
linters:
  enable:
    - cyclop
    - errname
    - exhaustive
    - gocognit
    - gocritic
    - gocyclo
    - misspell
    - nilerr
    - prealloc
    - revive
    - unconvert
    - unparam
    - whitespace
  settings:
    cyclop:
      max-complexity: 21
    gocognit:
      min-complexity: 30
    gocyclo:
      min-complexity: 20
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: increment-decrement
        - name: var-naming
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - cyclop
          - errcheck
          - exhaustive
          - gocognit
          - gocyclo
          - unparam
        path: _test\.go
      - linters:
          - cyclop
          - gocognit
          - gocyclo
        path: internal/adapters/parser_ndjson\.go
      - linters:
          - cyclop
          - gocognit
          - gocyclo
        path: internal/adapters/opencode\.go
      - linters:
          - cyclop
          - gocognit
          - gocyclo
        path: internal/adapters/codex\.go
      - linters:
          - cyclop
          - errcheck
          - gocognit
          - gocyclo
        path: internal/lifecycle/process_executor\.go
      - linters:
          - gocognit
          - gocyclo
        path: internal/api/handlers\.go
      - linters:
          - gocognit
        path: internal/store/store\.go
      - linters:
          - errcheck
        path: internal/lifecycle/mock_executor\.go
      - linters:
          - gocyclo
        path: internal/adapters/claude_code\.go
      - linters:
          - revive
        text: context-as-argument
      - linters:
          - staticcheck
        text: SA1019
    paths:
      - reference
      - vendor
      - node_modules
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - reference
      - vendor
      - node_modules
      - third_party$
      - builtin$
      - examples$
