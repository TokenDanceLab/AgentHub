# ──────────────────────────────────────────────
# AgentHub — 生产 Compose (hk3)
# 独立于 AI 生产栈 (/opt/tokendance/compose.yml)
# 屎山遗留代码，严格资源限制，防止拖死 hk3
# ──────────────────────────────────────────────

services:
  # ── PostgreSQL 16（agenthub 专用，不共用 Azure PG）──
  postgres:
    image: postgres:16-alpine
    container_name: agenthub-postgres
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    pids_limit: 128
    environment:
      POSTGRES_DB: agenthub
      POSTGRES_USER: agenthub
      POSTGRES_PASSWORD: ${AGENTHUB_DB_PASSWORD:?请设置 AGENTHUB_DB_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenthub -d agenthub"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - agenthub-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # ── Redis 7（agenthub 专用）──
  redis:
    image: redis:7-alpine
    container_name: agenthub-redis
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.3
    pids_limit: 64
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 64mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - agenthub-net
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.3"

  # ── Hub Server（Go 后端 API）──
  hub-server:
    image: ghcr.io/tokendancelab/agenthub-hub-server:latest
    container_name: agenthub-hub
    restart: unless-stopped
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 1.0
    pids_limit: 256
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      AGENTHUB_DB_HOST: postgres
      AGENTHUB_DB_PORT: "5432"
      AGENTHUB_DB_USER: agenthub
      AGENTHUB_DB_PASSWORD: ${AGENTHUB_DB_PASSWORD}
      AGENTHUB_DB_NAME: agenthub
      AGENTHUB_REDIS_HOST: redis
      AGENTHUB_REDIS_PORT: "6379"
      AGENTHUB_REDIS_PASSWORD: ""
      AGENTHUB_REDIS_DB: "0"
      AGENTHUB_REDIS_POOL_SIZE: "20"
      AGENTHUB_REDIS_MIN_IDLE_CONNS: "5"
      AGENTHUB_JWT_SECRET: ${AGENTHUB_JWT_SECRET:?请设置 AGENTHUB_JWT_SECRET}
      AGENTHUB_JWT_ACCESS_TTL: ${AGENTHUB_JWT_ACCESS_TTL:-15m}
      AGENTHUB_JWT_REFRESH_TTL: ${AGENTHUB_JWT_REFRESH_TTL:-720h}
      AGENTHUB_SERVER_PORT: "8080"
      AGENTHUB_SERVER_LOG_LEVEL: ${AGENTHUB_SERVER_LOG_LEVEL:-info}
      AGENTHUB_SERVER_ADMIN_PORT: "6060"
      AGENTHUB_UPLOAD_DIR: /app/uploads
      AGENTHUB_UPLOAD_MAX_SIZE: "10485760"
      AGENTHUB_TOKENDANCE_ID_ISSUER_URL: https://id.vectorcontrol.tech
      AGENTHUB_TOKENDANCE_ID_CLIENT_ID: ${AGENTHUB_TOKENDANCE_ID_CLIENT_ID:-}
      AGENTHUB_TOKENDANCE_ID_CLIENT_SECRET: ${AGENTHUB_TOKENDANCE_ID_CLIENT_SECRET:-}
      AGENTHUB_TOKENDANCE_ID_REDIRECT_URI: https://hub.vectorcontrol.tech/auth/tokendance/callback
      AGENTHUB_TOKENDANCE_ID_ALLOWED_REDIRECT_URIS: https://hub.vectorcontrol.tech/auth/tokendance/callback
    ports:
      - "127.0.0.1:8090:8080"
      - "127.0.0.1:6060:6060"
    volumes:
      - uploads_data:/app/uploads
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - agenthub-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "1.0"

volumes:
  pg_data:
    name: agenthub_pg_data
  redis_data:
    name: agenthub_redis_data
  uploads_data:
    name: agenthub_uploads

networks:
  agenthub-net:
    name: agenthub-net
    driver: bridge
