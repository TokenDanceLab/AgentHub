# ──────────────────────────────────────────────
# AgentHub — Production Compose
# PG/Redis local instances; live facts in private deploy repo.
# ──────────────────────────────────────────────

services:
  # ── Redis 7（agenthub 专用，轻量本地）──
  redis:
    image: redis:7-alpine
    container_name: agenthub-redis
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.3
    pids_limit: 64
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 64mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - agenthub-net
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ── Hub Server（Go 后端 API — 本地 PG16）──
  hub-server:
    image: ghcr.io/tokendancelab/agenthub-hub-server:latest
    container_name: agenthub-hub
    restart: unless-stopped
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 1.0
    pids_limit: 256
    depends_on:
      redis:
        condition: service_healthy
    environment:
      # Local PostgreSQL 16 (127.0.0.1:<port>). PG_PASSWORD required;
      # remaining defaults align with live (see private deploy repo).
      # NOTE: PG_HOST default is host-only (no port); port via PG_PORT (default 5433).
      # Historical default 127.0.0.1:<port> would put port into host, DBConfig.DSN()
      # does not split host:port, causing DSN host=127.0.0.1:<port> port=5433 failure.
      AGENTHUB_DB_HOST: ${PG_HOST:-127.0.0.1}
      AGENTHUB_DB_PORT: "${PG_PORT:-5433}"
      AGENTHUB_DB_USER: ${PG_USER:-agenthub}
      AGENTHUB_DB_PASSWORD: ${PG_PASSWORD:?请设置 PG_PASSWORD}
      AGENTHUB_DB_NAME: ${PG_DB_NAME:-agenthub}
      AGENTHUB_DB_SSLMODE: ${PG_SSLMODE:-disable}
      # Redis（本地）
      AGENTHUB_REDIS_HOST: redis
      AGENTHUB_REDIS_PORT: "6379"
      AGENTHUB_REDIS_PASSWORD: ""
      AGENTHUB_REDIS_DB: "0"
      AGENTHUB_REDIS_POOL_SIZE: "20"
      AGENTHUB_REDIS_MIN_IDLE_CONNS: "5"
      # Security hardening (2026-08-10, CI7):
      # - AUTH_FAIL_CLOSED=true: access-token jti blacklist check (Redis-backed)
      #   fails CLOSED on Redis errors so a revoked (logged-out) access JWT
      #   cannot slip back in during a Redis outage.
      # - RATE_LIMIT_FAIL_OPEN=false: non-auth rate limiters also fail CLOSED
      #   on Redis errors (auth paths always fail-closed regardless).
      AGENTHUB_AUTH_FAIL_CLOSED: "true"
      AGENTHUB_RATE_LIMIT_FAIL_OPEN: "false"
      # JWT
      AGENTHUB_JWT_SECRET: ${AGENTHUB_JWT_SECRET:?请设置 AGENTHUB_JWT_SECRET}
      AGENTHUB_JWT_ACCESS_TTL: ${AGENTHUB_JWT_ACCESS_TTL:-15m}
      AGENTHUB_JWT_REFRESH_TTL: ${AGENTHUB_JWT_REFRESH_TTL:-720h}
      # Server
      AGENTHUB_SERVER_PORT: "8080"
      AGENTHUB_SERVER_LOG_LEVEL: ${AGENTHUB_SERVER_LOG_LEVEL:-info}
      AGENTHUB_SERVER_ADMIN_PORT: "6060"
      AGENTHUB_UPLOAD_DIR: /app/uploads
      AGENTHUB_UPLOAD_MAX_SIZE: "10485760"
      # TokenDance ID OIDC
      AGENTHUB_TOKENDANCE_ID_ISSUER_URL: ${AGENTHUB_TOKENDANCE_ID_ISSUER_URL:-https://id.example.com}
      AGENTHUB_TOKENDANCE_ID_CLIENT_ID: ${AGENTHUB_TOKENDANCE_ID_CLIENT_ID:-}
      AGENTHUB_TOKENDANCE_ID_CLIENT_SECRET: ${AGENTHUB_TOKENDANCE_ID_CLIENT_SECRET:-}
      # Callback contract (issue #1651/#1656):
      # - /api/auth/callback → SPA callback (nginx /api/auth/ → :3001 static)
      # - /workbench/auth/tokendance/callback → workbench app/web (BASE_URL=/workbench/)
      # - http://127.0.0.1/callback → desktop Tauri loopback (RFC 8252 port-tolerant)
      # TDID oauth_clients.redirect_uris must match this set.
      AGENTHUB_TOKENDANCE_ID_REDIRECT_URI: ${AGENTHUB_TOKENDANCE_ID_REDIRECT_URI:-https://hub.vectorcontrol.tech/api/auth/callback}
      AGENTHUB_TOKENDANCE_ID_ALLOWED_REDIRECT_URIS: ${AGENTHUB_TOKENDANCE_ID_ALLOWED_REDIRECT_URIS:-https://hub.vectorcontrol.tech/api/auth/callback,https://hub.vectorcontrol.tech/workbench/auth/tokendance/callback,http://127.0.0.1/callback}
      # Machine-side code exchange endpoint: override TOKEN_URL/JWKS_URI for
      # server-side OIDC if the public issuer blocks non-JS clients.
      AGENTHUB_TOKENDANCE_ID_TOKEN_URL: ${AGENTHUB_TOKENDANCE_ID_TOKEN_URL:-}
      AGENTHUB_TOKENDANCE_ID_JWKS_URI: ${AGENTHUB_TOKENDANCE_ID_JWKS_URI:-}
    ports:
      - "127.0.0.1:8090:8080"
      - "127.0.0.1:6060:6060"
    volumes:
      - uploads_data:/app/uploads
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - agenthub-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis_data:
    name: agenthub_redis_data
  uploads_data:
    name: agenthub_uploads

networks:
  agenthub-net:
    name: agenthub-net
    driver: bridge
