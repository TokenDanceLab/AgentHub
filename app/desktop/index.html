<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- theme pre-bootstrap (#1827): external classic script because the CSP
         below is `script-src 'self'` (blocks inline scripts). Sets
         data-theme/data-theme-preset before first paint to prevent FOUC. -->
    <script src="/theme-bootstrap.js"></script>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://avatars.githubusercontent.com https://*.vectorcontrol.tech; connect-src 'self' http://127.0.0.1:* ws://127.0.0.1:* http://localhost:* ws://localhost:* https://*.vectorcontrol.tech wss://*.vectorcontrol.tech; frame-ancestors 'none'; form-action 'self'; base-uri 'self'" />
    <title>AgentHub Desktop</title>
    <!-- Material Symbols icon font — self-hosted (#2024) so ligature icons
         render offline; @font-face rules live in /fonts/fonts.css. -->
    <link rel="stylesheet" href="/fonts/fonts.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
