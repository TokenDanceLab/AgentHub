<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgentHub Web</title>
    <meta name="theme-color" content="#0071BC" />
    <link rel="manifest" href="/manifest.json" />
    <script>
      (function(){
        try {
          var t = localStorage.getItem('agenthub-v4-theme');
          if (t === 'dark') { document.documentElement.dataset.theme = 'dark'; }
          else if (t === 'light') { document.documentElement.dataset.theme = 'light'; }
          else if (t === 'system') {
            document.documentElement.dataset.theme =
              window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          // Preset FOUC (#1827): apply the stored theme preset before first
          // paint so preset colors do not flash. The preset list must stay in
          // sync with app/shared/src/themePresets.ts (THEME_PRESETS).
          var PRESETS = ['classic-blue','claude-warm','chatgpt-minimal','deepseek-tech','one-dark-pro','dracula'];
          var p = localStorage.getItem('agenthub-v4-theme-preset');
          if (p && PRESETS.indexOf(p) >= 0) {
            document.documentElement.setAttribute('data-theme-preset', p);
          } else {
            document.documentElement.removeAttribute('data-theme-preset');
          }
        } catch(e){}
      })();
    </script>
    <link rel="icon" type="image/png" href="/agenthub-icon-rounded-32.png" />
    <link rel="apple-touch-icon" href="/agenthub-icon-rounded-192.png" />
    <!-- Self-hosted fonts (#2024): @font-face rules live in /fonts/fonts.css;
         no external font CDN requests remain (fontBlocker keeps guarding). -->
    <link rel="stylesheet" href="/fonts/fonts.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
