# AgentHub Web workbench nginx config.
# The Vite build uses base=/workbench/ (see app/web/vite.config.ts), so all
# asset URLs are prefixed /workbench/. The build output itself lives at the
# container root; strip the prefix and serve from there, with SPA fallback
# for client-side routes.
server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    location /workbench/ {
        rewrite ^/workbench/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
