# AgentHub Web workbench nginx config.
# The Vite build uses base=/workbench/ (see app/web/vite.config.ts), so all
# asset URLs are prefixed /workbench/. The build output itself lives at the
# container root; strip the prefix and serve from there, with SPA fallback
# for client-side routes.
#
# Security headers mirror the strictness of the Desktop index.html CSP
# (AH-SR-037 compensation control): frame-ancestors 'none' for clickjacking
# protection, HSTS for transport integrity, and content-type sniffing guards.
server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    # ── Security response headers ──────────────────────────────────
    # CSP: default-src 'self' + frame-ancestors 'none' (clickjacking). Web
    # workbench assets are same-origin (/workbench/), the Hub API is
    # same-origin (/api/), and img-src allows data:/blob: URIs used by the
    # SPA. Matches Desktop index.html strictness (AH-SR-037).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'" always;
    # HSTS: enforce HTTPS for production (behind the TLS-terminating edge).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Clickjacking: deny all framing (defence-in-depth with CSP frame-ancestors).
    add_header X-Frame-Options "DENY" always;
    # MIME sniffing: prevent content-type interpretation attacks.
    add_header X-Content-Type-Options "nosniff" always;
    # Referrer leakage: strip to origin for cross-origin navigations.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /workbench/ {
        rewrite ^/workbench/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
