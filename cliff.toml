# git-cliff changelog configuration (https://git-cliff.org)
# Community-standard changelog generation for AgentHub releases.
# Produces a bilingual (zh/en) release body from conventional commits;
# invoked by .github/workflows/release.yml.
#
# The install table lives BEFORE the commit loop on purpose: Tera
# whitespace control at the end of the loop body has dropped trailing
# template content on the Linux binary, so static sections must precede
# the {% for %} loop. Keep the rendered body well under GitHub's
# 125,000-char release body limit (groups are sliced at 20 entries).

[changelog]
header = ""
body = """# AgentHub {{ version }}

发布版本 **{{ version }}** · Release **{{ version }}**.

---

## 安装 / Installation

**Windows**：下载 `AgentHub_{{ version | trim_start_matches(pat="v") }}_x64-setup.exe`（NSIS 安装版，推荐）或 `AgentHub_{{ version | trim_start_matches(pat="v") }}_x64-portable.zip`（便携版，解压即用）。安装版自带应用内自动更新（updater 元数据 `latest.json` 已随本发布提供）。

**服务器 / Server**：`agenthub-edge-{{ version | trim_start_matches(pat="v") }}-*`（本地执行运行时）与 `agenthub-hub-{{ version | trim_start_matches(pat="v") }}-*`（云端 Hub）按平台下载；macOS 用户可用 `darwin-*` 二进制自建。

### 校验和 / Checksums

所有产物 SHA-256 校验和见 `SHA256SUMS`，验证命令：

```bash
# Linux / macOS
sha256sum -c SHA256SUMS
# Windows (PowerShell)
Get-FileHash AgentHub_{{ version | trim_start_matches(pat="v") }}_x64-setup.exe -Algorithm SHA256
```

### 帮助 / Support

- 文档与架构：<https://github.com/TokenDanceLab/AgentHub/tree/master/docs>
- 问题反馈：<https://github.com/TokenDanceLab/AgentHub/issues>
- 变更历史：本文件下方按 Conventional Commits 分组，`BREAKING CHANGE` 置于顶部。

---

{% for group, commits in commits | group_by(attribute="group") -%}
## {{ group }}
{%- for commit in commits | slice(end=20) %}
- [{{ commit.message | split(pat="
") | first }}](https://github.com/TokenDanceLab/AgentHub/commit/{{ commit.id }}) ({{ commit.id | truncate(length=7, end="") }})
{%- endfor %}
{% endfor -%}
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
  { body = ".*BREAKING CHANGE.*", group = "⚠️ Breaking Changes / 破坏性变更" },
  { message = "^.*!:.*", group = "⚠️ Breaking Changes / 破坏性变更" },
  { message = "^feat", group = "✨ Features / 新功能" },
  { message = "^fix", group = "🐛 Bug Fixes / 问题修复" },
  { message = "^perf", group = "⚡ Performance / 性能优化" },
  { message = "^security", group = "🔒 Security / 安全加固" },
  { message = "^docs", group = "📚 Documentation / 文档" },
  { message = "^refactor", group = "🧹 Refactoring / 重构" },
  { message = "^(test|ci)", group = "🧪 Tests & CI / 测试与 CI" },
  { message = ".*", group = "📦 Other / 其他" },
]
protect_breaking_commits = false
filter_commits = false
sort_commits = "oldest"
