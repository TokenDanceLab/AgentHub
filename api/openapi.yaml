  /client/ws:
    get:
      tags: [HubSyncRelay]
      operationId: hubWebSocket
      summary: Hub WebSocket — real-time IM + agent dispatch.
      description: >
        Main Hub WebSocket route. WSAuthMiddleware validates a Hub-issued HS256
        access token during HTTP upgrade and resolves that token from exactly
        two sources, in priority order: (1) `Authorization: Bearer <token>` for
        native clients that can set headers, (2) the `Sec-WebSocket-Protocol`
        request header for browsers, carried either as
        `agenthub.bearer.v1, <hub-jwt>` (preferred two-token form; only the
        fixed marker is negotiated back so the token is never echoed) or as the
        single-token `access_token.<hub-jwt>` form. The `access_token` query
        parameter is deliberately rejected (fail closed) because query strings
        leak into proxy logs, browser history, and Referer headers — see
        middleware.extractWSToken. Query-string auth is therefore not part of
        this contract. TokenDance ID RS256 bearer tokens and TokenDance API
        keys are not Hub WebSocket credentials. The legacy first-frame `auth`
        event is only for tests and compatibility entries that do not install
        WSAuthMiddleware. See api/events.md for Hub event types.
      x-agenthub-status: implemented
      x-agenthub-owner: Hub
      security:
        - bearerAuth: []
      parameters:
        - name: Sec-WebSocket-Protocol
          in: header
          required: false
          schema: { type: string }
          description: >
            Preferred browser token carriage. Send
            `agenthub.bearer.v1, <hub-jwt>` (Hub negotiates back only the fixed
            `agenthub.bearer.v1` marker) or the single-token form
            `access_token.<hub-jwt>`.
      responses:
        "101":
          description: Switching Protocols.
        "401":
          $ref: "#/components/responses/Error"

  /web/agent-tasks:
    x-agenthub-device-type: web
    post:
      tags: [HubSyncRelay]
      operationId: hubTriggerTask
      summary: Trigger an agent task from web client.
      x-agenthub-status: implemented
      x-agenthub-owner: Hub
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trigger_message_id]
              properties:
                trigger_message_id:
                  type: string
                agent_instance_id:
                  type: string
                  description: Optional exact AgentInstance id to dispatch. When provided, Hub must not fall back to another agent.
                agent_type:
                  type: string
                  description: Optional Edge Runtime adapter id such as codex, claude-code, or opencode.
                custom_agent_id:
                  type: string
                  description: Optional CustomAgent id to dispatch. When provided, Hub must not fall back to another custom agent.
                model_params:
                  type: string
                  description: Optional JSON string with model/provider/reasoning hints copied into the agent.dispatch payload.
                target_id:
                  type: string
                  format: uuid
                  description: Optional owner-scoped local_edge ExecutionTarget id. Hub validates owner, local_edge target type, and bound desktop device, persists target_id and edge_device_id on the pending task, routes agent.dispatch only to that device, and queues offline work in a target/device queue without falling back to another desktop. Remote/cloud/relay targets are rejected on this Web dispatch route until their relay/provisioning paths are product-complete.
      responses:
        "200":
          description: Task dispatched.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HubPendingAgentTask"
        "409":
          description: Turn in progress — the agent instance already has a non-terminal (queued/dispatched/running) task. The trigger message itself is already persisted and is not rolled back. The web client treats this as a recoverable condition (keep draft / optimistic message, show an info toast) rather than a hard error. Granularity is per `agent_instance_id`, not per session; a different agent instance in the same session is not blocked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                turn_in_progress:
                  value:
                    error:
                      code: turn_in_progress
                      message: agent instance already has an active task

