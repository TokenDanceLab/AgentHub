          description: Task marked failed.

  # ═══════════════════════════════════════════════════════════
  # Hub Server — additional implemented routes
  # ═══════════════════════════════════════════════════════════

  # ── Auth ──

  /client/auth/oidc/authorize:
    post:
      tags: [HubSyncRelay]
      operationId: hubOidcAuthorize
      summary: Generate TokenDance ID OIDC PKCE authorization URL.
      description: >
        Public login-start endpoint. The client generates a PKCE verifier/challenge,
        sends the S256 challenge plus its Hub device proof, then opens the returned
        TokenDance ID authorization URL in a browser. This endpoint does not accept
        third-party provider tokens and does not require an existing Hub bearer token.
      x-agenthub-status: implemented
      x-agenthub-owner: Hub
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HubOIDCAuthorizeRequest"
      responses:
        "200":
          description: Hub state and TokenDance ID authorization URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HubOIDCAuthorizeResponse"
        "400":
          $ref: "#/components/responses/Error"

  /client/auth/oidc/callback:
    get:
      tags: [HubSyncRelay]
      operationId: hubOidcCallbackPage
      summary: Render the browser OIDC callback result page.
      description: >
        Browser redirect endpoint for TokenDance ID Authorization Code callbacks.
        It reads `code` and `state` from the query string and renders localized
        HTML for Desktop/Web handoff. It does not exchange the code or mint Hub
        session tokens; clients still call POST /client/auth/oidc/callback for
        the server-side exchange.
      x-agenthub-status: implemented
      x-agenthub-owner: Hub
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Localized HTML success page.
          content:
            text/html:
              schema: { type: string }
        "400":
          description: Localized HTML missing-parameter page.
          content:
            text/html:
              schema: { type: string }
    post:
      tags: [HubSyncRelay]
      operationId: hubOidcCallback
      summary: Exchange TokenDance ID OIDC code for a Hub session.
      description: >
        Public Hub session exchange endpoint. The client posts the browser callback
        code/state, its PKCE verifier, and the same Hub device proof used at authorize
        time. Hub exchanges the code with TokenDance ID, validates the ID token through
        RS256/JWKS plus issuer/audience/expiration checks, maps TokenDance ID sub to a
        Hub user, then returns Hub-local access and refresh tokens. Raw TokenDance ID
        bearer tokens are not used as Hub sessions.
      x-agenthub-status: implemented
      x-agenthub-owner: Hub
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HubOIDCCallbackRequest"
      responses:
        "200":
          description: Hub-local session tokens and mapped Hub user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HubOIDCCallbackResponse"
        "400":
          $ref: "#/components/responses/Error"

  # ── Contacts ──

  /client/contacts/{userId}:
    delete:
      tags: [HubSyncRelay]
      operationId: hubRemoveContact
      summary: Remove a contact.
      x-agenthub-status: implemented
