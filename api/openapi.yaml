      in: path
      required: true
      schema:
        type: string
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        type: string
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema:
        type: string
    EdgeId:
      name: edgeId
      in: path
      required: true
      schema:
        type: string
    CommandId:
      name: commandId
      in: path
      required: true
      schema:
        type: string
  schemas:
    SessionCreate:
      type: object
      required: [session_id, type, created]
      properties:
        session_id: { type: string, format: uuid }
        type:
          type: string
          enum: [private, group]
        created: { type: boolean }

    HubUser:
      type: object
      required: [id, username, nickname, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        nickname: { type: string }
        avatar_url: { type: string }
        tokendance_sub: { type: string, nullable: true }
        tokendance_sub_linked_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AuthRefreshResponse:
      type: object
      required: [access_token, refresh_token, expires_in]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in: { type: integer, format: int64 }

    Resource:
      type: object
      additionalProperties: true
    ListResponse:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
