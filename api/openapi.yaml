  /v1/permissions/decide:
    post:
      tags: [ExecutionRunner]
      operationId: decidePermission
      summary: Approve or deny a pending permission request.
      description: >
        Resolves a pending tool-permission request of a run. Under Hub JWT /
        multi-user mode the run must be owned by the caller; a run owned by
        another Hub user and a nonexistent run are reported identically (404),
        so this endpoint is not a runId existence oracle. A caller without a Hub
        identity fails closed. Local single-tenant mode is unaffected.
      x-agenthub-status: implemented
      x-agenthub-owner: Edge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [runId, requestId, decision]
              properties:
                runId: { type: string }
                requestId: { type: string }
                decision: { type: string, enum: [allow, deny] }
                reason: { type: string }
      responses:
        "200":
          description: Decision recorded.
        "400":
          description: Invalid decision payload.
        "404":
          description: >
            Pending permission request not found. The same response is returned
            when the run belongs to another Hub user, so a foreign runId and a
            nonexistent runId are indistinguishable.

  /v1/plans/decide:
    post:
      tags: [ExecutionRunner]
      operationId: decidePlan
      summary: Approve or reject a pending orchestrator plan.
      description: >
        Plan confirmation gate (P0 #3). Resolves a pending plan for the given
        run via the PlanApprovalBroker. The resolved plan_approved /
        plan_rejected event is emitted by the dispatch interceptor once the
        broker decision resolves; this endpoint only records the decision.
        Under Hub JWT / multi-user mode the run must be owned by the caller; a
        run owned by another Hub user and a nonexistent run are reported
        identically (404), so this endpoint is not a runId existence oracle. A
        caller without a Hub identity fails closed. Local single-tenant mode is
        unaffected.
      x-agenthub-phase: P0
      x-agenthub-status: implemented
      x-agenthub-owner: Edge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [runId, decision]
              properties:
