  /v1/deployments:
    post:
      tags: [ExecutionRunner]
      operationId: createDeployment
      summary: Deploy run artifacts to a static site target.
      description: >
        Collects a finished run's artifacts, archives them, and SCPs the
        archive to the configured deployment target. The slug becomes the
