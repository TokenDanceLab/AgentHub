  /v1/runs/{runId}/apply:
    post:
      tags: [ExecutionRunner]
      operationId: applyRunDiffHunk
      summary: Apply a single run diff hunk to the filesystem.
      description: >
        Applies one accepted hunk decision for a finished run to the workspace
        filesystem. Reads the run's persisted diff, applies the selected hunk,
        and returns the updated diff state. workDir must be within the Edge
        workspace allowlist.
      x-agenthub-phase: P0
      x-agenthub-status: implemented
      x-agenthub-owner: Edge
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file_path, hunk_index, accepted]
              properties:
                file_path:
                  type: string
                  description: Workspace-relative file path whose hunk is being decided.
                hunk_index:
                  type: integer
                  minimum: 0
                  description: Zero-based hunk index within the file's unified diff.
                accepted:
                  type: boolean
                  description: When true the hunk is written to the filesystem; when false it is recorded as rejected without writing.
                workDir:
                  type: string
                  description: Absolute workspace root; must be within the Edge workspace allowlist. Required when accepted is true.
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

