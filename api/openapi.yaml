      operationId: hubTeamRunReviewDecision
      x-agenthub-role: team-member
      summary: Record a human review decision on a team run DAG plan (ADR-008).
      description: Requires team member (owner or agent-profile owner installed in the team; not satisfied by global admin alone). Applies the reviewer's approve/discuss/modify decision to the pending review gate and returns the recorded review state.
