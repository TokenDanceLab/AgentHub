  /client/ws:
    get:
      tags: [HubSyncRelay]
      operationId: hubWebSocket
      summary: Hub WebSocket — real-time IM + agent dispatch.
      description: >
        Main Hub WebSocket route. The production route validates a Hub-issued
        HS256 access token during HTTP upgrade, using either `access_token` query
        auth for browser clients or `Authorization: Bearer <token>` for native
        clients. TokenDance ID RS256 bearer tokens and TokenDance API keys are
        not Hub WebSocket credentials. The legacy first-frame `auth` event is
        only for tests and compatibility entries that do not install
        WSAuthMiddleware. See api/events.md for Hub event types.
      x-agenthub-status: implemented
      x-agenthub-owner: Hub
      security:
        - hubWebSocketQueryToken: []
        - bearerAuth: []
      parameters:
        - name: access_token
          in: query
          required: false
          schema: { type: string }
          description: Hub-issued HS256 access token for browser WebSocket upgrade authentication.
      responses:
        "101":
          description: Switching Protocols.
        "401":
          $ref: "#/components/responses/Error"

  /web/agent-tasks:
    x-agenthub-device-type: web
    post:
      tags: [HubSyncRelay]
      operationId: hubTriggerTask
      summary: Trigger an agent task from web client.
      x-agenthub-status: implemented
      x-agenthub-owner: Hub
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trigger_message_id]
              properties:
                trigger_message_id:
                  type: string
                agent_instance_id:
                  type: string
                  description: Optional exact AgentInstance id to dispatch. When provided, Hub must not fall back to another agent.
                agent_type:
                  type: string
                  description: Optional Edge Runtime adapter id such as codex, claude-code, or opencode.
                custom_agent_id:
                  type: string
                  description: Optional CustomAgent id to dispatch. When provided, Hub must not fall back to another custom agent.
                model_params:
                  type: string
                  description: Optional JSON string with model/provider/reasoning hints copied into the agent.dispatch payload.
                target_id:
                  type: string
                  format: uuid
                  description: Optional owner-scoped ExecutionTarget id. Hub validates owner, dispatchable target type, and bound desktop device, persists target_id and edge_device_id on the pending task, routes agent.dispatch only to that device, and queues offline work in a target/device queue without falling back to another desktop. Remote/cloud targets still require future relay/provisioning work before they are product-complete.
      responses:
        "200":
          description: Task dispatched.

  /web/agent-tasks/{id}/events:
    x-agenthub-device-type: web
    get:
      tags: [HubSyncRelay]
      operationId: hubListTaskRunEvents
      summary: List typed runtime events persisted for an agent task.
      x-agenthub-status: implemented
      x-agenthub-owner: Hub
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: event_type
          in: query
          required: false
          schema: { type: string }
          description: Optional exact runtime event type filter.
        - name: after_seq
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0 }
          description: Return only events with event_seq greater than this value.
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 0, maximum: 500 }
          description: Optional maximum number of events. Values above 500 are clamped by Hub.
      responses:
        "200":
          description: Ordered runtime events for replay.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string }
                  data:
                    type: array
                    items:
