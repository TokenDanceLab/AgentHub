components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Hub HS256 access token
      description: >
        Hub-issued access token minted by Hub Server after password login or
        TokenDance ID OIDC exchange. Do not send a raw TokenDance ID RS256
        bearer token or a Relay API key to Hub REST/WebSocket endpoints.
    edgeBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Local Edge token
      description: >
        Optional Local Edge token configured by AGENTHUB_EDGE_AUTH_TOKEN or
        --local-auth-token. This is only the loopback Edge process boundary and
        is not a Hub session, TokenDance ID token, or Relay API key.
    edgeLocalToken:
      type: apiKey
      in: header
      name: X-AgentHub-Edge-Token
      description: >
        Header alternative for the optional Local Edge token when Authorization
        is already owned by another caller context.
    edgeWebSocketQueryToken:
      type: apiKey
      in: query
      name: access_token
      description: >
        Browser WebSocket transport for the optional Local Edge token on
        /v1/events. Hub WebSocket uses Hub-issued access tokens separately.
    hubWebSocketQueryToken:
      type: apiKey
      in: query
      name: access_token
      description: >
        Hub-issued HS256 access token used by browser clients during /client/ws
        HTTP upgrade. TokenDance ID bearer tokens and TokenDance API keys are
        not accepted.
  parameters:
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    PageCursor:
      name: pageCursor
      in: query
      required: false
      schema:
        type: string
    ProjectIdQuery:
      name: projectId
      in: query
      required: false
      schema:
        type: string
    ThreadIdQuery:
      name: threadId
      in: query
      required: false
      schema:
        type: string
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
    MemberId:
      name: memberId
      in: path
      required: true
      schema:
        type: string
    MsgId:
      name: msgId
      in: path
      required: true
      schema:
        type: string
    ThreadId:
      name: threadId
      in: path
      required: true
      schema:
        type: string
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
    RunnerId:
      name: runnerId
      in: path
      required: true
      schema:
        type: string
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
    ApprovalId:
      name: approvalId
      in: path
      required: true
      schema:
        type: string
    ArtifactId:
      name: artifactId
      in: path
      required: true
      schema:
        type: string
    PreviewId:
      name: previewId
      in: path
      required: true
      schema:
        type: string
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        type: string
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema:
        type: string
    EdgeId:
      name: edgeId
      in: path
      required: true
      schema:
        type: string
    CommandId:
      name: commandId
      in: path
      required: true
      schema:
        type: string
  schemas:
    Resource:
      type: object
      additionalProperties: true
    ListResponse:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Resource"
        page:
          $ref: "#/components/schemas/PageInfo"
    PageInfo:
      type: object
      required: [hasMore]
      properties:
        nextCursor:
          type: string
        hasMore:
          type: boolean
    RunDiffFile:
      type: object
      required: [path, diff, status]
      properties:
        path:
          type: string
          description: Workspace-relative path or an already-sanitized outside-workspace marker.
        diff:
          type: string
          description: Unified diff text for this file. Empty when no diff body is available yet.
        status:
          type: string
          enum: [added, modified, deleted]
    RunDiff:
      type: object
      required: [runId, files]
      properties:
        runId:
          type: string
        files:
          type: array
          items:
            $ref: "#/components/schemas/RunDiffFile"
    RunDiffResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: string
          enum: [OK]
        data:
          $ref: "#/components/schemas/RunDiff"
    ModelCatalogResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: string
          enum: [OK]
        data:
          $ref: "#/components/schemas/ModelCatalog"
    ModelCatalog:
      type: object
      required: [items, sources]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ModelCatalogItem"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/ModelCatalogSource"
    ModelCatalogItem:
      type: object
      required: [id, value, label, sourceId, sourceLabel, status]
      properties:
        id:
          type: string
        value:
          type: string
        label:
          type: string
        provider:
          type: string
        runtimeId:
          type: string
        resolvedModel:
          type: string
        sourceId:
          type: string
        sourceLabel:
          type: string
        status:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        reasoningEfforts:
          type: array
          items:
            type: string
        default:
          type: boolean
    ModelCatalogSource:
      type: object
      required: [id, label, status]
      properties:
        id:
          type: string
        label:
          type: string
        status:
          type: string
        detail:
          type: string
    Artifact:
      type: object
      required: [id, runId, threadId, kind, path, sizeBytes, createdAt]
      properties:
        id:
          type: string
        runId:
          type: string
        threadId:
          type: string
        kind:
          type: string
          description: Artifact category such as patch, file, image, document, or web.
        path:
          type: string
          description: Workspace-relative artifact path or logical artifact name.
        sizeBytes:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ArtifactList:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Artifact"
        page:
          $ref: "#/components/schemas/PageInfo"
    ArtifactListResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: string
          enum: [OK]
        data:
          $ref: "#/components/schemas/ArtifactList"
    Preview:
      type: object
      required: [id, runId, threadId, status, createdAt]
      properties:
        id:
          type: string
        runId:
          type: string
        threadId:
          type: string
        url:
          type: string
          format: uri
          description: Local preview URL when a preview is already ready.
        status:
          type: string
          enum: [starting, ready, stopped]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PreviewList:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Preview"
        page:
          $ref: "#/components/schemas/PageInfo"
    PreviewListResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: string
          enum: [OK]
        data:
          $ref: "#/components/schemas/PreviewList"
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            traceId:
              type: string
            details:
              type: object
              additionalProperties: true
    HubOIDCAuthorizeRequest:
      type: object
      required: [code_challenge, device_type, device_id]
      properties:
        code_challenge:
          type: string
          description: PKCE S256 code challenge generated by the client.
        code_challenge_method:
          type: string
          enum: [S256]
          default: S256
          description: Hub accepts only S256; omitted values default to S256.
        device_type:
          type: string
          enum: [desktop, web, cli]
          description: Hub device class for the resulting local session.
        device_id:
          type: string
          format: uuid
          description: Stable Hub device UUID; must match the callback request. Current target-bound dispatch requires an owner-owned desktop device; remote/cloud routing remains future work.
        redirect_uri:
          type: string
          format: uri
          description: Optional browser redirect URI for this PKCE round trip. When omitted, Hub uses its configured TokenDance ID redirect URI.
    HubOIDCAuthorizeResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: string
          enum: [OK]
        message:
          type: string
        data:
          type: object
          required: [state, authorization_url]
          properties:
            state:
              type: string
              description: One-time Hub state value bound to PKCE and device proof.
            authorization_url:
              type: string
              format: uri
              description: TokenDance ID /oidc/authorize URL to open in the browser.
    HubOIDCCallbackRequest:
      type: object
      required: [code, state, code_verifier, device_type, device_id]
      properties:
        code:
          type: string
          description: Authorization code returned by TokenDance ID.
        state:
          type: string
          description: Hub state returned from /client/auth/oidc/authorize.
        code_verifier:
          type: string
          description: Original PKCE verifier corresponding to the S256 challenge.
        device_type:
          type: string
          enum: [desktop, web, cli]
        device_id:
          type: string
          format: uuid
          description: Same stable Hub device UUID used in the authorize request.
        redirect_uri:
          type: string
          format: uri
          description: Same redirect URI used in the authorize request. Optional for legacy desktop clients that use the configured Hub redirect URI.
    HubOIDCCallbackResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: string
          enum: [OK]
        message:
          type: string
        data:
          type: object
          required: [access_token, refresh_token, expires_in, user]
          properties:
            access_token:
              type: string
              description: Hub-local HS256 access token for REST and WebSocket auth.
            refresh_token:
              type: string
              description: Hub-local refresh token; not a TokenDance ID refresh token.
            expires_in:
              type: integer
              format: int64
              description: Hub access token lifetime in seconds.
            user:
              type: object
              required: [id, username, nickname]
              properties:
                id:
                  type: string
                  format: uuid
                username:
                  type: string
                nickname:
                  type: string
                avatar_url:
                  type: string
                tokendance_sub:
                  type: string
                  description: TokenDance ID subject mapped to this Hub user.
    HubTaskAckRequest:
      type: object
      properties:
        run_id:
          type: string
          maxLength: 128
          description: Edge run id returned by POST /v1/runs.
        edge_run_id:
          type: string
          maxLength: 128
          description: Alias for run_id for explicit Hub persistence.
    HubTaskStreamRequest:
      type: object
      anyOf:
        - required: [content]
        - required: [chunk]
        - required: [payload]
      properties:
        content:
          type: string
          maxLength: 1048576
          description: 'Legacy stream content. If not valid JSON, Hub wraps it as {"content": "..."} for jsonb storage. Normalized payload/message content must stay within the 1 MiB per-event budget.'
        chunk:
          type: string
          maxLength: 1048576
          description: Legacy alias for content. Normalized payload/message content must stay within the 1 MiB per-event budget.
        event_type:
          type: string
          maxLength: 96
          description: Typed AgentHub runtime event name, for example run.output.batch or run.agent.tool_call.
        payload:
          type: object
          additionalProperties: true
          description: Typed runtime payload persisted as jsonb and broadcast as agent.stream. The encoded JSON payload must stay within the 1 MiB per-event budget.
        client_msg_id:
          type: string
          format: uuid
          description: Client-generated message id for idempotent stream dedup.
        run_id:
          type: string
          maxLength: 128
          description: Edge run id.
        edge_run_id:
          type: string
          maxLength: 128
          description: Alias for run_id.
    AgentRunEvent:
      type: object
      properties:
        id:
          type: string
        task_id:
          type: string
        edge_run_id:
          type: string
          maxLength: 128
        session_id:
          type: string
        agent_instance_id:
          type: string
        event_seq:
          type: integer
          format: int64
        event_type:
          type: string
        payload:
          type: object
          additionalProperties: true
          description: Runtime payload persisted by Hub. Encoded JSON is capped at 1 MiB on stream ingest.
        created_at:
          type: string
          format: date-time
    AgentRunEventSummary:
      type: object
      properties:
        task_id:
          type: string
        edge_run_id:
          type: string
          maxLength: 128
        status:
          type: string
          description: Current Hub pending task status.
        total_events:
          type: integer
        last_event_seq:
          type: integer
          format: int64
        event_type_counts:
          type: object
          additionalProperties:
            type: integer
        tool_call_count:
          type: integer
        step_count:
          type: integer
        artifact_count:
          type: integer
        approval_count:
          type: integer
        pending_approvals:
          type: integer
        decided_approvals:
          type: integer
        input_tokens:
          type: integer
        output_tokens:
          type: integer
        output_bytes:
          type: integer
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        elapsed_ms:
          type: integer
          format: int64
    HubTaskDoneRequest:
      type: object
      properties:
        run_id:
          type: string
          maxLength: 128
          description: Edge run id.
        edge_run_id:
          type: string
          maxLength: 128
          description: Alias for run_id.
        final_content:
          type: string
          maxLength: 1048576
          description: Optional final agent output or summary inserted as the final chat projection. Hub rejects values above the 1 MiB callback payload budget.
    HubTaskFailRequest:
      type: object
      required: [error]
      properties:
        run_id:
          type: string
          maxLength: 128
          description: Edge run id.
        edge_run_id:
          type: string
          maxLength: 128
          description: Alias for run_id.
        error:
          type: string
          maxLength: 1048576
          description: Failure reason persisted on the task and broadcast as agent.failed. Hub rejects values above the 1 MiB callback payload budget.
    StartRunRequest:
      type: object
      properties:
        projectId:
          type: string
          description: Project to bind the run to. Defaults to the local project in P0 compatibility mode.
        threadId:
          type: string
          description: Thread to bind the run to. Defaults to the local thread in P0 compatibility mode.
        prompt:
          type: string
          description: User message or task description passed to the agent.
        agentId:
          type: string
          description: Agent adapter ID (claude-code, codex, opencode, orchestrator). Defaults to the server's --agent-default.
        model:
          type: string
          description: Model override for this run (e.g. claude-sonnet-4-6).
        sessionId:
          type: string
          description: Resume a specific session by ID (Claude Code --resume, OpenCode --session).
        continue:
          type: boolean
          description: Continue the most recent session (Claude Code --continue, OpenCode --continue).
        fork:
          type: boolean
          description: Fork session before continuing (Claude Code --fork-session, OpenCode --fork).
        reasoningEffort:
          type: string
          description: >
            Reasoning effort level. Claude Code values: low, medium, high, max.
            Codex values: minimal, low, medium, high, xhigh.
            OpenCode: passed as --variant for thinking control.
        thinkingMode:
          type: string
          description: Thinking mode override for runtimes that expose an explicit thinking switch.
        maxThinkingTokens:
          type: integer
          description: Maximum thinking token budget (Claude Code --max-thinking-tokens).
        permissionMode:
          type: string
          description: >
            Claude Code permission mode: default, acceptEdits, bypassPermissions, plan, dontAsk.
            Also mapped to Codex --sandbox level.
        workDir:
          type: string
          description: Working directory override for this run. Defaults to the Edge process profile workdir.
        includePartial:
          type: boolean
          description: Include partial stream_event messages for real-time deltas (Claude Code --include-partial-messages).
        structuredOutputSchema:
          type: string
          description: Optional JSON Schema string passed to runtimes that support structured output, currently Claude Code --json-schema.
        systemPrompt:
          type: string
          description: Runtime system prompt override, usually derived from a Hub CustomAgent/Profile policy.
        appendSystemPrompt:
          type: string
          description: Additional prompt text appended to the runtime default system prompt.
        allowedTools:
          type: array
          items:
            type: string
          description: Tool allowlist passed to runtimes that support tool-scoped execution.
        configOverrides:
          type: object
          additionalProperties:
            type: string
          description: Runtime-specific key/value config overrides, currently consumed by Codex as -c entries.
        ephemeral:
          type: boolean
          description: Request a no-persistent-session run for runtimes that support it.
        hubTaskId:
          type: string
          description: Optional Hub task id for Edge-owned Hub callbacks. Desktop bridge usually streams callbacks itself and should avoid duplicate callback paths.
