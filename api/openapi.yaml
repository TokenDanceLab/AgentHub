      operationId: hubHealth
      summary: Hub health check (DB + Redis + migrations).
      description: >
        Aggregate health probe. Answers 200 with the component report while the
        health wiring is live, including when a dependency is degraded (the body
        carries status/ready so callers can tell those apart). Answers 503 with
        status "unavailable" and ready false only when no health reporting is
        wired into the process at all, so a probe can never read "ok" from a
        build that verified nothing. Use /health/live for liveness: it stays 200
        in both cases.
      x-agenthub-status: implemented
      x-agenthub-owner: Hub
      responses:
        "200":
          $ref: "#/components/responses/Ok"

        "500":
          $ref: "#/components/responses/Error"

