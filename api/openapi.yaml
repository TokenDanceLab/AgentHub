  # ── Documents (Docs Hub) ──

  /web/documents:
    x-agenthub-device-type: web
    get:
      tags: [HubSyncRelay]
      operationId: hubListDocuments
      summary: List cloud documents owned by the authenticated user.
      description: Query filters are bound from the query string; unparsable values are ignored rather than rejected. Returns an items array that is an empty list when nothing matches.
      x-agenthub-status: implemented
      x-agenthub-owner: Hub
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer }
        - name: after
          in: query
          required: false
          schema: { type: string }
          description: Cursor — return documents after this document id.
        - name: source
          in: query
          required: false
          schema: { type: string }
        - name: search
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Lightweight document list items (document content is omitted).
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string }
                  message: { type: string }
                  data:
                    type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/HubDocumentListItem"
        "401":
          $ref: "#/components/responses/Error"
    post:
      tags: [HubSyncRelay]
      operationId: hubCreateDocument
      summary: Create a cloud document.
      x-agenthub-status: implemented
      x-agenthub-owner: Hub
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                type:
                  type: string
                  description: Document format such as md. Hub defaults to md when omitted.
                tag:
                  type: string
                  nullable: true
                location:
                  type: string
                  description: Library/folder label. Hub applies its default library when omitted.
                content:
                  type: string
                  nullable: true
      responses:
        "200":
          description: The created document.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string }
                  message: { type: string }
                  data:
                    $ref: "#/components/schemas/HubDocument"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"

