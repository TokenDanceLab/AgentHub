openapi: 3.1.0
info:
  title: AgentHub REST API
  version: v1
  description: >
    AgentHub REST JSON API for commands and queries. Realtime state, logs,
    message deltas, approvals and artifact notifications are delivered through
    WebSocket typed events documented in api/events.md.

    ## Implementation Status (2026-05-29)

    **Edge Server**: Core endpoints (health/runs/threads/projects/agents/events/permissions)
    are implemented. `/v1/runners` remains a compatibility surface for runtime/
    target health; new architecture language should use Agent Runtime, Agent
    Profile, and Execution Target.

    **Hub Server**: Hub entries marked `x-agenthub-status: implemented` mirror
    the current Gin router paths in `hub-server/internal/router/router.go`,
    including `/client/auth`, `/client/contacts`, `/client/sessions`,
    `/client/messages`, `/client/attachments`, `/client/notifications`,
    `/edge/*`, and `/web/*`. Deprecated or legacy Hub shapes are retained only
    when marked `planned`; they are not callable routes.
    The legacy `/v1/auth`, `/v1/users`, `/v1/contacts` paths are planned for future
    migration and not currently implemented.

    ## Hub success envelope code

    Hub Server success responses use `{"code":"ok","data":...}` with lowercase
    `ok` (`hub-server/internal/errcode.OK.Code` via `handler.OK`). This is not
    HTTP status text and is not the Edge success shape (Edge returns bare JSON).
    Some older OpenAPI fragments and client fixtures used uppercase `OK`; the
    wire value on tip is lowercase `ok`. Shared clients treat success
    case-insensitively (`isHubSuccessCode`) for fixture compatibility — that is
    parser tolerance, not a dual wire contract. See `api/conventions.md`.

    ## Status tags
    - `x-agenthub-status: implemented` — 已实现，可直接调用
    - `x-agenthub-status: planned` — 远期规划，尚未实现
servers:
  - url: http://127.0.0.1:3210
    description: Local Edge Server
  - url: http://localhost:8080
    description: Local Hub Server
  - url: https://hub.vectorcontrol.tech
    description: Production Hub Server
tags:
  - name: Foundation
    description: Health, capability and event stream handshake.
  - name: IMProject
    description: Project, conversation, thread, message and item APIs.
  - name: ExecutionRunner
    description: Agent Runtime, compatibility runner health, AgentRun, approval, artifact, preview and workspace APIs.
  - name: HubSyncRelay
    description: Auth, user, contact, group, device, edge, sync, relay and cloud APIs.

paths:
  # ═══════════════════════════════════════════════════════════
  # Edge Server — Implementation Status
  #
  # IMPLEMENTED: /v1/health, /v1/events, /v1/projects (GET/POST),
  #   /v1/projects/{projectId} (GET only), /v1/threads (GET/POST),
  #   /v1/threads/{threadId} (GET/PATCH/DELETE), /v1/threads/{threadId}/items,
  #   /v1/threads/{threadId}/messages, /v1/threads/{threadId}/pins,
  #   /v1/items/{itemId},
  #   /v1/model-catalog,
  #   /v1/runners (GET only), /v1/agents, /v1/runs (GET/POST),
  #   /v1/runs/{runId} (GET), /v1/runs/{runId}:cancel,
  #   /v1/runs/{runId}/diff (GET),
  #   /v1/runs/{runId}/checkpoint (GET), /v1/runs/{runId}/checkpoint/file (GET),
  #   /v1/artifacts (GET),
  #   /v1/artifacts/{artifactId} (GET), /v1/previews (GET/POST),
  #   /v1/previews/{previewId} (GET), /v1/previews/{previewId}:stop,
  #   /v1/metrics, /v1/agent-instances (GET only), /v1/agent-instances/{id},
  #   /v1/permissions/decide,
  #   /v1/runs/{runId}/apply (POST), /v1/runs/{runId}/apply-all (POST),
  #   /v1/plans/decide (POST), /v1/plans/pending (GET),
  #   /v1/delivery-journal (GET), /v1/users (GET), /v1/users/current (GET),
  #   /v1/agent-profiles (GET/POST), /v1/agent-profiles/{profileId} (GET/PATCH/DELETE),
  #   /v1/settings (GET/PATCH), /v1/runtime-sessions (GET),
  #   /v1/ccswitch/status (GET), /v1/ccswitch/providers (GET),
  #   /v1/deployments (POST), /v1/memory (GET/POST)
  #
  # PLANNED (documented but not yet implemented):
  #   PATCH/DELETE /v1/projects/{projectId},
  #   GET/PATCH /v1/projects/{projectId}/memory,
  #   GET/POST /v1/conversations,
  #   GET/PATCH /v1/conversations/{conversationId},
  #   POST /v1/conversations/{conversationId}:archive,
  #   GET/POST /v1/conversations/{conversationId}/members,
  #   DELETE /v1/conversations/{conversationId}/members/{memberId},
  #   POST /v1/threads/{threadId}:fork,
  #   GET /v1/runners/{runnerId},
  #   POST /v1/runners/{runnerId}:ping,
  #   POST /v1/runners/{runnerId}:drain,
  #   POST /v1/runs/{runId}:interrupt,
  #   POST /v1/runs/{runId}:resume,
  #   POST /v1/runs/{runId}:retry,
  #   GET /v1/runs/{runId}/items,
  #   GET /v1/runs/{runId}/logs,
  #   GET/POST /v1/approvals and nested,
  #   POST /v1/artifacts and nested content/apply/discard,
  #   GET /v1/workspaces/{workspaceId} and nested,
  #   POST /v1/agent-instances
  # ═══════════════════════════════════════════════════════════

  /v1/health:
    get:
      tags: [Foundation]
      operationId: getHealth
      summary: Health check.
      x-agenthub-phase: P0
      x-agenthub-status: implemented
      x-agenthub-owner: Edge
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /v1/events:
    get:
      tags: [Foundation]
      operationId: openEventStream
      summary: Open WebSocket event stream.
      description: >
        Local Edge WebSocket handshake surface. Event envelope and event types are
        documented in api/events.md. When local Edge auth is enabled, browser
        clients use `access_token` query auth; native clients may use the same
        local Edge token through Authorization or X-AgentHub-Edge-Token.
      x-agenthub-phase: P0
      x-agenthub-status: implemented
      x-agenthub-owner: Edge
      security:
        - edgeWebSocketQueryToken: []
        - edgeBearerAuth: []
        - edgeLocalToken: []
      parameters:
        - $ref: "#/components/parameters/PageCursor"
        - name: cursor
          in: query
          required: false
          schema: { type: integer, format: int64 }
          description: >
            Numeric event-sequence cursor for replay. Alias for `pageCursor`;
            `cursor` takes precedence when both are present. The Edge handler
            accepts either name for backwards compatibility.
      responses:
        "101":
          description: Switching Protocols.
        "401":
          $ref: "#/components/responses/Error"

  /v1/projects:
    get:
      tags: [IMProject]
      operationId: listProjects
      summary: List projects.
      x-agenthub-phase: P0
      x-agenthub-status: implemented
      x-agenthub-owner: Edge
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageCursor"
      responses:
        "200":
          $ref: "#/components/responses/List"
    post:
      tags: [IMProject]
      operationId: createProject
      summary: Create or register a project.
      x-agenthub-phase: P0
      x-agenthub-status: implemented
      x-agenthub-owner: Edge
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          $ref: "#/components/responses/Created"

  /v1/projects/{projectId}:
    get:
      tags: [IMProject]
      operationId: getProject
      summary: Get project.
      x-agenthub-phase: P0
      x-agenthub-status: implemented
      x-agenthub-owner: Edge
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      tags: [IMProject]
      operationId: updateProject
      summary: Update project.
      x-agenthub-phase: P1
      x-agenthub-status: planned
      x-agenthub-owner: Edge
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
    delete:
      tags: [IMProject]
      operationId: deleteProject
      summary: Delete or unregister project.
      x-agenthub-phase: P1
      x-agenthub-status: planned
      x-agenthub-owner: Edge
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "204":
          description: Deleted.

  /v1/projects/{projectId}/memory:
    get:
      tags: [IMProject]
      operationId: getProjectMemory
      summary: Get project memory metadata.
      x-agenthub-phase: P0
      x-agenthub-status: planned
      x-agenthub-owner: Edge
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
    patch:
      tags: [IMProject]
      operationId: updateProjectMemory
      summary: Update project memory metadata.
      x-agenthub-phase: P1
      x-agenthub-status: planned
      x-agenthub-owner: Edge
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /v1/conversations:
    get:
      tags: [IMProject]
      operationId: listConversations
      summary: List conversations.
      x-agenthub-superseded-by: "GET /client/sessions"
      x-agenthub-phase: P1
      x-agenthub-status: planned
      x-agenthub-owner: Hub
      responses:
        "200":
          $ref: "#/components/responses/List"
    post:
      tags: [IMProject]
      operationId: createConversation
      summary: Create conversation.
      x-agenthub-superseded-by: "POST /client/sessions"
      x-agenthub-phase: P1
      x-agenthub-status: planned
      x-agenthub-owner: Hub
      responses:
        "201":
          $ref: "#/components/responses/Created"

  /v1/conversations/{conversationId}:
    get:
      tags: [IMProject]
      operationId: getConversation
      summary: Get conversation.
      x-agenthub-phase: P1
      x-agenthub-status: planned
      x-agenthub-owner: Hub
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
    patch:
      tags: [IMProject]
      operationId: updateConversation
      summary: Update conversation.
      x-agenthub-phase: P1
      x-agenthub-status: planned
      x-agenthub-owner: Hub
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /v1/conversations/{conversationId}:archive:
    post:
      tags: [IMProject]
      operationId: archiveConversation
      summary: Archive conversation.
      x-agenthub-phase: P1
      x-agenthub-status: planned
      x-agenthub-owner: Hub
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "202":
          $ref: "#/components/responses/Accepted"

  /v1/conversations/{conversationId}/members:
    get:
      tags: [IMProject]
      operationId: listConversationMembers
      summary: List conversation members.
      x-agenthub-phase: P1
      x-agenthub-status: planned
      x-agenthub-owner: Hub
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          $ref: "#/components/responses/List"
    post:
      tags: [IMProject]
      operationId: addConversationMember
      summary: Add conversation member.
      x-agenthub-phase: P1
      x-agenthub-status: planned
      x-agenthub-owner: Hub
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "201":
          $ref: "#/components/responses/Created"

  /v1/conversations/{conversationId}/members/{memberId}:
    delete:
      tags: [IMProject]
      operationId: removeConversationMember
      summary: Remove conversation member.
      x-agenthub-phase: P1
      x-agenthub-status: planned
      x-agenthub-owner: Hub
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/MemberId"
      responses:
        "204":
          description: Removed.

  /v1/threads:
    get:
      tags: [IMProject]
      operationId: listThreads
      summary: List threads.
      x-agenthub-phase: P0
      x-agenthub-status: implemented
      x-agenthub-owner: Edge
      parameters:
        - $ref: "#/components/parameters/ProjectIdQuery"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageCursor"
      responses:
        "200":
          description: >
            Thread list. Edge implementation returns {items, page:{hasMore:false}}
            and never sends nextCursor (response_dto.go hardcodes hasMore:false).
            The pageCursor/nextCursor parameters are accepted but ignored by Edge.
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Resource"
                  page:
                    type: object
                    required: [hasMore]
                    properties:
                      hasMore:
                        type: boolean
                        description: Always false on Edge (no cursor pagination).
    post:
      tags: [IMProject]
      operationId: createThread
      summary: Create thread.
      x-agenthub-phase: P0
      x-agenthub-status: implemented
      x-agenthub-owner: Edge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateThreadRequest"
      responses:
        "201":
          $ref: "#/components/responses/Created"

  /v1/threads/{threadId}:
    get:
      tags: [IMProject]
      operationId: getThread
      summary: Get thread.
      x-agenthub-phase: P0
      x-agenthub-status: implemented
      x-agenthub-owner: Edge
      parameters:
        - $ref: "#/components/parameters/ThreadId"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
    patch:
      tags: [IMProject]
      operationId: updateThread
      summary: Update thread.
      x-agenthub-phase: P0
      x-agenthub-status: implemented
      x-agenthub-owner: Edge
      parameters:
        - $ref: "#/components/parameters/ThreadId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateThreadRequest"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
    delete:
      tags: [IMProject]
      operationId: deleteThread
      summary: Delete thread and associated local run/item records.
      x-agenthub-phase: P0
      x-agenthub-status: implemented
      x-agenthub-owner: Edge
      parameters:
        - $ref: "#/components/parameters/ThreadId"
      responses:
        "204":
          description: Deleted.

  /v1/threads/{threadId}:archive:
    post:
      tags: [IMProject]
      operationId: archiveThread
      summary: Archive thread.
      x-agenthub-phase: P0
      x-agenthub-status: implemented
      x-agenthub-owner: Edge
      parameters:
        - $ref: "#/components/parameters/ThreadId"
      responses:
        "202":
          $ref: "#/components/responses/Accepted"

  /v1/threads/{threadId}:fork:
    post:
      tags: [IMProject]
      operationId: forkThread
      summary: Fork thread.
      x-agenthub-phase: P1
      x-agenthub-status: planned
      x-agenthub-owner: Edge
      parameters:
        - $ref: "#/components/parameters/ThreadId"
      responses:
        "201":
          $ref: "#/components/responses/Created"

  /v1/threads/{threadId}/items:
    get:
      tags: [IMProject]
      operationId: listThreadItems
      summary: List thread items.
      x-agenthub-phase: P0
      x-agenthub-status: implemented
      x-agenthub-owner: Edge
      parameters:
        - $ref: "#/components/parameters/ThreadId"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageCursor"
      responses:
        "200":
          $ref: "#/components/responses/List"

  /v1/threads/{threadId}/pins:
    get:
      tags: [IMProject]
      operationId: listThreadPins
      summary: List pinned thread items.
      description: Returns Edge-local thread pin metadata with each pinned item hydrated when the item still exists.
      x-agenthub-phase: P0
      x-agenthub-status: implemented
      x-agenthub-owner: Edge
      parameters:
        - $ref: "#/components/parameters/ThreadId"
      responses:
        "200":
          description: Pinned items list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreadPinListResponse"
        "404":
          $ref: "#/components/responses/Error"
    post:
      tags: [IMProject]
      operationId: pinThreadItem
      summary: Pin an item in a thread.
      x-agenthub-phase: P0
      x-agenthub-status: implemented
      x-agenthub-owner: Edge
      parameters:
        - $ref: "#/components/parameters/ThreadId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PinThreadItemRequest"
      responses:
        "201":
          description: Thread item pin created or updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreadPinResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags: [IMProject]
      operationId: deleteThreadPin
      summary: Remove a pinned item from a thread.
      x-agenthub-phase: P0
      x-agenthub-status: implemented
      x-agenthub-owner: Edge
      parameters:
        - $ref: "#/components/parameters/ThreadId"
        - name: itemId
          in: query
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Thread item pin removed.
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /v1/threads/{threadId}/messages:
    post:
      tags: [IMProject]
      operationId: createThreadMessage
      summary: Create user message in thread.
      x-agenthub-phase: P0
      x-agenthub-status: implemented
      x-agenthub-owner: Edge
      parameters:
        - $ref: "#/components/parameters/ThreadId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateThreadMessageRequest"
      responses:
        "201":
          description: Message item created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /v1/items/{itemId}:
    get:
      tags: [IMProject]
      operationId: getItem
      summary: Get item.
      x-agenthub-phase: P0
      x-agenthub-status: implemented
      x-agenthub-owner: Edge
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /v1/runners:
    get:
      tags: [ExecutionRunner]
      operationId: listRunners
      summary: List runners.
      x-agenthub-phase: P0
      x-agenthub-status: implemented
      x-agenthub-owner: Edge
      responses:
        "200":
          description: Runner list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListResponse"

  /v1/agents:
    get:
      tags: [ExecutionRunner]
      operationId: listAgents
      summary: List available agent adapters.
      x-agenthub-phase: P0
      x-agenthub-status: implemented
      x-agenthub-owner: Edge
      responses:
        "200":
          description: Agent adapter list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListResponse"

  /v1/runners/{runnerId}:
    get:
      tags: [ExecutionRunner]
      operationId: getRunner
      summary: Get runner.
      x-agenthub-phase: P0
      x-agenthub-status: planned
      x-agenthub-owner: Edge
      parameters:
        - $ref: "#/components/parameters/RunnerId"
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /v1/runners/{runnerId}:ping:
    post:
      tags: [ExecutionRunner]
      operationId: pingRunner
      summary: Ping runner.
      x-agenthub-phase: P0
      x-agenthub-status: planned
      x-agenthub-owner: Edge
      parameters:
        - $ref: "#/components/parameters/RunnerId"
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /v1/runners/{runnerId}:drain:
    post:
      tags: [ExecutionRunner]
      operationId: drainRunner
      summary: Stop assigning new runs to runner.
      x-agenthub-phase: P2
      x-agenthub-status: planned
      x-agenthub-owner: Edge
      parameters:
        - $ref: "#/components/parameters/RunnerId"
      responses:
        "202":
          $ref: "#/components/responses/Accepted"

  /v1/runs:
    get:
      tags: [ExecutionRunner]
      operationId: listRuns
      summary: List AgentRuns.
      x-agenthub-phase: P0
      x-agenthub-status: implemented
      x-agenthub-owner: Edge
      security:
        - edgeBearerAuth: []
        - edgeLocalToken: []
      parameters:
        - $ref: "#/components/parameters/ThreadIdQuery"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageCursor"
      responses:
        "200":
          $ref: "#/components/responses/List"
    post:
      tags: [ExecutionRunner]
      operationId: startRun
      summary: Start AgentRun.
      description: >
        Starts a local AgentRun. P0 accepts an empty body for Desktop Shell
        compatibility and falls back to the default local project/thread.
        New callers should pass projectId and threadId explicitly. If the Edge
        process is started with a workspace allowlist, workDir must resolve
        inside one of the allowed roots or the request is rejected before run
        creation.
      x-agenthub-phase: P0
      x-agenthub-status: implemented
      x-agenthub-owner: Edge
      security:
        - edgeBearerAuth: []
        - edgeLocalToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartRunRequest"
      responses:
        "202":
          description: Run accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "403":
          $ref: "#/components/responses/Error"

  /v1/runs/{runId}:
    get:
      tags: [ExecutionRunner]
      operationId: getRun
      summary: Get AgentRun.
      x-agenthub-phase: P0
      x-agenthub-status: implemented
      x-agenthub-owner: Edge
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /v1/runs/{runId}:cancel:
    post:
      tags: [ExecutionRunner]
      operationId: cancelRun
      summary: Cancel AgentRun.
      x-agenthub-phase: P0
      x-agenthub-status: implemented
      x-agenthub-owner: Edge
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "202":
          $ref: "#/components/responses/Accepted"

  /v1/runs/{runId}:interrupt:
    post:
      tags: [ExecutionRunner]
      operationId: interruptRun
      summary: Interrupt AgentRun.
      x-agenthub-phase: P1
      x-agenthub-status: planned
      x-agenthub-owner: Edge
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "202":
          $ref: "#/components/responses/Accepted"

  /v1/runs/{runId}:resume:
    post:
      tags: [ExecutionRunner]
      operationId: resumeRun
      summary: Resume AgentRun.
      x-agenthub-phase: P1
      x-agenthub-status: planned
      x-agenthub-owner: Edge
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "202":
