openapi: 3.0.3
info:
  title: AgentHub API
  version: 0.4.1
  description: "AgentHub REST JSON API — unified Hub + Edge contract.\nHub Server: auth, IM sessions, messages, agent tasks, profiles, skills, MCP, teams, marketplace, provider bindings, execution targets,
    devices, documents, settings, audit, relay, WebSocket.\nEdge Server: health, projects, threads, runs, diffs, artifacts, previews, model catalog, metrics, permissions.\nWebSocket typed events: see api/events.md."
servers:
  - url: http://localhost:8080
    description: Local Hub Server (dev)
  - url: http://127.0.0.1:3210
    description: Local Edge Server (dev)
  - url: https://api.hub.vectorcontrol.tech
    description: Production Hub Server
tags:
  - name: Health
    description: Health checks, liveness, readiness probes
  - name: Auth
    description: Authentication, OIDC PKCE, tokens, profile
  - name: Contacts
    description: Friend management, block, remark
  - name: Sessions
    description: Session/group CRUD, member management
  - name: Messages
    description: Send, recall, edit, pin, reactions, search, forward
  - name: Notifications
    description: Notification list and mark-read
  - name: Attachments
    description: File upload, download, probe
  - name: Devices
    description: Device registration and listing
  - name: Settings
    description: User preference key-value store
  - name: Documents
    description: Cloud document CRUD
  - name: Projects
    description: Project/workspace CRUD and threads
  - name: AgentTasks
    description: Agent task trigger, cancel, events, approvals, artifacts
  - name: EdgeTasks
    description: Edge-side task ack, stream, done, fail callbacks
  - name: AgentProfiles
    description: Agent profile CRUD, publish, install
  - name: Skills
    description: Skill CRUD, publish, unpublish
  - name: MCPServers
    description: MCP server CRUD, publish, unpublish
  - name: Market
    description: Agent profile marketplace
  - name: ProviderBindings
    description: Provider binding CRUD
  - name: ExecutionTargets
    description: Execution target CRUD and ping
  - name: CustomAgents
    description: Custom agent CRUD
  - name: AgentTeams
    description: Team CRUD, runs, approvals, assignments
  - name: Audit
    description: Audit event listing (admin)
  - name: Relay
    description: Hub-Edge relay commands
  - name: Public
    description: Unauthenticated public endpoints
  - name: WebSocket
    description: WebSocket realtime event stream
  - name: EdgeFoundation
    description: 'Edge: health, events, model catalog, metrics'
  - name: EdgeProjects
    description: 'Edge: project, thread, conversation APIs'
  - name: EdgeRuns
    description: 'Edge: agent run lifecycle'
  - name: EdgeArtifacts
    description: 'Edge: artifacts and previews'
  - name: EdgePermissions
    description: 'Edge: permission decisions'
  - name: Legacy
    description: Legacy /v1 endpoints (planned migration)
paths:
  /health:
    get:
      operationId: basicHealthCheck
      summary: Basic health check
      tags:
        - Health
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '500':
          $ref: '#/components/responses/InternalError'
  /health/live:
    get:
      operationId: livenessProbe
      summary: Liveness probe
      tags:
        - Health
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '500':
          $ref: '#/components/responses/InternalError'
  /health/ready:
    get:
      operationId: readinessProbe
      summary: Readiness probe
      tags:
        - Health
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/public/stats:
    get:
      operationId: publicWebsiteStatisticsNoAuth
      summary: Public website statistics (no auth)
      tags:
        - Public
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /client/auth/refresh:
    post:
      operationId: refreshAccessToken
      summary: Refresh access token
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /client/auth/oidc/authorize:
    post:
      operationId: initiateOidcPkceAuthorization
      summary: Initiate OIDC PKCE authorization
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OIDCAuthorizeRequest'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /client/auth/oidc/callback:
    post:
      operationId: completeOidcPkceTokenExchange
      summary: Complete OIDC PKCE token exchange
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OIDCCallbackRequest'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      operationId: oidcCallbackRedirectLandingPage
      summary: OIDC callback redirect landing page
      tags:
        - Auth
      parameters:
        - name: code
          in: query
          schema:
            type: string
          description: Authorization code from OIDC provider
        - name: state
          in: query
          schema:
            type: string
          description: OIDC state parameter
      responses:
        '200':
          description: Success HTML page
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /client/auth/me:
    get:
      operationId: getCurrentUserProfile
      summary: Get current user profile
      tags:
        - Auth
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /client/auth/logout:
    post:
      operationId: logoutAndInvalidateSession
      summary: Logout and invalidate session
      tags:
        - Auth
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /client/auth/profile:
    put:
      operationId: updateCurrentUserProfile
      summary: Update current user profile
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /client/ws:
    get:
      operationId: websocketUpgradeForRealtimeEvents
      summary: WebSocket upgrade for realtime events
      tags:
        - WebSocket
      security:
        - hubWebSocketQueryToken: []
        - bearerAuth: []
      responses:
        '101':
          description: Switching Protocols
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /client/contacts/search:
    get:
      operationId: searchUsers
      summary: Search users
      tags:
        - Contacts
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Search query string
          required: true
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /client/contacts:
    get:
      operationId: listContactsFriends
      summary: List contacts/friends
      tags:
        - Contacts
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /client/contacts/friend-requests:
    get:
      operationId: listIncomingFriendRequests
      summary: List incoming friend requests
      tags:
        - Contacts
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: sendAFriendRequest
      summary: Send a friend request
      tags:
        - Contacts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendFriendRequestRequest'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /client/contacts/friend-requests/{id}/accept:
    post:
      operationId: acceptAFriendRequest
      summary: Accept a friend request
      tags:
        - Contacts
      parameters:
        - $ref: '#/components/parameters/FriendRequestId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /client/contacts/friend-requests/{id}/reject:
    post:
      operationId: rejectAFriendRequest
      summary: Reject a friend request
      tags:
        - Contacts
      parameters:
        - $ref: '#/components/parameters/FriendRequestId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /client/contacts/{userId}:
    delete:
      operationId: removeAContact
      summary: Remove a contact
      tags:
        - Contacts
      parameters:
        - $ref: '#/components/parameters/ContactUserId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /client/contacts/{userId}/block:
    post:
      operationId: blockAContact
      summary: Block a contact
      tags:
        - Contacts
      parameters:
        - $ref: '#/components/parameters/ContactUserId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /client/contacts/{userId}/unblock:
    post:
      operationId: unblockAContact
      summary: Unblock a contact
      tags:
        - Contacts
      parameters:
        - $ref: '#/components/parameters/ContactUserId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /client/contacts/{userId}/remark:
    put:
      operationId: updateContactRemarkAlias
      summary: Update contact remark/alias
      tags:
        - Contacts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRemarkRequest'
      parameters:
        - $ref: '#/components/parameters/ContactUserId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /client/sessions:
    get:
      operationId: listUserSessions
      summary: List user sessions
      tags:
        - Sessions
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        '200':
          $ref: '#/components/responses/ListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createADirectSession
      summary: Create a direct session
      tags:
        - Sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /client/sessions/search:
    get:
      operationId: searchSessions
      summary: Search sessions
      tags:
        - Sessions
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Search query
          required: true
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /client/sessions/private:
    post:
      operationId: createAPrivateSessionSelf
      summary: Create a private session (self)
      tags:
        - Sessions
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePrivateSessionRequest'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /client/sessions/group:
    post:
      operationId: createAGroupSession
      summary: Create a group session
      tags:
        - Sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupSessionRequest'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /client/sessions/{id}:
    delete:
      operationId: deleteSessionForCurrentUser
      summary: Delete session for current user
      tags:
        - Sessions
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /client/sessions/{id}/info:
    put:
      operationId: updateSessionGroupInfo
      summary: Update session/group info
      tags:
        - Sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSessionInfoRequest'
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /client/sessions/{id}/members:
    post:
      operationId: addMembersToSession
      summary: Add members to session
      tags:
        - Sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMembersRequest'
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /client/sessions/{id}/members/{userId}:
    delete:
      operationId: removeMemberFromSession
      summary: Remove member from session
      tags:
        - Sessions
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/SessionMemberUserId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /client/sessions/{id}/leave:
    post:
      operationId: leaveASession
      summary: Leave a session
      tags:
        - Sessions
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /client/sessions/{id}/dissolve:
    post:
      operationId: dissolveAGroupSessionOwnerOnly
      summary: Dissolve a group session (owner only)
      tags:
        - Sessions
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /client/sessions/{id}/transfer-owner:
    post:
      operationId: transferSessionOwnership
      summary: Transfer session ownership
      tags:
        - Sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferOwnerRequest'
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /client/sessions/{id}/settings:
    put:
      operationId: updateMemberSettings
      summary: Update member settings
      tags:
        - Sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSessionSettingsRequest'
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /client/sessions/{id}/messages:
    get:
      operationId: getSessionMessages
      summary: Get session messages
      tags:
        - Messages
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageCursor'
        - name: before
          in: query
          schema:
            type: string
          description: Timestamp cursor for pagination
      responses:
        '200':
          $ref: '#/components/responses/ListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: sendMessageToSession
      summary: Send message to session
      tags:
        - Messages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /client/sessions/{id}/messages/sync:
    get:
      operationId: getIncrementalMessagesSinceLastSync
      summary: Get incremental messages since last sync
      tags:
        - Messages
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - name: since
          in: query
          schema:
            type: string
          description: Timestamp/cursor for incremental sync
      responses:
        '200':
          $ref: '#/components/responses/ListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /client/sessions/{id}/messages/search:
    get:
      operationId: searchMessagesWithinASession
      summary: Search messages within a session
      tags:
        - Messages
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - name: q
          in: query
          schema:
            type: string
          description: Search query
          required: true
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /client/sessions/{id}/pins:
    get:
      operationId: listPinnedMessages
      summary: List pinned messages
      tags:
        - Messages
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /client/sessions/{id}/read:
    post:
      operationId: markSessionAsRead
      summary: Mark session as read
      tags:
        - Messages
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /client/sessions/{id}/agents:
    post:
      operationId: addAgentToSessionAndTriggerTask
      summary: Add agent to session and trigger task
      tags:
        - AgentTasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddAgentToSessionRequest'
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /client/messages/search:
    get:
      operationId: searchAllMessages
      summary: Search all messages
      tags:
        - Messages
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Search query
          required: true
