  # ── Edge / Web ──

  /edge/devices/register:
    x-agenthub-device-type: desktop
    post:
      tags: [HubSyncRelay]
      operationId: hubRegisterDevice
      summary: Register a device with the Hub. Device type is taken from the JWT claim.
      description: >
        Desktop registration may create or refresh an owner-scoped local_edge
        ExecutionTarget bound to the registered Desktop device. After a
        successful registration, clients should refresh `/web/execution-targets`
        before dispatch target selection. The generated target `is_online` and
        `health_state` reflect desktop check-in freshness from this registration,
        not an active WebSocket route proof.
      x-agenthub-status: implemented
      x-agenthub-owner: Hub
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_id]
              properties:
                device_id:
                  type: string
                  format: uuid
                  description: UUID of the physical device (must match JWT device_id claim).
                app_version:
                  type: string
                  description: Optional client application version.
                capabilities:
                  type: array
                  items: { type: string }
                  description: Device capability tags (e.g. ["desktop", "edge"]).
      responses:
        "200":
          description: Device registered.
          content:
            application/json:
              schema:
                type: object
                required: [code, data]
                properties:
                  code: { type: string }
                  message: { type: string }
                  data:
                    $ref: "#/components/schemas/Device"
        "400":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"

  /cloud/edge/register:
    post:
      tags: [HubSyncRelay]
      operationId: hubRegisterCloudEdge
      summary: Register a cloud Edge device and mint its Edge API JWT.
      description: >
        Authenticated Hub session route without the desktop device-type
        restriction used by /edge/devices/register. The request device_id must
        be a UUID for the cloud Edge being registered. Hub registers the device
        as `cloud_edge` under the authenticated Hub user and returns an
        Edge-scoped JWT with `iss=agenthub-hub`, `aud=agenthub-edge`,
        `purpose=edge-api`, `device_type=edge`, and the registered `device_id`
        for Edge API authentication. Per-user quota: once the authenticated
        user owns AGENTHUB_MAX_CLOUD_EDGE_DEVICES (default 50) cloud_edge
        devices, registering a brand-new device_id fails with 403
        `device_limit_exceeded`; re-registering an already-owned device_id
        (upsert refresh) is not blocked.
      x-agenthub-status: implemented
      x-agenthub-owner: Hub
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_id]
              properties:
                device_id:
                  type: string
                  format: uuid
                  description: Stable cloud Edge device UUID to register under the authenticated Hub user.
                name:
                  type: string
                host:
                  type: string
                port:
                  type: integer
                app_version:
                  type: string
                capabilities:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: Cloud Edge registered and JWT issued.
          content:
            application/json:
              schema:
                type: object
                required: [code, data]
                properties:
                  code: { type: string }
                  message: { type: string }
                  data:
                    type: object
                    required: [device_id, device_type, jwt]
                    properties:
                      device_id: { type: string, format: uuid }
                      device_type: { type: string, enum: [cloud_edge] }
                      jwt:
                        type: string
                        description: Edge-scoped JWT for Edge API auth.
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"

