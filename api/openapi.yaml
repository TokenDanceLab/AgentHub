  /web/team-runs/{id}/compete-summary:
    x-agenthub-device-type: web
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: TeamRun id (not the AgentTeam id).
    get:
      tags: [HubSyncRelay]
      operationId: hubTeamRunCompeteSummary
      summary: Generate the compete-mode comparison summary for a team run.
      description: >
        Aggregates every competing member's assignment result for the run and
        returns an LLM comparison summary. The handler tolerates an optional
        JSON body with a `prompt` string to steer the comparison and falls back
        to an empty request when the body is absent or unparsable, so callers
        that cannot attach a body to GET still work.
      x-agenthub-status: implemented
      x-agenthub-owner: Hub
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Compete comparison summary for the run.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string }
                  message: { type: string }
                  data:
                    $ref: "#/components/schemas/HubCompeteSummaryResponse"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

