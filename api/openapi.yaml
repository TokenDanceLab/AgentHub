        schema: { type: string, format: uuid }
      - name: run_id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: approval_id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [HubSyncRelay]
      operationId: hubDecideTeamApproval
      summary: Record a TeamRun approval decision and deliver the Edge control payload.
      description: Validates that the approval is still pending and tied to an exact Edge device, appends a team.approval.decided TeamEvent, returns the Edge control payload, and pushes or queues an agent.control permission.decide frame for the owning Desktop/Edge device. Hub rejects decisions that cannot be mapped to a recorded edge_device_id so approvals cannot silently fall back to another desktop.
