      required: [items, sources]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ModelCatalogItem"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/ModelCatalogSource"
    ModelCatalogItem:
      type: object
      required: [id, value, label, sourceId, sourceLabel, status]
      properties:
        id:
          type: string
        value:
          type: string
        label:
          type: string
        provider:
          type: string
        runtimeId:
          type: string
        resolvedModel:
          type: string
        sourceId:
          type: string
        sourceLabel:
          type: string
        status:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        reasoningEfforts:
          type: array
          items:
            type: string
        default:
          type: boolean
    ModelCatalogSource:
      type: object
      required: [id, label, status]
      properties:
        id:
          type: string
        label:
          type: string
        status:
          type: string
        detail:
          type: string
    Artifact:
      type: object
      required: [id, runId, threadId, kind, path, sizeBytes, createdAt]
      properties:
        id:
          type: string
        runId:
          type: string
        threadId:
          type: string
        kind:
          type: string
          description: Artifact category such as patch, file, image, document, or web.
        path:
          type: string
          description: Workspace-relative artifact path or logical artifact name. Absolute private paths are never exposed.
        sizeBytes:
          type: integer
          format: int64
        contentSource:
          $ref: "#/components/schemas/ArtifactContentSource"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ArtifactContentSource:
      type: object
      description: Safe metadata for future artifact content reads. The path is either workspace-relative or basename-only; absolute private paths are never stored or returned.
      required: [kind, path, readable]
      properties:
        kind:
          type: string
          enum: [workspace_relative, basename]
        path:
          type: string
          description: Workspace-relative source path when readable, otherwise basename-only fallback.
        readable:
          type: boolean
          description: Whether a future content route may resolve the source from an approved workspace root.
    ArtifactList:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Artifact"
        page:
          $ref: "#/components/schemas/PageInfo"
    ArtifactListResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: string
          enum: [ok]
        data:
          $ref: "#/components/schemas/ArtifactList"
    Preview:
      type: object
      required: [id, runId, threadId, status, createdAt]
      properties:
        id:
          type: string
        runId:
          type: string
        threadId:
          type: string
        url:
          type: string
          format: uri
          description: Local preview URL when a preview is already ready.
        status:
          type: string
          enum: [starting, ready, stopped]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreatePreviewRequest:
      type: object
      required: [runId]
      properties:
        previewId:
          type: string
          description: Optional caller-supplied preview id; omitted values are generated by Edge.
        runId:
          type: string
          description: Existing Edge run id that owns the preview metadata.
        threadId:
          type: string
          description: Optional thread guard; when supplied it must match the run thread.
    PreviewList:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Preview"
        page:
          $ref: "#/components/schemas/PageInfo"
    PreviewListResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: string
          enum: [ok]
        data:
          $ref: "#/components/schemas/PreviewList"
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            traceId:
              type: string
            details:
              type: object
              additionalProperties: true
    HubOIDCAuthorizeRequest:
      type: object
      required: [code_challenge, device_type, device_id]
      properties:
        code_challenge:
          type: string
          description: PKCE S256 code challenge generated by the client.
        code_challenge_method:
          type: string
          enum: [S256]
          default: S256
          description: Hub accepts only S256; omitted values default to S256.
        device_type:
          type: string
          enum: [desktop, web, cli]
          description: Hub device class for the resulting local session.
        device_id:
          type: string
          format: uuid
          description: Stable Hub device UUID; must match the callback request. Current target-bound dispatch requires an owner-owned desktop device; remote/cloud routing remains future work.
        redirect_uri:
          type: string
          format: uri
          description: Optional browser redirect URI for this PKCE round trip. When omitted, Hub uses its configured TokenDance ID redirect URI.
    HubOIDCAuthorizeResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: string
          enum: [ok]
        message:
          type: string
        data:
          type: object
          required: [state, authorization_url]
          properties:
            state:
              type: string
              description: One-time Hub state value bound to PKCE and device proof.
            authorization_url:
              type: string
              format: uri
              description: TokenDance ID /oidc/authorize URL to open in the browser.
    HubOIDCCallbackRequest:
      type: object
      required: [code, state, code_verifier, device_type, device_id]
      properties:
        code:
          type: string
          description: Authorization code returned by TokenDance ID.
        state:
          type: string
          description: Hub state returned from /client/auth/oidc/authorize.
        code_verifier:
          type: string
          description: Original PKCE verifier corresponding to the S256 challenge.
        device_type:
          type: string
          enum: [desktop, web, cli]
        device_id:
          type: string
          format: uuid
          description: Same stable Hub device UUID used in the authorize request.
        redirect_uri:
          type: string
          format: uri
          description: Same redirect URI used in the authorize request. Optional for legacy desktop clients that use the configured Hub redirect URI.
    HubOIDCCallbackResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: string
          enum: [ok]
        message:
          type: string
        data:
          type: object
          required: [access_token, refresh_token, expires_in, user]
          properties:
            access_token:
              type: string
              description: Hub-local HS256 access token for REST and WebSocket auth.
            refresh_token:
              type: string
              description: Hub-local refresh token; not a TokenDance ID refresh token.
            expires_in:
              type: integer
              format: int64
              description: Hub access token lifetime in seconds.
            user:
              type: object
              required: [id, username, nickname]
              properties:
                id:
                  type: string
                  format: uuid
                username:
                  type: string
                nickname:
                  type: string
                avatar_url:
                  type: string
                tokendance_sub:
                  type: string
                  description: TokenDance ID subject mapped to this Hub user.
    HubTaskAckRequest:
      type: object
      properties:
        run_id:
          type: string
          maxLength: 128
          description: Edge run id returned by POST /v1/runs.
        edge_run_id:
          type: string
          maxLength: 128
          description: Alias for run_id for explicit Hub persistence.
    HubWebSocketFrame:
      type: object
      required: [type]
      description: Hub WebSocket frame envelope. Event-specific payload contracts are documented in api/events.md.
      properties:
        type:
          type: string
          enum:
            - auth.ok
            - typing
            - message.new
            - message.recall
            - message.pin
            - message.unpin
            - message.read
            - message.reaction_added
            - message.reaction_removed
            - session.created
            - session.dissolved
            - session.member_joined
            - session.member_left
            - session.info_updated
            - device.online
            - device.offline
            - device.kicked
            - agent.dispatch
            - agent.stream
            - agent.done
            - agent.failed
            - agent.cancel
            - agent.control
            - team.run.started
            - team.event
            - team.assignment.done
            - team.assignment.failed
            - team.subagent.stream
            - notification.new
            - friend.request
            - friend.accepted
        payload:
          type: object
          additionalProperties: true
        seq_id:
          type: integer
          format: int64
          description: Monotonic sequence ID for ordering and gap detection. Present on all non-auth frames.
    HubDevicePresencePayload:
      type: object
      required: [user_id]
      description: User-level Hub presence payload for device.online and device.offline WebSocket frames. Hub broadcasts presence by user and does not expose device_id or device_type in this payload.
      properties:
        user_id:
          type: string
      additionalProperties: false
    HubTaskStreamRequest:
      type: object
      anyOf:
        - required: [content]
        - required: [chunk]
        - required: [payload]
      properties:
        content:
          type: string
          maxLength: 1048576
          description: 'Legacy stream content. If not valid JSON, Hub wraps it as {"content": "..."} for jsonb storage. Normalized payload/message content must stay within the 1 MiB per-event budget.'
        chunk:
          type: string
          maxLength: 1048576
          description: Legacy alias for content. Normalized payload/message content must stay within the 1 MiB per-event budget.
        event_type:
          type: string
          maxLength: 96
          description: Typed AgentHub runtime event name, for example run.output.batch or run.agent.tool_call.
        payload:
          type: object
          additionalProperties: true
          description: Typed runtime payload persisted as jsonb and broadcast as agent.stream. The encoded JSON payload must stay within the 1 MiB per-event budget.
        client_msg_id:
          type: string
          format: uuid
          description: Client-generated message id for idempotent stream dedup.
        run_id:
          type: string
          maxLength: 128
          description: Edge run id.
        edge_run_id:
          type: string
          maxLength: 128
          description: Alias for run_id.
    AgentRunEvent:
      type: object
      properties:
        id:
          type: string
        task_id:
          type: string
        edge_run_id:
          type: string
          maxLength: 128
        session_id:
          type: string
        agent_instance_id:
          type: string
        event_seq:
          type: integer
          format: int64
        event_type:
          type: string
        payload:
          type: string
          description: JSON-encoded runtime payload persisted by Hub; capped at 1 MiB on stream ingest.
        created_at:
          type: string
          format: date-time
    AgentRunEventSummary:
      type: object
      properties:
        task_id:
          type: string
        edge_run_id:
          type: string
          maxLength: 128
        status:
          type: string
          description: Current Hub pending task status.
        total_events:
          type: integer
        last_event_seq:
          type: integer
          format: int64
        event_type_counts:
          type: object
          additionalProperties:
            type: integer
        tool_call_count:
          type: integer
        step_count:
          type: integer
        artifact_count:
          type: integer
        approval_count:
          type: integer
        pending_approvals:
          type: integer
        decided_approvals:
          type: integer
        input_tokens:
          type: integer
        output_tokens:
          type: integer
        output_bytes:
          type: integer
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        elapsed_ms:
          type: integer
          format: int64
    TaskApprovalDecisionRequest:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [allow, deny]
        reason:
          type: string
    AgentTaskApprovalList:
      type: object
      properties:
        task_id:
          type: string
        edge_run_id:
          type: string
          maxLength: 128
        session_id:
          type: string
        approvals:
          type: array
          items:
            $ref: "#/components/schemas/AgentTaskApproval"
        pending:
          type: array
          items:
            $ref: "#/components/schemas/AgentTaskApproval"
        decided:
          type: array
          items:
            $ref: "#/components/schemas/AgentTaskApproval"
        last_event_seq:
          type: integer
          format: int64
    AgentTaskApproval:
      type: object
      properties:
        approval_id:
          type: string
        task_id:
          type: string
        edge_run_id:
          type: string
          maxLength: 128
        session_id:
          type: string
        source_event_id:
          type: string
        event_seq:
          type: integer
          format: int64
        request_id:
          type: string
        tool_name:
          type: string
        tool_use_id:
          type: string
        status:
          type: string
        reason:
          type: string
        decided_by:
          type: string
        created_at:
          type: string
          format: date-time
        decided_at:
          type: string
          format: date-time
        edge_control:
          $ref: "#/components/schemas/TeamApprovalEdgeControl"
    AgentTaskArtifactList:
      type: object
      properties:
        task_id:
          type: string
        edge_run_id:
          type: string
          maxLength: 128
        session_id:
          type: string
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/AgentTaskArtifact"
        last_event_seq:
          type: integer
          format: int64
    AgentTaskArtifact:
      type: object
      properties:
        task_id:
          type: string
        edge_run_id:
          type: string
          maxLength: 128
        session_id:
          type: string
        source_event_id:
          type: string
        event_seq:
          type: integer
          format: int64
        path:
          type: string
        action:
          type: string
        tool_name:
          type: string
        status:
          type: string
        diff:
          type: string
          description: Optional unified diff or patch snippet projected from run.agent.file_change.
        edit_id:
          type: string
          description: Optional runtime edit identifier projected from run.agent.file_change.
        hash:
          type: string
          description: Optional SHA-256 or runtime-provided hash for a diff proposal or artifact.
        review_status:
          type: string
          description: Optional review state projected from run.agent.file_change for inspector UI.
        can_apply:
          type: boolean
          description: Review/export-only capability projection. Current Hub responses clamp unguarded runtime apply capability to false and do not expose a real apply action.
        can_revert:
          type: boolean
          description: Review/export-only capability projection. Current Hub responses clamp unguarded runtime revert capability to false and do not expose a real revert action.
        artifact_id:
          type: string
        name:
          type: string
        mime_type:
          type: string
        size_bytes:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
    HubTaskDoneRequest:
      type: object
      properties:
        run_id:
          type: string
          maxLength: 128
          description: Edge run id.
        edge_run_id:
          type: string
          maxLength: 128
          description: Alias for run_id.
        final_content:
          type: string
          maxLength: 1048576
          description: Optional final agent output or summary inserted as the final chat projection. Hub rejects values above the 1 MiB callback payload budget.
    HubTaskFailRequest:
      type: object
      required: [error]
      properties:
        run_id:
          type: string
          maxLength: 128
          description: Edge run id.
        edge_run_id:
          type: string
          maxLength: 128
