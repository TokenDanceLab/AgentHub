    post:
      tags: [ExecutionRunner]
      operationId: applyAllRunDiffHunks
      summary: Batch apply multiple run diff hunk decisions.
      description: >
        Applies multiple hunk accept/reject decisions for a finished run in one
        request. Each decision is applied in order; the first failure aborts
        the batch. Returns the per-hunk results and count applied.
