      responses:
        "204":
          description: Deleted.
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /v1/settings:
    get:
      tags: [Foundation]
      operationId: getEdgeSettings
      summary: Read Edge-local settings.
      description: >
        Edge-local settings have no per-user owner binding; under Hub JWT /
        multi-user mode this route fails closed (AH-SR-045). Local
        single-tenant mode keeps access.
      x-agenthub-phase: P0
      x-agenthub-status: implemented
      x-agenthub-owner: Edge
      responses:
        "200":
          $ref: "#/components/responses/Ok"
    patch:
      tags: [Foundation]
      operationId: updateEdgeSettings
      summary: Upsert Edge-local settings.
      description: >
        Merges a string-keyed patch into Edge-local settings. An empty patch
        is rejected. Persist failures are reported as 500 so callers do not
        mistake them for success. Edge-local settings are node-level shared
        configuration with no per-user owner binding, so under Hub JWT /
        multi-user mode this route is not writable and fails closed with 404
        whose body is indistinguishable from a missing resource (AH-SR-045);
        local single-tenant mode keeps write access. The gate runs before the
        request body is decoded.
      x-agenthub-phase: P0
      x-agenthub-status: implemented
      x-agenthub-owner: Edge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: string
              minProperties: 1
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "400":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

