      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decisions]
              properties:
                decisions:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [file_path, hunk_index, accepted]
                    properties:
                      file_path:
                        type: string
                      hunk_index:
                        type: integer
                        minimum: 0
                      accepted:
                        type: boolean
                workDir:
                  type: string
                  description: Absolute workspace root; must be within the Edge workspace allowlist.
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
