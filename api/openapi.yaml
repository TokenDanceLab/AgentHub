    get:
      tags: [Foundation]
      operationId: listRuntimeSessions
      summary: List observed local Agent Runtime sessions.
      description: >
        Read-only Desktop import discovery surface. Scans the local filesystem
        for recent Agent Runtime session summaries; never mutates third-party
        stores. Shared machine surface: fails closed under Hub JWT / multi-user
        mode (AH-SR-045).
