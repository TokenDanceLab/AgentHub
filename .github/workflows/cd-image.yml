# Reusable multi-arch image pipeline: build each platform on its native
# runner, then merge the digests into one manifest. `cd-web.yml` and
# `cd-hub-server.yml` differ only in their path filters and the inputs below,
# so the pipeline itself lives in exactly one place.
name: CD - Image

on:
  workflow_call:
    inputs:
      image:
        description: Fully qualified image name without a tag.
        required: true
        type: string
      context:
        description: Docker build context, relative to the repository root.
        required: true
        type: string
      dockerfile:
        description: Dockerfile path, relative to the repository root.
        required: true
        type: string
      cache-scope:
        description: Distinct cache scope so images never share layer caches.
        required: true
        type: string
      build-args:
        description: Newline-separated build args; empty for none.
        required: false
        type: string
        default: ""
      push-latest:
        description: Also tag `latest` on master. Only one workflow may own it.
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build (${{ matrix.suffix }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            suffix: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (${{ matrix.platform }})
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          platforms: ${{ matrix.platform }}
          build-args: ${{ inputs.build-args }}
          tags: ${{ inputs.image }}:sha-${{ github.sha }}-${{ matrix.suffix }}
          cache-from: type=gha,scope=${{ inputs.cache-scope }}-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ inputs.cache-scope }}-${{ matrix.suffix }}

  merge:
    name: Merge multi-arch manifest
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ inputs.image }}
          tags: |
            type=raw,value=latest,enable=${{ inputs.push-latest && github.ref == 'refs/heads/master' }}
            type=raw,value={{date 'YYYYMMDD'}},enable=${{ github.ref == 'refs/heads/master' }}
            type=sha,prefix=,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Create multi-arch manifest and push
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            ${{ inputs.image }}:sha-${{ github.sha }}-amd64 \
            ${{ inputs.image }}:sha-${{ github.sha }}-arm64
