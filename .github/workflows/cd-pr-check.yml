name: CD PR Check

on:
  pull_request:
    branches: [master]
    paths:
      - "deployments/**"
      - "hub-server/deployments/**"
      - "hub-server/**/Dockerfile*"
      - "hub-server/configs/config.docker.yaml"
      - ".dockerignore"
      - ".github/workflows/cd-*.yml"

      - ".github/workflows/release.yml"
      - "hub-server/scripts/generate-secrets*"
      - "scripts/verify/verify-deployment-shape.py"
      - "scripts/verify/tests/test_verify_deployment_shape.py"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ── Deployment shape validation ─────────────────
  # Only real validators run here: the repo-owned SSOT verifier, its
  # negative self-test, and `docker compose config`, which is the
  # authoritative schema + interpolation parser. Earlier hand-rolled
  # greps over the Dockerfile/compose file were redundant with the
  # docker-build-dry job below and could drift from what docker accepts.
  deployment-files:
    name: Deployment files validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Enforce deployment shape SSOT (#1527)
        run: python ./scripts/verify/verify-deployment-shape.py

      - name: Dry-run compose config interpolation (#1655)
        run: |
          echo "::group::docker compose config --quiet"
          # env 插值干跑：PG_PASSWORD/AGENTHUB_JWT_SECRET 用占位值注入，
          # 其余变量走默认值；捕获 ${VAR:?} 缺失与格式错误。
          PG_PASSWORD=dry-run-placeholder \
          AGENTHUB_JWT_SECRET=dry-run-placeholder-min-32-chars \
            docker compose -f deployments/production/docker-compose.yml config --quiet
          echo "::endgroup::"

      - name: Self-test deployment shape SSOT
        run: python ./scripts/verify/tests/test_verify_deployment_shape.py

  # ── Docker build dry run ───────────────────────
  # CI: bare `docker build` → docker/build-push-action@v7 with type=gha
  # cache (aligns with cd-hub-server.yml). load:true keeps the image in the
  # local daemon so the subsequent Verify image contents step can `docker run`
  # it. No push — this is a PR pre-flight build only.
  docker-build-dry:
    name: Docker build dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image (no push, cached)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: hub-server/deployments/Dockerfile
          push: false
          load: true
          tags: agenthub-hub:pr-check
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image contents
        run: |
          echo "::group::Image verification"
          docker images agenthub-hub:pr-check
          # Check that the binary exists in the image
          docker run --rm --entrypoint /bin/sh agenthub-hub:pr-check \
            -c 'ls -la /app/server-hub && test -x /app/server-hub'
          echo "::endgroup::"
