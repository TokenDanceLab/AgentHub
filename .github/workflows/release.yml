name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.5"
  NODE_VERSION: "22"
  PNPM_VERSION: "10.32.1"

jobs:
  # ── Tag Guard: 发布入口守卫（格式 + master 祖先链）─────
  tag-guard:
    name: Guard tag format & master ancestry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Assert tag matches release convention
        shell: bash
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::tag '$GITHUB_REF_NAME' 不符合发布规范 ^vX.Y.Z[-rc.N]$，唯一入口见 AGENTS.md §12"
            exit 1
          fi
          echo "tag format ok: $GITHUB_REF_NAME"

      - name: Assert tag is on master ancestry
        shell: bash
        run: |
          git fetch origin master --quiet
          if ! git merge-base --is-ancestor "$GITHUB_REF_NAME" origin/master; then
            echo "::error::tag '$GITHUB_REF_NAME' 不在 master 祖先链上，拒绝触发发布"
            exit 1
          fi
          echo "tag ancestry ok: $GITHUB_REF_NAME is on master"

  # ── Security Gate: release readiness (risk status + signing policy) ─
  # Hard-blocking (no continue-on-error): exact Open, rotate required, or any
  # verification required Critical/High status blocks release; malformed or
  # unknown Critical/High statuses fail closed.
  # Signing policy (scripts/release/verify-release-gate.py):
  #   - RELEASE_SIGNING_APPROVED=true + signing evidence → signed release
  #   - RELEASE_UNSIGNED_OK=true → Windows unsigned release (SmartScreen
  #     warning; updater still self-signed via TAURI_SIGNING_PRIVATE_KEY)
  #   - neither → freeze (conservative default)
  security-gate:
    name: Security release gate
    needs: tag-guard
    runs-on: ubuntu-latest
    env:
      RELEASE_SIGNING_APPROVED: ${{ vars.RELEASE_SIGNING_APPROVED }}
      RELEASE_UNSIGNED_OK: ${{ vars.RELEASE_UNSIGNED_OK }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run release gate verifier
        shell: bash
        run: |
          python scripts/verify/tests/verify-release-gate.Tests.py
          python scripts/release/verify-release-gate.py -RepoRoot . -SkipRefCheck

  # ── Go: Edge Server + Hub Server ─────────────
  build-go:
    needs: [tag-guard, security-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Resolve release version
        shell: bash
        run: |
          VER="${{ github.ref_name }}"
          VER="${VER#v}"
          echo "ver=${VER}" >> "$GITHUB_ENV"

      - name: Create dist directory
        run: mkdir -p dist

      - name: Build Edge Server (Linux)
        working-directory: edge-server
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -ldflags="-s -w" -o ../dist/agenthub-edge-${ver}-linux-amd64 ./cmd/agenthub-edge/

      - name: Build Edge Server (Windows)
        working-directory: edge-server
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build -ldflags="-s -w" -o ../dist/agenthub-edge-${ver}-windows-amd64.exe ./cmd/agenthub-edge/

      - name: Build Hub Server (Linux)
        working-directory: hub-server
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -ldflags="-s -w" -o ../dist/agenthub-hub-${ver}-linux-amd64 ./cmd/server-hub/

      - name: Build Edge Server (macOS amd64)
        working-directory: edge-server
        env:
          GOOS: darwin
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -ldflags="-s -w" -o ../dist/agenthub-edge-${ver}-darwin-amd64 ./cmd/agenthub-edge/

      - name: Build Edge Server (macOS arm64)
        working-directory: edge-server
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: go build -ldflags="-s -w" -o ../dist/agenthub-edge-${ver}-darwin-arm64 ./cmd/agenthub-edge/

      - name: Build Hub Server (macOS amd64)
        working-directory: hub-server
        env:
          GOOS: darwin
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -ldflags="-s -w" -o ../dist/agenthub-hub-${ver}-darwin-amd64 ./cmd/server-hub/

      - name: Build Hub Server (macOS arm64)
        working-directory: hub-server
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: go build -ldflags="-s -w" -o ../dist/agenthub-hub-${ver}-darwin-arm64 ./cmd/server-hub/

      - name: Upload Go artifacts
        uses: actions/upload-artifact@v7
        with:
          name: go-binaries
          path: dist/

  # ── Tauri Desktop ────────────────────────────
  build-desktop:
    needs: build-go
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache Rust build artifacts
        # Community-standard cargo cache (swatinem/rust-cache): caches the
        # cargo registry + target/ between runs. Tauri dependency compilation
        # is the slowest part of the desktop build — this cuts later builds
        # from ~20min to a few minutes.
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/desktop/src-tauri

      - name: Download Go binaries for sidecar
        uses: actions/download-artifact@v8
        with:
          name: go-binaries
          path: go-binaries

      - name: Prepare edge-server sidecar binary
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v',''
          New-Item -ItemType Directory "app\desktop\src-tauri\binaries" -Force
          Copy-Item "go-binaries\agenthub-edge-${ver}-windows-amd64.exe" "app\desktop\src-tauri\binaries\agenthub-edge-x86_64-pc-windows-msvc.exe"

      - name: Build Tauri (NSIS)
        working-directory: app/desktop
        run: pnpm tauri build

      - name: Create dist directory
        shell: pwsh
        run: New-Item -ItemType Directory dist -Force

      - name: Collect NSIS installer
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v',''
          $nsis = Get-ChildItem "app\desktop\src-tauri\target\release\bundle\nsis" -Filter "*setup.exe" | Select-Object -First 1
          Copy-Item $nsis.FullName "dist\AgentHub_${ver}_x64-setup.exe"
          # Collect updater metadata if present
          $updater = Get-ChildItem "app\desktop\src-tauri\target\release\bundle" -Filter "latest.json" -Recurse | Select-Object -First 1
          if ($updater) { Copy-Item $updater.FullName "dist\latest.json" }
          $sig = Get-ChildItem "app\desktop\src-tauri\target\release\bundle" -Filter "*.sig" -Recurse | Select-Object -First 1
          if ($sig) { Copy-Item $sig.FullName "dist\AgentHub_${ver}_x64-setup.exe.sig" }
          # Generate the updater manifest (latest.json) in the format the
          # tauri-plugin-updater expects; the .sig is produced by tauri
          # build (createUpdaterArtifacts), the manifest is the release
          # contract published to GitHub Releases.
          if ($sig) {
            $signature = (Get-Content $sig.FullName -Raw).Trim()
            $updaterJson = [ordered]@{
              version  = $ver
              notes    = "AgentHub ${{ github.ref_name }}"
              pub_date = (Get-Date).ToUniversalTime().ToString("o")
              platforms = [ordered]@{
                "windows-x86_64" = [ordered]@{
                  signature = $signature
                  url       = "https://github.com/TokenDanceLab/AgentHub/releases/download/${{ github.ref_name }}/AgentHub_${ver}_x64-setup.exe"
                }
              }
            } | ConvertTo-Json -Depth 5
            Set-Content "dist\latest.json" $updaterJson -Encoding UTF8
            Write-Host "Generated dist\latest.json"
          } else {
            Write-Warning "No .sig found - skipping latest.json (updater manifest)"
          }

      - name: Collect Tauri portable zip
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v',''
          $zip = Get-ChildItem "app\desktop\src-tauri\target\release\bundle\zip" -Filter "*.zip" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($zip) {
            Copy-Item $zip.FullName "dist\AgentHub_${ver}_x64-portable.zip"
            Write-Host "Collected Tauri zip: $($zip.Name)"
          } else {
            Write-Warning "No Tauri zip bundle found - falling back to manual assembly"
            $exe = Get-ChildItem "app\desktop\src-tauri\target\release" -Filter "agenthub-desktop.exe" | Select-Object -First 1
            if ($exe) {
              $portableDir = "dist\AgentHub-portable"
              New-Item -ItemType Directory $portableDir -Force
              Copy-Item $exe.FullName "$portableDir\AgentHub.exe"
              Copy-Item "go-binaries\agenthub-edge-${ver}-windows-amd64.exe" "$portableDir\agenthub-edge.exe"
              @"
          AgentHub ${{ github.ref_name }} — Portable Edition

          No installation required. Double-click AgentHub.exe to run.
          Requires: Windows 10/11 (WebView2 built-in).

          Full documentation: https://github.com/TokenDanceLab/AgentHub
          "@ | Out-File "$portableDir\README.txt" -Encoding UTF8
              Compress-Archive -Path "$portableDir\*" -DestinationPath "dist\AgentHub_${ver}_x64-portable.zip" -Force
              Remove-Item -Recurse -Force $portableDir
            } else {
              Write-Error "Neither Tauri zip nor release exe found"
              exit 1
            }
          }

      - name: Upload Desktop artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-artifacts
          path: dist/

  # ── Tauri Desktop (Linux) ────────────────────
  # Linux 桌面端与 Windows 共用同一套前端 + src-tauri 源码；Cargo.toml 已含
  # linux-keyutils-keyring-store。首版只出 AppImage + deb（GitHub Releases
  # 手动更新）；AppImage auto-updater（full-update tar.gz 流）另记账债。
  build-desktop-linux:
    needs: build-go
    runs-on: ubuntu-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri Linux system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/desktop/src-tauri

      - name: Download Go binaries for sidecar
        uses: actions/download-artifact@v8
        with:
          name: go-binaries
          path: go-binaries

      - name: Prepare edge-server sidecar binary
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          mkdir -p app/desktop/src-tauri/binaries
          cp "go-binaries/agenthub-edge-${ver}-linux-amd64" \
             "app/desktop/src-tauri/binaries/agenthub-edge-x86_64-unknown-linux-gnu"
          chmod +x "app/desktop/src-tauri/binaries/agenthub-edge-x86_64-unknown-linux-gnu"

      - name: Build Tauri (AppImage + deb)
        working-directory: app/desktop
        run: pnpm tauri build

      - name: Collect Linux bundles
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          appimage=$(find app/desktop/src-tauri/target/release/bundle/appimage -name "*.AppImage" -print -quit)
          if [ -n "$appimage" ]; then
            cp "$appimage" "dist/AgentHub_${ver}_x86_64.AppImage"
          else
            echo "::warning::AppImage 未生成"
          fi
          deb=$(find app/desktop/src-tauri/target/release/bundle/deb -name "*.deb" -print -quit)
          if [ -n "$deb" ]; then
            cp "$deb" "dist/AgentHub_${ver}_amd64.deb"
          else
            echo "::warning::deb 未生成"
          fi
          ls -la dist/

      - name: Upload Linux Desktop artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-linux-artifacts
          path: dist/

  # ── Expo Android APK ─────────────────────────
  # Mobile 处于深度重构期（AGENTS.md §2），且 EAS 需要 EXPO_TOKEN + EAS 账号；
  # 发布不硬依赖 APK。设置仓库 variable RELEASE_MOBILE_ENABLED=true 且配置
  # EXPO_TOKEN 后才参与发布；否则该 job 跳过（release job 照常发布其余产物）。
  build-mobile:
    needs: tag-guard
    if: ${{ vars.RELEASE_MOBILE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Build Android APK via EAS
        working-directory: app/mobile-rn
        run: |
          VER="${{ github.ref_name }}"
          VER="${VER#v}"
          eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --wait \
            --message "Release ${{ github.ref_name }}"

          BUILD_LIST=$(eas build:list \
            --platform android \
            --status FINISHED \
            --limit 1 \
            --json \
            --non-interactive)
          BUILD_ID=$(echo "$BUILD_LIST" | jq -r '.[0].id')
          echo "EAS build ID: $BUILD_ID"

          mkdir -p ../../dist

          BUILD_DETAIL=$(eas build:view "$BUILD_ID" --json --non-interactive)
          APK_URL=$(echo "$BUILD_DETAIL" | jq -r '.artifacts.applicationArchiveUrl // .artifacts.buildUrl // empty')

          if [ -z "$APK_URL" ] || [ "$APK_URL" = "null" ]; then
            echo "ERROR: Could not resolve APK download URL from build $BUILD_ID"
            echo "$BUILD_DETAIL" | jq .
            exit 1
          fi

          echo "Downloading APK from $APK_URL"
          curl -sSL -o "../../dist/agenthub-mobile-${VER}-android.apk" "$APK_URL"
          ls -lh ../../dist/

      - name: Upload Mobile artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mobile-artifacts
          path: dist/

  # ── GitHub Release ───────────────────────────
  release:
    needs: [build-go, build-desktop, build-desktop-linux, build-mobile]
    # build-mobile 未启用时（RELEASE_MOBILE_ENABLED != true）会 skipped，
    # needs 依赖被跳过会使下游默认跳过；显式放行 skipped、仍拦截 failure。
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    env:
      RELEASE_UNSIGNED_OK: ${{ vars.RELEASE_UNSIGNED_OK }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download Go artifacts
        uses: actions/download-artifact@v8
        with:
          name: go-binaries
          path: dist

      - name: Download Desktop artifacts
        uses: actions/download-artifact@v8
        with:
          name: desktop-artifacts
          path: dist

      - name: Download Desktop Linux artifacts
        uses: actions/download-artifact@v8
        with:
          name: desktop-linux-artifacts
          path: dist

      - name: Download Mobile artifacts
        # build-mobile 未启用时无 mobile-artifacts，条件跳过避免下载失败
        if: ${{ needs.build-mobile.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          name: mobile-artifacts
          path: dist

      - name: List assets
        run: ls -la dist/

      - name: Generate release notes with git-cliff
        # Community-standard changelog generator (git-cliff, cliff.toml at repo
        # root): groups conventional commits, flags breaking changes, renders
        # the bilingual body. --latest emits only the current tag's section
        # (the tag is detected from HEAD — do not pass --tag, it would blank
        # the version variable in the template).
        shell: bash
        env:
          RELEASE_UNSIGNED_OK: ${{ vars.RELEASE_UNSIGNED_OK }}
        run: |
          curl -sSL -o git-cliff.tar.gz \
            https://github.com/orhun/git-cliff/releases/download/v2.13.1/git-cliff-2.13.1-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf git-cliff.tar.gz
          GIT_CLIFF=$(find . -maxdepth 2 -type f -name git-cliff | head -1)
          if [ -z "$GIT_CLIFF" ]; then
            echo "::error::git-cliff binary not found after extraction"
            exit 1
          fi
          "$GIT_CLIFF" --latest -o release-notes.md
          if [ "$RELEASE_UNSIGNED_OK" = "true" ]; then
            printf '%s\n' \
              '> **Windows 未签名说明 / Unsigned notice**：安装包未做 Authenticode 签名，首次运行时 Windows SmartScreen 会提示“未知发布者”——点击“更多信息 → 仍要运行”即可。应用内自动更新正常（updater 元数据为自签）。' \
              '> The installer is not code-signed; SmartScreen may warn on first run — click “More info → Run anyway”. In-app auto-update works (self-signed metadata).' \
              >> release-notes.md
          fi

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          cd dist
          for f in *; do
            [ "$f" = "SHA256SUMS" ] && continue
            [ -d "$f" ] && continue
            sha256sum "$f"
          done > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: AgentHub ${{ github.ref_name }}
          body_path: release-notes.md
          files: dist/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
