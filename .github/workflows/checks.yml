name: checks

# CI policy: docs/architecture/github-actions-ci-cd-policy.md
# - master PR/push only
# - concurrency cancels superseded runs
# - Windows keeps native Go/frontend contracts; full Tauri packaging stays in release-readiness
# - frontend-mobile, desktop-linux-build, backend-perf-leak-gates, e2e-smoke, real-e2e-stack are workflow_dispatch only
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      id_env:
        description: >-
          ID 来源（real-e2e-stack lane）：
          source=从 vars.OIDC_SOURCE_REPO 指定的 GitHub 仓库构建（需 secrets.OIDC_CLONE_TOKEN）；
          image=使用 vars.OIDC_IMAGE 指定的镜像；
          local=runner 本机 loopback ID。
          本 lane 只使用 127.0.0.1:3000。
        default: source
        type: choice
        options: [source, image, local]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.9"
  GOLANGCI_LINT_VERSION: "v2.12.2"
  NODE_VERSION: "24"
  PNPM_VERSION: "10.32.1"

jobs:
  # ── Go: Edge static gates (parallel) ─────────
  # None of the gates below consumes the shard coverage artifacts, so they run
  # in parallel with go-edge-test. The stable required check go-edge aggregates
  # this result. Gates below are gated at job level only.
  go-edge-static:
    needs: changes
    # Job-level path filter — the same expression the real gates below carry.
    # When Go is deselected this job is skipped; go-edge still reports its
    # controlled no-op success because its lane assertions share this filter,
    # so a skipped static lane can never redden a Go-less PR.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge-server
    steps:
      - if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true'
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: edge-server/go.sum

      # Advisory gate (owner: edge maintainers). Reason: golangci-lint's raw
      # exit code cannot consult a baseline, and GitHub refuses PR diffs >300
      # files, so the action falls back to a full-repo lint that reports the
      # pre-existing exported-stutter findings and would hard-fail a debt-clean
      # large PR. Tighten: once those baseline findings are fixed, remove
      # continue-on-error so this step blocks like go-hub-static.
      - name: Lint (advisory)
        continue-on-error: true
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: edge-server
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=5m
          only-new-issues: true

      # staticcheck hard-blocking — edge-server findings zero-baselined;
      # version pinned to prevent new-check drift from breaking CI.
      # Binary cached across runs (gha cache keyed on pinned versions).
      # Restore must precede both gosec and staticcheck steps.
      - name: Cache static-analysis binaries (staticcheck + gosec)
        id: sa-cache
        uses: actions/cache@v5
        with:
          path: |
            ~/go/bin/staticcheck
            ~/go/bin/gosec
          key: sa-tools-gosec-2.28.0-staticcheck-2026.1

      - name: Install gosec
        run: |
          if [ ! -x ~/go/bin/gosec ]; then
            go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
          fi

      - name: Security scan (gosec)
        # #1574: hard fail (findings zero-baselined). Fail-closed wrapper
        # verify-gosec-gates.sh rejects empty/unparseable output (no false green).
        run: ~/go/bin/gosec -fmt=json ./... 2>/dev/null | bash ../scripts/verify/verify-gosec-gates.sh
      - name: Vet
        run: go vet ./...

      - name: staticcheck
        run: |
          if [ ! -x ~/go/bin/staticcheck ]; then
            go install honnef.co/go/tools/cmd/staticcheck@2026.1
          fi
          staticcheck ./... 2>&1

  # ── Go: Edge Server (required check) ─────────
  # CI (#1689): test execution lives in go-edge-test (2-shard matrix,
  # each shard on its own 4-core runner). lint and the rest of
  # the static analysis moved to go-edge-static so they run in parallel with
  # the shards instead of serialising behind them. What stays here genuinely
  # needs the shard artifacts — download + merge with
  # scripts/verify/merge-coverprofiles.py (repo-local) and the coverage gates —
  # plus fail-closed assertions on both upstream lanes, so a static or test
  # failure still reddens this required check (and through it backend-required,
  # whose needs list therefore stays unchanged).
  go-edge:
    needs: [changes, go-edge-test, go-edge-static]
    # Required check: always report a result so a path-filtered skip cannot
    # block branch protection. Real gates below run only for Go changes.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge-server
    steps:
      - if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true'
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: edge-server/go.sum

      # this job aggregates two parallel upstream lanes instead
      # of running the static gates itself, so both verdicts are bound and
      # asserted fail-closed (same convention as windows-go / backend-required):
      # any lane that is not `success` — including a `skipped` static lane on a
      # Go-selected PR — reddens the required check instead of reporting a false
      # green. Static-gate failures reach branch protection through go-edge,
      # which is why backend-required needs no new entry.
      - name: Assert Edge static gate lane result (go-edge-static)
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true'
        working-directory: .
        env:
          STATIC_RESULT: ${{ needs.go-edge-static.result }}
        run: |
          if [ "$STATIC_RESULT" != "success" ]; then
            echo "::error::go-edge-static result: $STATIC_RESULT; lint / gosec / vet / staticcheck did not pass"
            exit 1
          fi

      - name: Assert Edge unit test lane result (go-edge-test)
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true'
        working-directory: .
        env:
          TEST_RESULT: ${{ needs.go-edge-test.result }}
        run: |
          if [ "$TEST_RESULT" != "success" ]; then
            echo "::error::go-edge-test result: $TEST_RESULT; shard unit tests did not pass"
            exit 1
          fi

      - name: Download shard coverage data
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true'
        uses: actions/download-artifact@v7
        with:
          pattern: go-edge-coverage-shard-*
          path: edge-server/cov-shards

      - name: Merge shard coverage (coverprofile text)
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true'
        run: |
          python ../scripts/verify/merge-coverprofiles.py \
            cov-shards/go-edge-coverage-shard-1/shard-1.out \
            cov-shards/go-edge-coverage-shard-2/shard-2.out \
            -o coverage.out

      - name: Coverage check (informational)
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true'
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Overall coverage: ${COVERAGE}%"
          echo "::notice::edge-server overall coverage: ${COVERAGE}%"

      - name: Coverage per-package minimums
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true'
        run: |
          echo "=== Per-package coverage minimums ==="
          check_pkg() {
            local pattern="$1"
            local min="$2"
            local label="$3"
            local cov
            cov=$(go tool cover -func=coverage.out | grep "$pattern" | awk '{sum+=$NF; n++} END {if(n>0) printf "%.1f", sum/n; else print "0"}')
            echo "  ${label}: ${cov}% (min: ${min}%)"
            awk -v c="$cov" -v m="$min" 'BEGIN { if (c !~ /^[0-9]+(\.[0-9]+)?$/ || m !~ /^[0-9]+(\.[0-9]+)?$/) exit 2; exit (c+0 < m+0) }'
            rc=$?
            if [[ "$rc" -ne 0 ]]; then
              echo "::error::${label} coverage '${cov}' is invalid or below ${min}% minimum"
              return 1
            fi
          }
          FAILED=0
          check_pkg "edge-server/internal/security/" 70 "security" || FAILED=1
          check_pkg "edge-server/internal/lifecycle/" 60 "lifecycle" || FAILED=1
          check_pkg "edge-server/internal/adapters/" 55 "adapters" || FAILED=1
          exit $FAILED

      # Fallback: keep the required check reported even when the Go path
      # filter deselects this job (skipped jobs never satisfy branch
      # protection and permanently block frontend-only PRs).
      # The job default cwd (edge-server) does not exist when checkout was
      # deselected; anchor the fallback at the repo root.
      - name: Report no-Go-changes skip (required check)
        if: ${{ !cancelled() && github.event_name != 'workflow_dispatch' && needs.changes.result == 'success' && needs.changes.outputs.go != 'true' }}
        working-directory: .
        run: |
          echo "skipped: no Go changes; reporting success for required check go-edge"
          exit 0

      # Fail-closed: when the path filter itself fails, the Go verdict is
      # unknown. Report failure instead of letting the skip fallback mask
      # the skipped real gates as green.
      - name: Fail when Go path filter failed
        if: ${{ !cancelled() && github.event_name != 'workflow_dispatch' && needs.changes.result != 'success' }}
        working-directory: .
        run: |
          echo "::error::changes job result: ${{ needs.changes.result }}; cannot decide Go gates for go-edge"
          exit 1

  # ── Go: Edge Server tests (shard×2) ──────────
  # CI (#1689): the single-pass `go test ./... -race -coverprofile`
  # (~116s wall) is split into a 2-shard matrix; each shard gets its own
  # 4-core runner. Go has no native -shard flag, so packages from
  # `go list ./...` are split round-robin (NR%2) — balanced and disjoint.
  # Each shard writes a text -coverprofile; the go-edge job merges them
  # with scripts/verify/merge-coverprofiles.py (repo-local, no third-party
  # tool). -coverpkg=./... keeps the full package set in every shard
  # profile so the merged totals match a single pass.
  go-edge-test:
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge-server
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: edge-server/go.sum

      - name: Test (unit only + race, shard ${{ matrix.shard }}/2)
        timeout-minutes: 15
        run: |
          PKG_LIST=$(go list ./...)
          # Plain round-robin, deliberately NOT the cost-aware split go-hub-test
          # uses (ADR-032). Measured the same way (`go test -short -race
          # -count=1 -p 1`): 35 packages / 143.96s total, heaviest is
          # internal/lifecycle at 34.57s = 24.0% — no dominant package to pin.
          # The split is still uneven (shard 1 = even NR carries 86.5s vs 57.4s,
          # which is why CI shows edge shard 2 faster in 14/14 runs) and LPT-2
          # would save 14.1s of load at a balanced 18/18 package count, but
          # go-edge-test is never the pole of backend-required (2m39s vs
          # go-hub-test 4m51s), so that saving never reaches the PR wall clock.
          # Re-consider if go-edge-test ever becomes the backend pole.
          SHARD_PKGS=$(echo "$PKG_LIST" | awk -v s=${{ matrix.shard }} 'NR % 2 == s - 1 {printf "%s ", $1}')
          if [ -z "$SHARD_PKGS" ]; then
            echo "::error::shard ${{ matrix.shard }} received 0 packages"
            exit 1
          fi
          go test $SHARD_PKGS -count=1 -short -race -coverpkg=./... \
            -coverprofile=shard-${{ matrix.shard }}.out -covermode=atomic -timeout=15m

      - name: Upload shard coverage data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: go-edge-coverage-shard-${{ matrix.shard }}
          path: edge-server/shard-${{ matrix.shard }}.out
          retention-days: 1

  # ── Go: Hub static gates (parallel) ──────────
  # None of the gates below consumes the shard coverage artifacts, so they run
  # in parallel with go-hub-test. The stable required check go-hub aggregates
  # this result. Gates below are gated at job level only.
  go-hub-static:
    needs: changes
    # Job-level path filter — the same expression the real gates below carry.
    # When Go is deselected this job is skipped; go-hub still reports its
    # controlled no-op success because its lane assertions share this filter,
    # so a skipped static lane can never redden a Go-less PR.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub-server
    steps:
      - if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true'
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: hub-server/go.sum

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: hub-server
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=5m

      # staticcheck hard-blocking — hub-server findings zero-baselined;
      # version pinned to prevent new-check drift from breaking CI.
      # Binary cached across runs (gha cache keyed on pinned versions).
      # Restore must precede both gosec and staticcheck steps.
      - name: Cache static-analysis binaries (staticcheck + gosec)
        id: sa-cache
        uses: actions/cache@v5
        with:
          path: |
            ~/go/bin/staticcheck
            ~/go/bin/gosec
          key: sa-tools-gosec-2.28.0-staticcheck-2026.1

      - name: Install gosec
        run: |
          if [ ! -x ~/go/bin/gosec ]; then
            go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
          fi

      - name: Security scan (gosec)
        # #1574: hard fail (findings zero-baselined), matching go-edge.
        run: ~/go/bin/gosec -fmt=json ./... 2>/dev/null | bash ../scripts/verify/verify-gosec-gates.sh

      - name: Vet
        run: go vet ./...

      - name: staticcheck
        run: |
          if [ ! -x ~/go/bin/staticcheck ]; then
            go install honnef.co/go/tools/cmd/staticcheck@2026.1
          fi
          staticcheck ./... 2>&1

  # ── Go: Hub Server (required check) ──────────
  # CI (#1689): test execution lives in go-hub-test (2-shard matrix,
  # each shard on its own 4-core runner). lint and the rest of
  # the static analysis moved to go-hub-static so they run in parallel with
  # the shards instead of serialising behind them. What stays here genuinely
  # needs the shard artifacts — download + merge with
  # scripts/verify/merge-coverprofiles.py (repo-local) and the coverage gates —
  # plus fail-closed assertions on both upstream lanes, so a static or test
  # failure still reddens this required check (and through it backend-required,
  # whose needs list therefore stays unchanged).
  go-hub:
    needs: [changes, go-hub-test, go-hub-static]
    # Required check: always report a result so a path-filtered skip cannot
    # block branch protection. Real gates below run only for Go changes.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub-server
    steps:
      - if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true'
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: hub-server/go.sum

      # this job aggregates two parallel upstream lanes instead
      # of running the static gates itself, so both verdicts are bound and
      # asserted fail-closed (same convention as windows-go / backend-required):
      # any lane that is not `success` — including a `skipped` static lane on a
      # Go-selected PR — reddens the required check instead of reporting a false
      # green. Static-gate failures reach branch protection through go-hub,
      # which is why backend-required needs no new entry.
      - name: Assert Hub static gate lane result (go-hub-static)
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true'
        working-directory: .
        env:
          STATIC_RESULT: ${{ needs.go-hub-static.result }}
        run: |
          if [ "$STATIC_RESULT" != "success" ]; then
            echo "::error::go-hub-static result: $STATIC_RESULT; lint / gosec / vet / staticcheck did not pass"
            exit 1
          fi

      - name: Assert Hub unit test lane result (go-hub-test)
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true'
        working-directory: .
        env:
          TEST_RESULT: ${{ needs.go-hub-test.result }}
        run: |
          if [ "$TEST_RESULT" != "success" ]; then
            echo "::error::go-hub-test result: $TEST_RESULT; shard unit tests did not pass"
            exit 1
          fi

      # CI (#1689): test execution lives in go-hub-test (2-shard
      # matrix). This job merges the shard text profiles with
      # scripts/verify/merge-coverprofiles.py and keeps the overall >=40%
      # gate hard-blocking.
      - name: Download shard coverage data
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true'
        uses: actions/download-artifact@v7
        with:
          pattern: go-hub-coverage-shard-*
          path: hub-server/cov-shards

      - name: Merge shard coverage (coverprofile text)
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true'
        run: |
          python ../scripts/verify/merge-coverprofiles.py \
            cov-shards/go-hub-coverage-shard-1/shard-1.out \
            cov-shards/go-hub-coverage-shard-2/shard-2.out \
            -o coverage.out

      - name: Coverage check (overall >= 40%)
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true'
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          THRESHOLD=40
          echo "Overall coverage: ${COVERAGE}% (threshold: ${THRESHOLD}%)"
          awk -v c="$COVERAGE" -v t="$THRESHOLD" 'BEGIN { if (c !~ /^[0-9]+(\.[0-9]+)?$/) exit 2; exit (c+0 < t+0) }'
          rc=$?
          if [[ "$rc" -ne 0 ]]; then
            echo "::error::Coverage '${COVERAGE}' is invalid or below ${THRESHOLD}% threshold"
            exit 1
          fi

      # Fallback: keep the required check reported even when the Go path
      # filter deselects this job (skipped jobs never satisfy branch
      # protection and permanently block frontend-only PRs).
      # The job default cwd (hub-server) does not exist when checkout was
      # deselected; anchor the fallback at the repo root.
      - name: Report no-Go-changes skip (required check)
        if: ${{ !cancelled() && github.event_name != 'workflow_dispatch' && needs.changes.result == 'success' && needs.changes.outputs.go != 'true' }}
        working-directory: .
        run: |
          echo "skipped: no Go changes; reporting success for required check go-hub"
          exit 0

      # Fail-closed: when the path filter itself fails, the Go verdict is
      # unknown. Report failure instead of letting the skip fallback mask
      # the skipped real gates as green.
      - name: Fail when Go path filter failed
        if: ${{ !cancelled() && github.event_name != 'workflow_dispatch' && needs.changes.result != 'success' }}
        working-directory: .
        run: |
          echo "::error::changes job result: ${{ needs.changes.result }}; cannot decide Go gates for go-hub"
          exit 1

  # ── Go: Hub Server tests (shard×2) ───────────
  # CI (#1689): 2-shard package split (Go has no native -shard flag).
  # The non-zero PASS guard runs per shard, so a package-wide -short
  # escape hatch still trips a hard error.
  #
  # The split is NOT the `NR % 2` round-robin that go-edge-test still uses, and
  # the reason is measured, not aesthetic (ADR-032). Per-package
  # `go test -short -race -count=1 -p 1` on the 52 hub packages totals 418.8s,
  # and ONE package is 227.7s of it — `internal/repository` = 54.4%. Under
  # `NR % 2` it sits at `go list` position 15 (odd) so it lands in shard 2,
  # which was the slower shard in 14/14 measured CI runs (median +119s,
  # max +177s; 18/18 in the post-#2300 window, median |Δ| 2m02s).
  # Handing it its own shard is the load-optimal 2-way partition:
  #   227.7s / 191.1s  (spread 36.6s)  instead of  310.5s / 108.3s (spread 202.3s)
  # and it adds no jobs, so it costs no runner concurrency.
  #
  # 227.7s is also the HARD FLOOR: no package-granularity split of this module
  # can put the worst shard below one package's own cost, so a 3rd shard buys
  # nothing here (LPT-3 gives the same 227.7s worst shard for one more job).
  #
  # Rot is fail-closed, not silent: if internal/repository is ever renamed,
  # moved or split, shard 1 receives 0 packages and the guard below hard-errors
  # with "::error::shard 1 received 0 packages" — which is the cue to
  # re-measure with: go test ./... -count=1 -short -race -p 1 -parallel 1
  go-hub-test:
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub-server
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: hub-server/go.sum

      - name: Test (unit only + race, shard ${{ matrix.shard }}/2)
        timeout-minutes: 15
        run: |
          PKG_LIST=$(go list ./...)
          # shard 1 = the one package that is 54% of this module's measured
          # race-test cost; shard 2 = every other package. See the job comment.
          SHARD_PKGS=$(echo "$PKG_LIST" | awk -v s=${{ matrix.shard }} '
            { solo = ($1 == "github.com/agenthub/hub-server/internal/repository") ? 1 : 2 }
            solo == s { printf "%s ", $1 }
          ')
          if [ -z "$SHARD_PKGS" ]; then
            echo "::error::shard ${{ matrix.shard }} received 0 packages"
            exit 1
          fi
          go test $SHARD_PKGS -count=1 -short -race -coverpkg=./... \
            -coverprofile=shard-${{ matrix.shard }}.out -covermode=atomic -v 2>&1 | tee unit-test-shard.log
          GO_EXIT=${PIPESTATUS[0]}
          PASS_COUNT=$(grep -c "^--- PASS" unit-test-shard.log || true)
          echo "unit lane PASS count (shard ${{ matrix.shard }}/2): ${PASS_COUNT}"
          if [ "${PASS_COUNT}" -lt 1 ]; then
            echo "::error::unit lane shard executed 0 tests — hub-server/tests must not hide behind a package-wide -short exit"
            tail -50 unit-test-shard.log
            exit 1
          fi
          if [ "${GO_EXIT}" -ne 0 ]; then
            echo "::error::unit lane go test exit ${GO_EXIT}"
            tail -50 unit-test-shard.log
            exit 1
          fi

      - name: Upload shard coverage data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: go-hub-coverage-shard-${{ matrix.shard }}
          path: hub-server/shard-${{ matrix.shard }}.out
          retention-days: 1

  # ── Go: Native Windows contract ───────────────
  # Ubuntu remains the fast, sharded Linux gate. This matrix runs the same
  # short backend suites on the native Windows runner so path handling,
  # process spawning, environment-key casing, and Windows-specific test
  # behavior cannot regress behind a Linux-only green build.
  windows-go-test:
    name: Native Windows Go (${{ matrix.module }})
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.go == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module: [edge-server, hub-server]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Run native Windows unit suite
        shell: pwsh
        run: |
          $log = & go test ./... -short -count=1 -timeout 15m -v 2>&1
          $code = $LASTEXITCODE
          $log | Write-Output
          if ($code -ne 0) { exit $code }
          if (-not ($log | Select-String -Pattern '^--- PASS')) {
            Write-Error "no tests ran (0 PASS lines)"
            exit 1
          }

  # ── Frontend: Native Windows contract ─────────
  # Linux owns the frontend visual gates and both web/desktop unit suites.
  # Windows keeps only the native Desktop host contract (filesystem casing and
  # Tauri platform drift); the web bundle does not need a second OS build.
  windows-frontend-test:
    name: Native Windows frontend (${{ matrix.package }})
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.frontend == 'true'
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        package: [agenthub-desktop]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-pnpm

      - name: Type check
        run: pnpm --filter ${{ matrix.package }} typecheck

      - name: Unit tests
        run: pnpm --filter ${{ matrix.package }} test

      - name: Production build
        run: pnpm --filter ${{ matrix.package }} build

  # Stable required-check aggregators. GitHub exposes each matrix leg as a
  # separate check name; these two jobs keep branch protection independent of
  # matrix cardinality while treating an intentionally path-filtered suite as
  # a successful no-op.
  windows-go:
    name: windows-go
    needs: [changes, windows-go-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Assert Windows Go matrix result
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGE_RESULT: ${{ needs.changes.outputs.go }}
          CHANGES_STATUS: ${{ needs.changes.result }}
          MATRIX_RESULT: ${{ needs.windows-go-test.result }}
        run: |
          if [ "$EVENT_NAME" != "workflow_dispatch" ] && [ "$CHANGES_STATUS" != "success" ]; then
            echo "::error::changes job result: $CHANGES_STATUS; cannot decide windows go contract"
            exit 1
          fi
          if [ "$EVENT_NAME" != "workflow_dispatch" ] && [ "$CHANGE_RESULT" != "true" ]; then
            echo "Windows Go contract not selected by path filter; treating as successful no-op."
            exit 0
          fi
          if [ "$MATRIX_RESULT" != "success" ]; then
            echo "::error::Windows Go contract result: $MATRIX_RESULT"
            exit 1
          fi

  windows-frontend:
    name: windows-frontend
    needs: [changes, windows-frontend-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Assert Windows frontend matrix result
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGE_RESULT: ${{ needs.changes.outputs.frontend }}
          CHANGES_STATUS: ${{ needs.changes.result }}
          MATRIX_RESULT: ${{ needs.windows-frontend-test.result }}
        run: |
          if [ "$EVENT_NAME" != "workflow_dispatch" ] && [ "$CHANGES_STATUS" != "success" ]; then
            echo "::error::changes job result: $CHANGES_STATUS; cannot decide windows frontend contract"
            exit 1
          fi
          if [ "$EVENT_NAME" != "workflow_dispatch" ] && [ "$CHANGE_RESULT" != "true" ]; then
            echo "Windows frontend contract not selected by path filter; treating as successful no-op."
            exit 0
          fi
          if [ "$MATRIX_RESULT" != "success" ]; then
            echo "::error::Windows frontend contract result: $MATRIX_RESULT"
            exit 1
          fi

  backend-required:
    name: backend-required
    needs: [changes, go-edge, go-hub, backend-integration, backend-edge-e2e, backend-e2e-fixture]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Assert backend L0/L1/L2 matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGE_RESULT: ${{ needs.changes.outputs.go }}
          CHANGES_STATUS: ${{ needs.changes.result }}
          EDGE_RESULT: ${{ needs.go-edge.result }}
          HUB_RESULT: ${{ needs.go-hub.result }}
          INTEGRATION_RESULT: ${{ needs.backend-integration.result }}
          EDGE_E2E_RESULT: ${{ needs.backend-edge-e2e.result }}
          FIXTURE_RESULT: ${{ needs.backend-e2e-fixture.result }}
        run: |
          if [ "$EVENT_NAME" != "workflow_dispatch" ] && [ "$CHANGES_STATUS" != "success" ]; then
            echo "::error::changes job result: $CHANGES_STATUS; cannot decide backend gates"
            exit 1
          fi
          if [ "$EVENT_NAME" != "workflow_dispatch" ] && [ "$CHANGE_RESULT" != "true" ]; then
            echo "Backend L0/L1/L2 not selected by path filter; treating as successful no-op."
            exit 0
          fi
          if [ "$EDGE_RESULT" != "success" ]; then
            echo "::error::go-edge result: $EDGE_RESULT"
            exit 1
          fi
          if [ "$HUB_RESULT" != "success" ]; then
            echo "::error::go-hub result: $HUB_RESULT"
            exit 1
          fi
          if [ "$INTEGRATION_RESULT" != "success" ]; then
            echo "::error::backend-integration result: $INTEGRATION_RESULT"
            exit 1
          fi
          if [ "$EDGE_E2E_RESULT" != "success" ]; then
            echo "::error::backend-edge-e2e result: $EDGE_E2E_RESULT"
            exit 1
          fi
          if [ "$FIXTURE_RESULT" != "success" ]; then
            echo "::error::backend-e2e-fixture result: $FIXTURE_RESULT"
            exit 1
          fi

  # ── Backend E2E: Fixture-only ────────────────
  backend-e2e-fixture:
    name: Backend E2E (fixture-only)
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub-server
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: hub-server/go.sum

      - name: TeamRun fixture E2E
        run: |
          output=$(go test ./tests/teamrun -run '^TestTeamRunSmoke$' -count=1 -v 2>&1) || { echo "$output"; exit 1; }
          echo "$output"
          if ! grep -q -- '--- PASS: TestTeamRunSmoke' <<<"$output"; then
            echo "::error::TestTeamRunSmoke did not run (0 tests matched)"
            exit 1
          fi

  # ── Backend: Edge→Hub callback smoke (fixture-only) ──────────
  # The whole edge-server/tests package is the fixture E2E suite: it spins up a
  # mock Hub + in-process Edge ProcessExecutor and asserts ack/stream/done/fail
  # direct-callback delivery (11 tests, ~4s locally). The parts guarded by
  # testing.Short() are skipped by the go-edge -short unit lane, so this lane
  # runs the package unfiltered with a non-zero PASS assertion (same pattern as
  # backend-integration) so a 0-test lane fails.
  backend-edge-e2e:
    name: Backend Edge E2E (fixture-only)
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge-server
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: edge-server/go.sum

      - name: Edge→Hub callback smoke
        run: |
          go test ./tests/ -count=1 -v -timeout 120s 2>&1 | tee edge-e2e.log
          GO_EXIT=${PIPESTATUS[0]}
          PASS_COUNT=$(grep -c "^--- PASS" edge-e2e.log || true)
          echo "edge e2e lane PASS count: ${PASS_COUNT}"
          if [ "${PASS_COUNT}" -lt 1 ]; then
            echo "::error::edge e2e lane executed 0 tests — lane must prove non-zero execution"
            tail -50 edge-e2e.log
            exit 1
          fi
          if [ "${GO_EXIT}" -ne 0 ]; then
            echo "::error::edge e2e lane go test exit ${GO_EXIT}"
            tail -50 edge-e2e.log
            exit 1
          fi

  # ── Backend: Integration (real PostgreSQL + Redis) ──────────
  # hub-server/tests/integration is `//go:build integration` (lane manifest):
  # the default -short lanes never compile it, so the suite can no longer
  # silently vanish via a package-wide TestMain escape hatch. This job
  # provisions PostgreSQL + Redis service containers and runs the lane with
  # `-tags integration`, asserting non-zero PASS count so a 0-test lane fails.
  # The -short lanes cover the unit suites separately.
  backend-integration:
    name: Backend integration (PostgreSQL + Redis)
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agenthub
          POSTGRES_PASSWORD: agenthub
          POSTGRES_DB: agenthub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agenthub -d agenthub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6
    env:
      # config.Load uses viper AutomaticEnv with AGENTHUB_ prefix; these wire
      # the test config at the service containers (host=127.0.0.1 on the
      # runner-host network for services with mapped ports).
      AGENTHUB_DB_HOST: 127.0.0.1
      AGENTHUB_DB_PORT: "5432"
      AGENTHUB_DB_USER: agenthub
      AGENTHUB_DB_PASSWORD: agenthub
      AGENTHUB_DB_NAME: agenthub
      AGENTHUB_DB_SSLMODE: disable
      AGENTHUB_REDIS_HOST: 127.0.0.1
      AGENTHUB_REDIS_PORT: "6379"
      AGENTHUB_JWT_SECRET: "ci-integration-jwt-secret-min-32-chars-ok!!"
      AGENTHUB_ENV: test
      # OIDC authorize 测试走真实 router，需要非空 OIDC 配置；
      # 占位值即可（GenerateAuthorizationURL 只组装 URL 不发起网络请求）。
      AGENTHUB_TOKENDANCE_ID_ISSUER_URL: "https://id.example.invalid"
      AGENTHUB_TOKENDANCE_ID_CLIENT_ID: "ci-integration-client"
      AGENTHUB_TOKENDANCE_ID_CLIENT_SECRET: "ci-integration-secret-not-a-real-secret"
      AGENTHUB_TOKENDANCE_ID_REDIRECT_URI: "http://127.0.0.1:8080/client/auth/oidc/callback"
      # migration_audit_test.go 需要 admin URL（superuser）来 CREATE/DROP 独立测试库。
      # agenthub:agenthub 是 CI PG 测试容器的 throwaway 凭据，127.0.0.1 是 runner loopback，非真实凭据。
      AGENTHUB_PG_MIGRATION_TEST_ADMIN_URL: "postgres://agenthub:agenthub@127.0.0.1:5432/agenthub?sslmode=disable"  # leak-guard-allow:LG-F4C6A155
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: hub-server/go.sum

      - name: Build hub-server
        working-directory: hub-server
        run: go build ./...

      - name: Integration tests (no -short; real PostgreSQL + Redis)
        working-directory: hub-server
        run: |
          go test -tags integration ./tests/integration/ -count=1 -timeout=20m -v 2>&1 | tee integration-test.log
          GO_EXIT=${PIPESTATUS[0]}
          PASS_COUNT=$(grep -c "^--- PASS" integration-test.log || true)
          echo "integration lane PASS count: ${PASS_COUNT}"
          if [ "${PASS_COUNT}" -lt 1 ]; then
            echo "::error::integration lane executed 0 tests — lane must prove non-zero execution"
            tail -50 integration-test.log
            exit 1
          fi
          if [ "${GO_EXIT}" -ne 0 ]; then
            echo "::error::integration lane go test exit ${GO_EXIT}"
            tail -50 integration-test.log
            exit 1
          fi

      - name: Migration-up coverage (real PostgreSQL)
        working-directory: hub-server
        run: |
          go test ./internal/repository/ -run 'TestMigration0040' -count=1 -v -timeout=120s 2>&1 | tee migration-test.log
          GO_EXIT=${PIPESTATUS[0]}
          PASS_COUNT=$(grep -c "^--- PASS" migration-test.log || true)
          echo "migration lane PASS count: ${PASS_COUNT}"
          if [ "${PASS_COUNT}" -lt 1 ]; then
            echo "::error::migration lane executed 0 tests — lane must prove non-zero execution"
            tail -50 migration-test.log
            exit 1
          fi
          if [ "${GO_EXIT}" -ne 0 ]; then
            echo "::error::migration lane go test exit ${GO_EXIT}"
            tail -50 migration-test.log
            exit 1
          fi

  # ── Unified Path Filter ────────────────────────
  # only run CI jobs when relevant paths change.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
      rust: ${{ steps.filter.outputs.rust }}
      web: ${{ steps.filter.outputs.web }}
      shell: ${{ steps.filter.outputs.shell }}
      go: ${{ steps.filter.outputs.go }}
      mobile: ${{ steps.filter.outputs.mobile }}
      frontend: ${{ steps.filter.outputs.frontend }}
      design_css: ${{ steps.filter.outputs.design_css }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            desktop:
              - 'tests/fixtures/dispatch/**'
              - 'app/desktop/**'
              - 'app/shared/**'
              - 'app/workbench/**'
              - 'app/package.json'
              - 'app/pnpm-lock.yaml'
              - 'app/pnpm-workspace.yaml'
              - 'app/.npmrc'
              - 'scripts/verify/verify-rust-advisories.sh'
              - 'scripts/verify/tests/test_verify_rust_advisories.sh'
              - 'scripts/verify/tests/fixtures/rust-advisories/**'
              - '.github/workflows/checks.yml'
            rust:
              - 'app/desktop/src-tauri/**'
              - 'scripts/verify/verify-rust-advisories.sh'
              - 'scripts/verify/tests/test_verify_rust_advisories.sh'
              - 'scripts/verify/tests/fixtures/rust-advisories/**'
              - '.github/workflows/checks.yml'
            web:
              - 'app/web/**'
              - 'app/shared/**'
              - 'app/workbench/**'
              - 'app/package.json'
              - 'app/pnpm-lock.yaml'
              - 'app/pnpm-workspace.yaml'
              - 'app/.npmrc'
              - '.github/workflows/checks.yml'
            shell:
              - 'app/workbench/**'
              - 'app/shared/src/styles/**'
              - 'app/shared/src/theme*.ts'
              - 'app/shared/src/themePresets.*'
              - 'app/shared/src/designTokens.*'
              # transcript + shared components live entirely in these two
              # directories (#1940): a pure shared-component visual change
              # must trigger the Visual QA gate.
              - 'app/shared/src/ui/**'
              - 'app/shared/src/chatview/**'
              - 'app/web/scripts/visual-qa*'
              - 'app/web/scripts/assert-visual-qa-shell.mjs'
              - 'app/web/scripts/assert-visual-qa-chat.mjs'
              - 'app/desktop/scripts/visual-qa*'
              - 'app/desktop/scripts/assert-visual-qa-shell.mjs'
              - 'app/desktop/scripts/assert-visual-qa-chat.mjs'
              - 'app/web/src/**'
              - 'app/desktop/src/**'
              - 'app/web/package.json'
              - 'app/desktop/package.json'
              - '.github/workflows/checks.yml'
            go:
              - 'tests/fixtures/dispatch/**'
              - 'hub-server/**'
              - 'edge-server/**'
              - 'pkg/**'
              - 'go.work*'
              - 'api/**'
              - 'scripts/verify/**'
              - '.github/workflows/checks.yml'
            mobile:
              - 'app/mobile-rn/**'
              - 'app/shared/**'
              - 'app/test-config/**'
              - 'app/package.json'
              - 'app/pnpm-lock.yaml'
              - 'app/pnpm-workspace.yaml'
              - 'app/.npmrc'
              - '.github/workflows/checks.yml'
            # frontend = desktop ∪ web ∪ shared ∪ workbench. Triggers the
            # Windows frontend lanes and vuln-scan-js; kept path-scoped so a
            # Go-only PR does not pay for pnpm install.
            frontend:
              - 'tests/fixtures/dispatch/**'
              - 'app/desktop/**'
              - 'app/web/**'
              - 'app/shared/**'
              - 'app/workbench/**'
              - 'app/package.json'
              - 'app/pnpm-lock.yaml'
              - 'app/pnpm-workspace.yaml'
              - 'app/.npmrc'
              - 'app/test-config/**'
              - '.github/workflows/checks.yml'
            # design_css = CSS gate: stylelint lints all app CSS rules and parses
            # tokens*/themes*/presets*.css, which the regular config ignores.
            design_css:
              - 'app/**/*.css'
              - 'app/stylelint.syntax.json'
              - 'app/.stylelintignore-syntax'
              - 'app/package.json'
              - 'app/pnpm-lock.yaml'
              - 'app/pnpm-workspace.yaml'
              - 'app/.npmrc'
              - '.github/workflows/checks.yml'

  # ── Frontend: Desktop ────────────────────────
  frontend-desktop:
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/desktop
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-pnpm

      - name: Type check
        run: pnpm typecheck

      # Blocking architecture gate. The full lint ruleset still has legacy
      # debt; this config contains only the import/literal boundaries.
      - name: Lint frontend boundaries
        working-directory: app
        run: pnpm lint:boundaries

      # CI: vitest shard matrix. `pnpm test:ci` chains 4 vitest configs
      # serially (≈337s). Split into 2 parallel shards; each shard re-runs
      # all 4 configs but only its slice of test files (--shard i/2).
      # --passWithNoTests only covers an empty shard slice. The preflight
      # below rejects a config that collects no tests at all.
      - name: Assert desktop test configs are non-empty
        if: matrix.shard == 1
        run: |
          for config in vitest.desktop-ts-ci.config.ts vitest.desktop-tsx-ci.config.ts vitest.edge-integration-ci.config.ts vitest.shared-ci.config.ts; do
            if ! pnpm exec vitest list --config "$config" --filesOnly | grep -q .; then
              echo "::error::$config collects no test files"
              exit 1
            fi
          done

      - name: Test Desktop (shard ${{ matrix.shard }}/2)
        run: |
          pnpm exec vitest run --config vitest.desktop-ts-ci.config.ts --shard ${{ matrix.shard }}/2 --passWithNoTests
          pnpm exec vitest run --config vitest.desktop-tsx-ci.config.ts --shard ${{ matrix.shard }}/2 --passWithNoTests
          pnpm exec vitest run --config vitest.edge-integration-ci.config.ts --shard ${{ matrix.shard }}/2 --passWithNoTests
          pnpm exec vitest run --config vitest.shared-ci.config.ts --shard ${{ matrix.shard }}/2 --passWithNoTests
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

  # ── Desktop Linux native build (Tauri) ──────
  # 重 job（Rust + webkit2gtk 编译），仅 workflow_dispatch 成本节流。
  # 作为 release.yml build-desktop-linux 的发布前预检：验证 Linux 桌面端
  # 前端构建 + Rust 编译 + edge sidecar 解析全链路，`--no-bundle` 不产出
  # 安装包、不需要 TAURI_SIGNING_PRIVATE_KEY。
  desktop-linux-build:
    name: Desktop Linux native build (Tauri)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Tauri Linux system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build edge-server sidecar (Linux)
        shell: bash
        run: |
          mkdir -p app/desktop/src-tauri/binaries
          (cd edge-server && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ../app/desktop/src-tauri/binaries/agenthub-edge-x86_64-unknown-linux-gnu ./cmd/agenthub-edge/)
          chmod +x app/desktop/src-tauri/binaries/agenthub-edge-x86_64-unknown-linux-gnu

      - uses: ./.github/actions/setup-node-pnpm

      # Desktop↔Edge real E2E (#1678): builds and runs the actual Go
      # Edge server (mock executor default) and asserts REST + WebSocket
      # contract + run lifecycle. Runs here because this job already has
      # setup-go + pnpm install.
      - name: Desktop↔Edge real E2E (Go edge server + REST/WS contract)
        working-directory: app/desktop
        run: |
          if ! pnpm exec vitest list --config vitest.edge-real-ci.config.ts --filesOnly | grep -q .; then
            echo "::error::edge-real lane collected 0 test files"
            exit 1
          fi
          pnpm exec vitest run --config vitest.edge-real-ci.config.ts

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/desktop/src-tauri

      - name: Build Tauri (no bundle)
        working-directory: app/desktop
        run: pnpm tauri build --no-bundle

  # ── Frontend: Web ────────────────────────────
  frontend-web:
    name: Frontend (web)
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app/web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm

      # #2274: was `continue-on-error: true`, i.e. structurally incapable of
      # failing — which is how six `no-explicit-any` errors lived on master
      # unnoticed (all the same hand-copied `options?: any` translate signature).
      # They are fixed, so the step is a real gate now: web's lint
      # script is `eslint src --max-warnings 0` and reports 0 problems.
      - name: Lint Web
        run: pnpm lint

      - name: Build Web
        run: pnpm build
      - name: Test
        run: pnpm test -- --run

  # ── Frontend: Mobile light (PR path-filtered) ──
  # typecheck + unit tests only. No Expo export / Playwright / doctor.
  # Closes the post-#1341 gap where mobile PRs skipped all mobile CI.
  frontend-mobile-light:
    name: Frontend (mobile light)
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./app
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - name: Lint frontend boundaries
        run: pnpm lint:boundaries
      - name: Type check (mobile)
        run: pnpm --filter agenthub-mobile-rn typecheck
      - name: Unit tests (mobile)
        run: pnpm --filter agenthub-mobile-rn test

  # ── Frontend: Mobile full ───────────────────────
  # 重 job（Playwright/Expo export/coverage）；仅 workflow_dispatch 成本节流。
  frontend-mobile:
    name: Frontend (mobile)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ./app
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm

      - name: Type check (mobile)
        run: pnpm --filter agenthub-mobile-rn typecheck

      # #2274: was `continue-on-error: true` (advisory). The exact CI command
      # reports 0 errors / 1 react-hooks warning, and the mobile lint script does
      # not pass --max-warnings, so this is a real gate now.
      - name: Lint (mobile rules)
        run: pnpm --filter agenthub-mobile-rn lint

      # ── Hardened: Test with coverage reporting ──
      # Absolute floors live in vitest.config.ts (createCoverage factory,
      # #1535); no CLI overrides here. The provider is the workspace-root
      # @vitest/coverage-v8 (hoisted), so no add -D step is needed.
      - name: Test with coverage (mobile)
        run: |
          pnpm --filter agenthub-mobile-rn exec vitest run --coverage
          echo "::notice::Mobile coverage report generated (config thresholds apply)."

      # ── Hardened: Bundle size check (Expo web export) ──
      - name: Bundle size check (mobile web export)
        run: |
          echo "=== Mobile bundle size check ==="
          cd mobile-rn
          npx expo export --platform web --output-dir dist/web-export 2>&1
          if [ -d dist/web-export ]; then
            BUNDLE_SIZE_KB=$(du -sk dist/web-export | cut -f1)
            MAX_SIZE_KB=153600
            echo "Web export bundle size: ${BUNDLE_SIZE_KB} KB (max: ${MAX_SIZE_KB} KB)"
            if [ "${BUNDLE_SIZE_KB}" -gt "${MAX_SIZE_KB}" ]; then
              echo "::error::Web export bundle size ${BUNDLE_SIZE_KB} KB exceeds ${MAX_SIZE_KB} KB threshold"
              exit 1
            fi
            echo "::notice::Bundle size check passed: ${BUNDLE_SIZE_KB} KB under ${MAX_SIZE_KB} KB"
          else
            echo "::error::Web export did not produce output directory"
            exit 1
          fi

      # ── Hardened: Screenshot diff testing (visual QA) ──
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('app/pnpm-lock.yaml') }}
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Screenshot visual QA (mobile)
        timeout-minutes: 12
        run: |
          echo "=== Mobile screenshot visual QA ==="
          cd mobile-rn
          node scripts/visual-qa.mjs
        env:
          AGENTHUB_MOBILE_MOCK_HUB_PORT: '8088'
          CI: 'true'

      - name: Upload mobile screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-visual-qa-screenshots
          path: app/mobile-rn/screenshots/visual-qa/
          retention-days: 7

      - name: E2E (mock hub)
        timeout-minutes: 10
        run: |
          node mobile-rn/scripts/mock-hub.mjs &
          MOCK_HUB_PID=$!
          # Wait for mock hub to accept connections
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8088/health > /dev/null 2>&1; then
              echo "Mock hub ready at http://127.0.0.1:8088"
              break
            fi
            sleep 1
          done
          # Run vitest with mock hub available
          AGENTHUB_MOBILE_MOCK_HUB_PORT=8088 pnpm --filter agenthub-mobile-rn test
          E2E_EXIT_CODE=$?
          kill $MOCK_HUB_PID 2>/dev/null || true
          wait $MOCK_HUB_PID 2>/dev/null || true
          exit $E2E_EXIT_CODE

      # #1678: wire the 6 mobile-rn Playwright __e2e__ specs (auth/chat/
      # settings/tasks/threads/workbench). The playwright.config.ts webServer
      # block starts the mock hub + `expo start --web` itself, so this is a
      # single command. Runs only on workflow_dispatch.
      - name: E2E (Playwright, mock hub + Expo web)
        timeout-minutes: 25
        run: pnpm --filter agenthub-mobile-rn test:e2e

      - name: Verify Mobile RN
        run: pnpm --filter agenthub-mobile-rn verify
      - name: Expo Doctor
        run: pnpm --filter agenthub-mobile-rn run doctor
      - name: Native readiness
        run: pnpm --filter agenthub-mobile-rn run native:check
      - name: Mock Hub contract
        run: pnpm --filter agenthub-mobile-rn run mock:hub:check

  # ── Visual QA Shell (path-filtered) ──────────
  # Gate matrix evidence on relevant UI paths only (#1287).
  # Path filter merged into unified `changes` job (#1333).
  visual-qa-shell:
    name: Visual QA shell (web, path-filtered)
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./app
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-pnpm

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('app/pnpm-lock.yaml') }}
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Capture web visual:qa:shell
        timeout-minutes: 15
        working-directory: ./app/web
        run: |
          # Flake retry (#1949): browser capture can fail transiently on CI runners.
          for attempt in 1 2; do
            echo "::group::visual:qa:shell attempt ${attempt}"
            if pnpm visual:qa:shell; then
              echo "::endgroup::"
              break
            fi
            echo "::endgroup::"
            if [ "$attempt" = "2" ]; then
              echo "::error::visual:qa:shell failed after 2 attempts"
              exit 1
            fi
            echo "::warning::visual:qa:shell attempt ${attempt} failed, retrying..."
            sleep 5
          done
        env:
          CI: 'true'
          # Script spawns vite on 5174 with mock hub route; no real Hub required.

      - name: Capture web visual:qa:chat
        timeout-minutes: 15
        working-directory: ./app/web
        run: |
          # Flake retry (#1949): browser capture can fail transiently on CI runners.
          for attempt in 1 2; do
            echo "::group::visual:qa:chat attempt ${attempt}"
            if pnpm visual:qa:chat; then
              echo "::endgroup::"
              break
            fi
            echo "::endgroup::"
            if [ "$attempt" = "2" ]; then
              echo "::error::visual:qa:chat failed after 2 attempts"
              exit 1
            fi
            echo "::warning::visual:qa:chat attempt ${attempt} failed, retrying..."
            sleep 5
          done
        env:
          CI: 'true'
          # Script spawns vite on 5174 with a fully stubbed Hub session
          # (approved-real replay of a finished task); no real Hub required.

      - name: Assert non-blank shell screenshots
        working-directory: ./app/web
        run: pnpm assert:visual:qa:shell
        env:
          VISUAL_QA_SHELL_MIN_BYTES: '8000'

      - name: Assert chat screenshots (non-blank + geometry contract)
        working-directory: ./app/web
        run: node scripts/assert-visual-qa-chat.mjs
        env:
          VISUAL_QA_CHAT_MIN_BYTES: '8000'

      - name: Upload visual QA shell screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-visual-qa-shell-screenshots
          path: app/web/screenshots/visual-qa/
          if-no-files-found: warn
          retention-days: 7

  # ── Visual QA Desktop Shell (path-filtered) ─────
  # Desktop half of the gate evidence (#1287, #1827): same capture matrix
  # (1440x810 light+dark, non-blank assert, no pixel goldens) against the
  # desktop vite dev server with demo workbench entry — no real Hub required.
  visual-qa-desktop:
    name: Visual QA Desktop shell (path-filtered)
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
