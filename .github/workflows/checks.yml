          if-no-files-found: warn
          retention-days: 7

  # ── Web stubbed-hub E2E (path-filtered) ───────
  # real-chromium behavior lane against a fully stubbed Hub
  # (pnpm test:e2e:stubbed-hub): chat-flow contract, stubbed-hub replay
  # smoke, task approval/artifact contract. Mock hub only — this is NOT a
  # real login / real Hub run (evidence level: stubbed-hub, real_tested=false).
  # Path filter reuses the unified `changes` job `web` output.
  web-e2e-stubbed:
    name: Web stubbed-hub E2E (path-filtered)
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./app
    steps:
      - uses: actions/checkout@v7
        with:
          # This job runs pnpm install (repo-controlled lifecycle scripts)
          # and never needs Git auth after checkout; do not persist the job
          # token into Git config (artipacked hardening).
          persist-credentials: false

      - uses: ./.github/actions/setup-node-pnpm

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('app/pnpm-lock.yaml') }}
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run stubbed-hub E2E lane
        timeout-minutes: 15
        working-directory: ./app/web
        # Vite dev server + all Hub calls are stubbed via Playwright routes;
        # playwright.config.ts pins VITE_HUB_URL to hub.test.invalid so any
        # un-stubbed Hub call fails closed. No real Hub/Edge/login required.
        run: pnpm test:e2e:stubbed-hub -- --retries=1
        env:
          CI: 'true'

      - name: Upload Playwright failure artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-e2e-stubbed-hub-results
          path: app/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # ── Backend perf / leak gates ─────────────────
  # Behavior + short microbench only (not production capacity).
  backend-perf-leak-gates:
    name: Backend perf/leak gates
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            hub-server/go.sum
            edge-server/go.sum
      - name: Run backend perf/leak gates
        run: python ./scripts/verify/verify-backend-perf-leak-gates.py --Benchtime 100ms

  # ── E2E Smoke ─────────────────────────────────
  # 重 job；仅 workflow_dispatch 成本节流，需要时手动触发。
  e2e-smoke:
    name: E2E Smoke
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('app/pnpm-lock.yaml') }}
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
        working-directory: ./app
      - name: Smoke test
        # Only smoke.spec.ts runs in CI (static page checks against the web
        # dev server on 5174). chat-real.spec.ts requires live Hub (port 8080)
        # + Edge (port 3210) services which are not available in the CI
        # sandbox.
        # Run chat-real.spec.ts locally with all services up:
        #   pnpm --filter agenthub-web exec playwright test --config playwright.real.config.ts --project=chromium chat-real.spec.ts
        run: pnpm --filter agenthub-web exec playwright test --config playwright.config.ts --project=chromium smoke.spec.ts
        working-directory: ./app

  # ── Real E2E stack lane (L3, dispatch-only) ─────
  # 可重跑真栈 lane：起 PostgreSQL/Redis(docker compose)+TokenDance ID+
  # hub+edge+web 全栈后跑真实 OIDC 浏览器 spec（app/e2e/real-oidc-login.spec.ts，
  # playwright.real.config.ts），产出 tests/artifacts/manifest-<stamp>.json
  # （六字段 evidence 合同，verify-real-e2e-lane-manifest.py 自检）并上传证据。
  # L3 不进 PR merge 门禁；与 e2e-smoke 同为 dispatch-only。
  # ID 来源（workflow_dispatch 输入 id_env：source/image/local）：
  #   source —— 从 vars.OIDC_SOURCE_REPO 指定的 GitHub 仓库构建。
  #              克隆需要 secrets.OIDC_CLONE_TOKEN（contents:read）；
  #              缺失时 lane 记 blocked（real_tested=false）。
  #   image  —— 使用 vars.OIDC_IMAGE 指定的镜像。
  #   local  —— 假定 runner 本机 127.0.0.1:3000 已有 ID。
  #   所有模式都只使用 runner 本机 127.0.0.1:3000。
  real-e2e-stack:
    name: Real E2E stack (L3 lane, dispatch-only)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AGENTHUB_DB_HOST: 127.0.0.1
      AGENTHUB_DB_PORT: "5432"
      AGENTHUB_DB_USER: agenthub
      AGENTHUB_DB_NAME: agenthub
      AGENTHUB_DB_SSLMODE: disable
      # AGENTHUB_DB_PASSWORD 不落仓：由 creds step 运行期 openssl rand 生成，
      # 只在 compose / hub 两个 step 以 env 绑定（与 OIDC client 凭据同法）。
      AGENTHUB_REDIS_HOST: 127.0.0.1
      AGENTHUB_REDIS_PORT: "6379"
      AGENTHUB_SERVER_PORT: "8080"
      AGENTHUB_SERVER_ADMIN_PORT: "6060"
      # Local OIDC issuer for this CI session.
      AGENTHUB_TOKENDANCE_ID_ISSUER_URL: http://127.0.0.1:3000
      AGENTHUB_TOKENDANCE_ID_REDIRECT_URI: http://127.0.0.1:8080/client/auth/oidc/callback
      # workbench 回调走 /workbench 前缀；CI 会话需要两版变体（无 base 变体供 H5 兼容）。
      AGENTHUB_TOKENDANCE_ID_ALLOWED_REDIRECT_URIS: http://127.0.0.1:8080/client/auth/oidc/callback,http://127.0.0.1:5174/auth/tokendance/callback,http://localhost:5174/auth/tokendance/callback,http://127.0.0.1:5174/workbench/auth/tokendance/callback,http://localhost:5174/workbench/auth/tokendance/callback
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            edge-server/go.sum
            hub-server/go.sum

      - uses: ./.github/actions/setup-node-pnpm

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('app/pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
        working-directory: ./app

      - name: Install lane prereqs (sqlite3, bcrypt)
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y sqlite3 openssl python3-bcrypt
          # 不用 pip 装系统 python（PEP 668 externally-managed）；provision 的
          # python3 -c 'import bcrypt' 走系统解释器，apt 包即满足。

      - name: Generate run-time credentials (OIDC client, hub JWT, DB password; never committed)
        id: creds
        shell: bash
        run: |
          cid="c_$(openssl rand -hex 12)"
          csec="cs_$(openssl rand -hex 24)"
          jwt="$(openssl rand -hex 24)"
          dbpw="$(openssl rand -hex 18)"
          # step outputs 不进 masking 系统：先 add-mask 再写 GITHUB_OUTPUT，
          # 避免后续步骤/失败回显把明文凭据打进公开 run log。
          for v in "$csec" "$jwt" "$dbpw"; do echo "::add-mask::$v"; done
          {
            echo "cid=$cid"
            echo "csec=$csec"
            echo "jwt=$jwt"
            echo "dbpw=$dbpw"
          } >> "$GITHUB_OUTPUT"

      - name: Start PostgreSQL + Redis (compose)
        env:
          AGENTHUB_DB_PASSWORD: ${{ steps.creds.outputs.dbpw }}
        run: docker compose up -d postgres redis

      # OIDC_SOURCE_REPO / OIDC_IMAGE are maintainer-managed repository
      # variables. Variable-write access is part of the trust boundary: the lane
      # builds and runs whatever these point at, with the runner credentials.
      - name: Start TokenDance ID (source checkout)
        if: inputs.id_env == 'source'
        shell: bash
        env:
          ID_REPO_TOKEN: ${{ secrets.OIDC_CLONE_TOKEN }}
          ID_SOURCE_REPO: ${{ vars.OIDC_SOURCE_REPO }}
        run: |
          if [ -z "$ID_REPO_TOKEN" ] || [ -z "$ID_SOURCE_REPO" ]; then
            echo "::warning::TokenDance ID source credentials/configuration unset — real ID unavailable;"
            echo "::warning::the lane step will record an honest blocked manifest (real_tested=false)."
            exit 0
          fi
          if ! printf '%s' "$ID_SOURCE_REPO" | grep -Eq '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'; then
            echo "::error::OIDC_SOURCE_REPO must be a plain owner/repo name"
            exit 1
          fi
          sudo mkdir -p /var/lib/oidc-provider
          # 目录须归 runner 用户：ID 二进制以非特权 runner 运行并要在此创建
          # tokendance.db（lane/provision 的 AGENTHUB_E2E_ID_DB 同路径读写）。
          sudo chown "$(id -u):$(id -g)" /var/lib/oidc-provider
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$ID_REPO_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="$AUTH_HEADER" clone --quiet --depth 1             "https://github.com/${ID_SOURCE_REPO}.git" /tmp/oidc-provider
          (cd /tmp/oidc-provider && go build -o /tmp/oidc-provider-bin ./cmd/tokendance-id)
          cp /tmp/oidc-provider/configs/config.example.yaml /tmp/oidc-provider/configs/config.yaml
          openssl genrsa -out /tmp/id-private.pem 2048 >/dev/null 2>&1
          openssl rsa -in /tmp/id-private.pem -pubout -out /tmp/id-public.pem >/dev/null 2>&1
          (cd /tmp/oidc-provider && nohup env \
            -u ID_REPO_TOKEN -u ID_SOURCE_REPO \
            TOKENDANCE_SERVER_ADDR=:3000 \
            TOKENDANCE_DATABASE_DSN=/var/lib/oidc-provider/tokendance.db \
            TOKENDANCE_JWT_ISSUER=http://127.0.0.1:3000 \
            TOKENDANCE_JWT_PRIVATE_KEY_PATH=/tmp/id-private.pem \
            TOKENDANCE_JWT_PUBLIC_KEY_PATH=/tmp/id-public.pem \
            TOKENDANCE_JWT_ACCESS_TTL=15m \
            TOKENDANCE_JWT_REFRESH_TTL=24h \
            TOKENDANCE_SECURITY_COOKIE_SECURE=false \
            TOKENDANCE_SECURITY_COOKIE_DOMAIN=127.0.0.1 \
            TOKENDANCE_SESSION_TTL=24h \
            TOKENDANCE_FEATURES_REQUIRE_INVITE=false \
            TOKENDANCE_REDIS_ADDR=127.0.0.1:6379 \
            /tmp/oidc-provider-bin > /tmp/id.log 2>&1 &)
          for i in $(seq 1 60); do
            curl -sf -m 3 http://127.0.0.1:3000/health >/dev/null 2>&1 && break
            sleep 2
          done
          curl -sf -m 3 http://127.0.0.1:3000/health >/dev/null || { echo "TokenDance ID did not become healthy"; tail -50 /tmp/id.log; exit 1; }

      - name: Start TokenDance ID (image, pre-registered)
        if: inputs.id_env == 'image'
        shell: bash
        env:
          ID_IMAGE: ${{ vars.OIDC_IMAGE }}
        run: |
          if [ -z "$ID_IMAGE" ]; then
            echo "::warning::vars.OIDC_IMAGE unset — image lane unavailable."
            exit 0
          fi
          if ! printf '%s' "$ID_IMAGE" | grep -Eq '^[a-z0-9][a-z0-9._/-]*(:[A-Za-z0-9._-]+)?(@sha256:[a-f0-9]{64})?$'; then
            echo "::error::OIDC_IMAGE must be a plain image reference"
            exit 1
          fi
          sudo mkdir -p /var/lib/oidc-provider
          # 挂载目录归 runner 用户；容器以 --user 同属主运行，库文件归 runner，
          # lane/provision 的 sqlite 读写不受 root 属主影响。
          sudo chown "$(id -u):$(id -g)" /var/lib/oidc-provider
          docker run -d --user "$(id -u):$(id -g)" --name td-id -p 127.0.0.1:3000:3000 \
            -e TOKENDANCE_SERVER_ADDR=:3000 \
            -e TOKENDANCE_DATABASE_DSN=/app/data/tokendance.db \
            -e TOKENDANCE_JWT_ISSUER=http://127.0.0.1:3000 \
            -e TOKENDANCE_SECURITY_COOKIE_SECURE=false \
            -e TOKENDANCE_SECURITY_COOKIE_DOMAIN=127.0.0.1 \
            -e TOKENDANCE_SESSION_TTL=24h \
            -e TOKENDANCE_FEATURES_REQUIRE_INVITE=false \
            -v /var/lib/oidc-provider:/app/data \
            "$ID_IMAGE"
          for i in $(seq 1 60); do
            curl -sf -m 3 http://127.0.0.1:3000/health >/dev/null 2>&1 && break
            sleep 2
          done
          curl -sf -m 3 http://127.0.0.1:3000/health >/dev/null || { echo "TokenDance ID image did not become healthy"; exit 1; }

      - name: Preflight local TokenDance ID (loopback only)
        if: inputs.id_env == 'local'
        shell: bash
        run: echo "::info::id_env=local; lane preflight will probe http://127.0.0.1:3000"

      - name: Build and start Hub Server
        shell: bash
        env:
          AGENTHUB_DB_PASSWORD: ${{ steps.creds.outputs.dbpw }}
          AGENTHUB_JWT_SECRET: ${{ steps.creds.outputs.jwt }}
          AGENTHUB_TOKENDANCE_ID_CLIENT_ID: ${{ steps.creds.outputs.cid }}
          AGENTHUB_TOKENDANCE_ID_CLIENT_SECRET: ${{ steps.creds.outputs.csec }}
        run: |
          mkdir -p uploads
          nohup go run ./hub-server/cmd/server-hub > /tmp/hub.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -m 3 http://127.0.0.1:8080/health >/dev/null 2>&1 && break
            sleep 2
          done
          curl -sf -m 3 http://127.0.0.1:8080/health >/dev/null || { echo "hub did not become healthy"; tail -50 /tmp/hub.log; exit 1; }

      - name: Start Edge Server
        shell: bash
        run: |
          nohup go run ./edge-server/cmd/agenthub-edge > /tmp/edge.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf -m 3 http://127.0.0.1:3210/v1/health >/dev/null 2>&1 && break
            sleep 2
          done
          curl -sf -m 3 http://127.0.0.1:3210/v1/health >/dev/null || { echo "edge did not become healthy"; tail -50 /tmp/edge.log; exit 1; }

      - name: Start Web dev server
        shell: bash
        run: |
          cd app
          nohup pnpm --filter agenthub-web dev --host 127.0.0.1 --port 5174 > /tmp/web.log 2>&1 &
          for i in $(seq 1 45); do
            curl -sf -m 3 -o /dev/null http://127.0.0.1:5174/workbench/ && break
            sleep 2
          done
          curl -sf -m 3 -o /dev/null http://127.0.0.1:5174/workbench/ || { echo "web did not become healthy"; tail -50 /tmp/web.log; exit 1; }

      - name: Run real-e2e lane (workbench callback spec + evidence manifest)
        id: real_lane
        if: always()
        shell: bash
        env:
          # Same local issuer as above.
          AGENTHUB_E2E_ID_BASE_URL: http://127.0.0.1:3000
          AGENTHUB_E2E_HUB_BASE_URL: http://127.0.0.1:8080
          AGENTHUB_E2E_EDGE_BASE_URL: http://127.0.0.1:3210
          AGENTHUB_E2E_WEB_BASE_URL: http://127.0.0.1:5174
          # 与 hub 启动步骤同一对运行期凭据；provision 脚本以此 seed ID 的 OAuth client。
          AGENTHUB_E2E_ID_CLIENT_ID: ${{ steps.creds.outputs.cid }}
          AGENTHUB_E2E_ID_CLIENT_SECRET: ${{ steps.creds.outputs.csec }}
          # ID 容器/二进制跑在 runner 本机，使用 provision 脚本默认 sqlite 路径。
          AGENTHUB_E2E_ID_DB: /var/lib/oidc-provider/tokendance.db
          # chat-real.spec.ts 的 mintTestJWT 需要正在运行的 Hub 签名密钥；
          # 该值在 creds 步骤已 ::add-mask::，跨步骤不会自动继承。
          AGENTHUB_JWT_SECRET: ${{ steps.creds.outputs.jwt }}
        run: bash scripts/e2e/run-real-e2e-lane.sh

      - name: Sanitize raw L3 artifacts (fail-closed content scan)
        id: sanitize
        if: always()
        shell: bash
        run: |
          # 上传前做内容扫描。manifest 按合同只含 provenance，单独扫描后
          # 始终可上传；raw report/html/trace 常含 OIDC code/JWT/cookie，
          # 只有整目录扫描通过时才上传。
          if python3 scripts/verify/verify-real-e2e-artifacts.py tests/artifacts; then
            echo "raw_public_safe=true" >> "$GITHUB_OUTPUT"
          else
            echo "raw_public_safe=false" >> "$GITHUB_OUTPUT"
          fi
          manifest_dir="$(mktemp -d)"
          cp tests/artifacts/manifest-*.json "$manifest_dir"/ 2>/dev/null || true
          if python3 scripts/verify/verify-real-e2e-artifacts.py "$manifest_dir"; then
            echo "manifest_safe=true" >> "$GITHUB_OUTPUT"
          else
            echo "manifest_safe=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload sanitized L3 evidence (manifest provenance)
        if: always() && steps.real_lane.outcome == 'success' && steps.sanitize.outputs.manifest_safe == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: real-e2e-stack-evidence
          # 上传契约（见 tests/artifacts/README.md）：public artifact 只上传
          # sanitized manifest（commit/evidence_level/real_tested/scope provenance，
          # 不含敏感运行数据）。real-e2e-account.env（凭据）永不上传。
          path: |
            tests/artifacts/manifest-*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload raw L3 evidence (only when content scan passes)
        if: always() && steps.sanitize.outputs.raw_public_safe == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: real-e2e-stack-raw-evidence
          path: |
            tests/artifacts/report-*.json
            tests/artifacts/html-*/**
          if-no-files-found: warn
          retention-days: 14
  # ── Validation ───────────────────────────────
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check whitespace
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^..HEAD
          else
            git diff --check
          fi

      - name: Check workflows with actionlint
        # Community-standard GitHub Actions workflow linter (rhysd/actionlint):
        # catches workflow syntax errors and broken expressions on each push.
        # shellcheck integration is disabled because it is not installed here.
        # Version pinned to the release asset (no curl|bash) for supply-chain hygiene.
        shell: bash
        run: |
          curl -sSL -o actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color -shellcheck=

      - name: Verify commit messages (PR only)
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: origin/${{ github.base_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/verify/verify-commit-messages.sh "$BASE_REF" "$PR_HEAD_SHA"

      - name: Lint Python gates (ruff)
        run: |
          python -m pip install --quiet ruff==0.17.1
          python -m ruff check .

      - name: Install gitleaks
        # Secret-scanning engine for the guard below. Pinned release asset, no
        # curl|bash, same supply-chain shape as the actionlint install above.
        shell: bash
        run: |
          curl -sSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          echo "GITLEAKS_BIN=$PWD/gitleaks" >>"$GITHUB_ENV"

      - name: Secret guard
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/verify/check-secrets.sh --ci

      - name: Verify docs (links, entry points, budgets)
        run: python scripts/verify/verify-doc-ssot.py

      - name: Validate OpenAPI YAML
        run: |
          python -m pip install --quiet PyYAML
          python -c "import pathlib, yaml; yaml.safe_load(pathlib.Path('api/openapi.yaml').read_text(encoding='utf-8')); print('yaml ok')"

      - name: Verify OpenAPI contract
        run: python scripts/verify/verify-openapi-contract.py

      - name: Verify shared REST contract
        run: |
          python scripts/verify/verify-shared-rest-contract.py

      - name: Verify privacy and evidence contracts
        run: |
          python scripts/verify/verify-devserver-contract.py
          python scripts/verify/verify-real-e2e-contract.py --self-test
          python scripts/verify/verify-real-e2e-contract.py
          python scripts/verify/verify-outbound-client-hygiene.py
          python scripts/verify/verify-oidc-code-ssot.py

      - name: Self-test security gates
        shell: bash
        run: |
          bash scripts/verify/tests/test_verify_vulnerability_gates.sh
          bash scripts/verify/tests/test_verify_gosec_gates.sh
          bash scripts/verify/tests/test_check_secrets.sh

      - name: Self-test repository contract gates
        shell: bash
        run: |
          python scripts/verify/verify-doc-ssot.py --self-test
          python scripts/verify/verify-ci-invariants.py --self-test
          python scripts/verify/verify-ci-invariants.py
          python scripts/verify/tests/test_verify_release_gate.py
          bash scripts/verify/tests/test_verify_commit_messages.sh
          python scripts/verify/tests/test_verify_openapi_contract.py
          python scripts/verify/tests/test_verify_shared_rest_contract.py
          python scripts/verify/tests/test_verify_oidc_code_ssot.py
          python scripts/verify/tests/test_verify_outbound_client_hygiene.py
          python scripts/verify/tests/test_verify_real_e2e_artifacts.py
          python scripts/verify/tests/test_verify_real_e2e_lane_manifest.py
          python scripts/verify/tests/test_merge_coverprofiles.py

  # ── 前端 L0 稳定 required 聚合（对偶 backend-required / windows-go 恒报模式） ─
  # AGENTS「测试分层」L0：前端 vitest lanes（frontend-desktop / frontend-web /
  # frontend-mobile-light）是 PR merge 门禁。本 job 恒报：路径未选中 →
  # success no-op；changes 失败 → fail-closed；任一选中 lane 非 success → fail。
  frontend-required:
    name: frontend-required
    needs: [changes, frontend-desktop, frontend-web, frontend-mobile-light]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Assert frontend L0 lanes
        env:
          CHANGES_STATUS: ${{ needs.changes.result }}
          EVENT_NAME: ${{ github.event_name }}
          DESKTOP_FILTER: ${{ needs.changes.outputs.desktop }}
          DESKTOP_RESULT: ${{ needs.frontend-desktop.result }}
          WEB_FILTER: ${{ needs.changes.outputs.web }}
          WEB_RESULT: ${{ needs.frontend-web.result }}
          MOBILE_FILTER: ${{ needs.changes.outputs.mobile }}
          MOBILE_RESULT: ${{ needs.frontend-mobile-light.result }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            DESKTOP_FILTER=true
            WEB_FILTER=true
            MOBILE_FILTER=true
          elif [ "$CHANGES_STATUS" != "success" ]; then
            echo "::error::changes job result: $CHANGES_STATUS; cannot decide frontend gates"
            exit 1
          fi
          assert_lane() {
            label="$1"; filter="$2"; result="$3"
            if [ "$filter" = "true" ]; then
              if [ "$result" != "success" ]; then
                echo "::error::${label} result: ${result}"
                exit 1
              fi
            elif [ "$result" != "skipped" ] && [ "$result" != "success" ]; then
              echo "::error::${label} ran without path-filter selection; result: ${result}"
              exit 1
            fi
          }
          assert_lane "frontend-desktop" "$DESKTOP_FILTER" "$DESKTOP_RESULT"
          assert_lane "frontend-web" "$WEB_FILTER" "$WEB_RESULT"
          assert_lane "frontend-mobile-light" "$MOBILE_FILTER" "$MOBILE_RESULT"
          echo "frontend L0 aggregate ok"

  # ── CSS gate (fail-closed, #1720) ─
  # pnpm lint:css 覆盖常规规则（硬编码色值、重复 selector/属性、空 block）；
  # 核心 token/theme/preset CSS 被 .stylelintignore 排除在常规规则外，改用
  # stylelint.syntax.json（rules: {}）只做 parser 语法检查，避免 `*/` 之类的
  # 语法错误假绿。该 job 按路径运行，不是 required check，合并语义见
  # docs/architecture/github-actions-ci-cd-policy.md。
  design-css:
    name: CSS lint and syntax (fail-closed)
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.design_css == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-pnpm

      - name: Verify design CSS syntax
        run: pnpm test:css-syntax

      - name: Lint CSS rules
        run: pnpm lint:css

  # ── Vuln Scan: JS (pnpm audit --prod) ─────────
  vuln-scan-js:
    name: Vuln scan (pnpm audit prod+full)
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-pnpm

      - name: pnpm audit --prod (fail-closed)
        shell: bash
        run: |
          # 注意：GHA 默认 shell（bash -e {0}）不带 -o pipefail。这里不使用管道：
          # 先落盘再喂给 verifier，verifier 退出码是唯一判定；pnpm 自身失败
          # （网络/错误 JSON/空输出）仍被 verifier 按 fail-closed 拒绝。
          pnpm audit --prod --json 2>&1 > /tmp/pnpm-audit.json || true
          bash ../scripts/verify/verify-vulnerability-gates.sh pnpm-audit prod < /tmp/pnpm-audit.json

      - name: pnpm audit full — dev chain too (fail-closed)
        shell: bash
        run: |
          # --prod 只覆盖随产物发布的依赖，dev/lint/build 链的通告对它完全不可见：
          # brace-expansion 的两枚 high（GHSA-mh99-v99m-4gvg / GHSA-rgw5-rvv9-x895，
          # 路径 .>eslint-plugin-import>minimatch>brace-expansion）就曾在 --prod 门禁
          # 全绿的情况下把漏洞版 1.1.16 钉在 lockfile 里，直到 #2224 才修掉。
          # 全量审计复用同一份 vulnerability-exceptions.json 例外机制（判据不变：
          # 仅上游无修复版本者可登记，且必须挂 tracking issue，当前登记见 #2360）。
          # 有修复版本的漏洞必须通过 pnpm overrides 升级解决（例如 image-size
          # 已由 overrides 钉到修复版本），不能登记为例外。
          pnpm audit --json 2>&1 > /tmp/pnpm-audit-full.json || true
          bash ../scripts/verify/verify-vulnerability-gates.sh pnpm-audit full < /tmp/pnpm-audit-full.json


  # ── Vuln Scan: Go (govulncheck) ───────────────
  vuln-scan-go:
    name: Vuln scan (govulncheck)
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [hub-server, edge-server]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: govulncheck (fail-closed)
        shell: bash
        run: bash ../scripts/verify/run-govulncheck.sh | bash ../scripts/verify/verify-vulnerability-gates.sh govulncheck

  # ── Vuln Scan: Rust (cargo audit, #1578) ───────
  vuln-scan-rust:
    name: Vuln scan (cargo audit)
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # `components: clippy` matters: the pinned toolchain ships without it, so
      # the old advisory clippy step was failing on "cargo-clippy is not
      # installed" and `continue-on-error` swallowed it — clippy never ran.
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy

      # Same cargo cache the desktop build job uses: without it every
      # desktop-changed PR recompiles the whole dependency tree twice.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/desktop/src-tauri -> target

      - name: Install Tauri Linux system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf

      # One compile pass, two properties. `cargo clippy` runs the same
      # type-check as `cargo check`, so it is the blocking compile gate: it
      # exits non-zero on compile errors. Lint warnings stay advisory because
      # no `-D warnings` is configured (24 not yet zero-baselined); promote
      # that flag once the lint debt is repaid.
      - name: cargo clippy (compile gate, lint advisory)
        working-directory: app/desktop/src-tauri
        run: cargo clippy --all-targets

      # CI: cargo-audit install sped up via cargo-binstall (prebuilt binary,
      # ~10s) instead of `cargo install cargo-audit --locked` which compiles
      # ~200 crates (2-4 min) on every desktop-changed run. cargo-binstall
      # is bootstrapped with its official installer script — no GitHub Action
      # step is introduced, so the action-runtime allow-list is unaffected.
      # Installer script and binary are pinned to a release tag; the mutable
      # main-branch script is never executed.
      - name: Install cargo-audit (prebuilt, via cargo-binstall)
        env:
          BINSTALL_VERSION: v1.26.0
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf \
            "https://raw.githubusercontent.com/cargo-bins/cargo-binstall/${BINSTALL_VERSION}/install-from-binstall-release.sh" | bash
          cargo binstall cargo-audit --no-confirm --locked

      - name: Rust advisory gate (fail-closed)
        shell: bash
        run: bash scripts/verify/verify-rust-advisories.sh

      - name: Rust advisory gate self-test
        shell: bash
        run: bash scripts/verify/tests/test_verify_rust_advisories.sh
