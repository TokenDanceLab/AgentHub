name: checks

# S1 (2026-07-15): Actions 成本节流 — 产品生产 LIVE，日常 CI 保持轻量。
# 对齐 docs/architecture/github-actions-ci-cd-policy.md
# - 仅 master PR/push；去掉 dev/** 全量矩阵
# - concurrency 取消连推
# - Windows 保留原生 Go/前端合同矩阵；完整 Tauri 打包仍在 release-readiness
# - mobile / e2e / benchmark 仅 workflow_dispatch：重 job 不在每次 push 烧分钟；
#   需要时手动触发，不是产品停运。
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.5"
  GOLANGCI_LINT_VERSION: "v2.12.2"
  NODE_VERSION: "22"
  PNPM_VERSION: "10.32.1"

jobs:
  # ── Go: Edge Server ──────────────────────────
  # CI5 wave2 (#1689): test execution lives in go-edge-test (2-shard matrix,
  # each shard on its own 4-core runner). This job keeps lint / static
  # analysis / coverage gates in one place and merges the shard text
  # profiles with scripts/verify/merge-coverprofiles.py (repo-local).
  go-edge:
    needs: [changes, go-edge-test]
    # Required check: always report a result so a path-filtered skip cannot
    # block branch protection. Real gates below run only for Go changes.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge-server
    steps:
      - if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true'
        uses: actions/checkout@v7

      - if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true'
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: edge-server/go.sum

      - name: Lint
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true'
        # Wave 10: advisory — gocognit findings in pre-existing complex functions
        continue-on-error: true
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: edge-server
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=5m

      - name: Download shard coverage data
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true'
        uses: actions/download-artifact@v7
        with:
          pattern: go-edge-coverage-shard-*
          path: edge-server/cov-shards

      - name: Merge shard coverage (coverprofile text)
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true'
        run: |
          python ../scripts/verify/merge-coverprofiles.py \
            cov-shards/go-edge-coverage-shard-1/shard-1.out \
            cov-shards/go-edge-coverage-shard-2/shard-2.out \
            -o coverage.out

      - name: Coverage check (informational)
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true'
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Overall coverage: ${COVERAGE}%"
          echo "::notice::edge-server overall coverage: ${COVERAGE}%"

      - name: Coverage per-package minimums
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true'
        run: |
          echo "=== Per-package coverage minimums ==="
          check_pkg() {
            local pattern="$1"
            local min="$2"
            local label="$3"
            local cov
            cov=$(go tool cover -func=coverage.out | grep "$pattern" | awk '{sum+=$NF; n++} END {if(n>0) printf "%.1f", sum/n; else print "0"}')
            echo "  ${label}: ${cov}% (min: ${min}%)"
            if (( $(echo "$cov < $min" | bc -l) )); then
              echo "::error::${label} coverage ${cov}% below ${min}% minimum"
              return 1
            fi
          }
          FAILED=0
          check_pkg "edge-server/internal/security/" 70 "security" || FAILED=1
          check_pkg "edge-server/internal/lifecycle/" 60 "lifecycle" || FAILED=1
          check_pkg "edge-server/internal/adapters/" 55 "adapters" || FAILED=1
          exit $FAILED

      # CI7: staticcheck hard-blocking — edge-server findings zero-baselined;
      # version pinned to prevent new-check drift from breaking CI.
      # Binary cached across runs (gha cache keyed on pinned versions).
      # Restore must precede both gosec and staticcheck steps.
      - name: Cache static-analysis binaries (staticcheck + gosec)
        id: sa-cache
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true'
        uses: actions/cache@v5
        with:
          path: |
            ~/go/bin/staticcheck
            ~/go/bin/gosec
          key: sa-tools-2026-08

      - name: Security scan (gosec)
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true'
        # #1574: hard fail (findings zero-baselined). Fail-closed wrapper
        # verify-gosec-gates.sh rejects empty/unparseable output (no false green).
        run: |
          if [ ! -x ~/go/bin/gosec ]; then
            go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
          fi
          ~/go/bin/gosec -fmt=json ./... 2>/dev/null | bash ../scripts/verify/verify-gosec-gates.sh
      - name: Vet
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true'
        run: go vet ./...

      - name: staticcheck
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true'
        run: |
          if [ ! -x ~/go/bin/staticcheck ]; then
            go install honnef.co/go/tools/cmd/staticcheck@2026.1
          fi
          staticcheck ./... 2>&1

      # #1566: orchestrator 依赖方向门禁（A-V1 Step 2）。叶子包
      # internal/adapters/orchestrator 不得 import 根实现包；
      # internal/orchestration 不得 import 任何 adapters。此前该脚本只在
      # 本地跑、CI 未接线——治理声明与执行不一致，现接进 go-edge（已 setup-go）。
      - name: Verify orchestrator dependency direction (#1566)
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true'
        working-directory: .
        run: python scripts/verify/verify-orchestrator-deps.py

      - name: Self-test orchestrator dependency direction gate
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true'
        working-directory: .
        run: python scripts/verify/tests/verify-orchestrator-deps.Tests.py

      # Fallback: keep the required check reported even when the Go path
      # filter deselects this job (skipped jobs never satisfy branch
      # protection and permanently block frontend-only PRs).
      # The job default cwd (edge-server) does not exist when checkout was
      # deselected; anchor the fallback at the repo root.
      - name: Report no-Go-changes skip (required check)
        if: ${{ !cancelled() && github.event_name != 'workflow_dispatch' && needs.changes.result == 'success' && needs.changes.outputs.go != 'true' }}
        working-directory: .
        run: |
          echo "skipped: no Go changes; reporting success for required check go-edge"
          exit 0

      # Fail-closed: when the path filter itself fails, the Go verdict is
      # unknown. Report failure instead of letting the skip fallback mask
      # the skipped real gates as green.
      - name: Fail when Go path filter failed
        if: ${{ !cancelled() && github.event_name != 'workflow_dispatch' && needs.changes.result != 'success' }}
        working-directory: .
        run: |
          echo "::error::changes job result: ${{ needs.changes.result }}; cannot decide Go gates for go-edge"
          exit 1

  # ── Go: Edge Server tests (shard×2) ──────────
  # CI5 wave2 (#1689): the single-pass `go test ./... -race -coverprofile`
  # (~116s wall) is split into a 2-shard matrix; each shard gets its own
  # 4-core runner. Go has no native -shard flag, so packages from
  # `go list ./...` are split round-robin (NR%2) — balanced and disjoint.
  # Each shard writes a text -coverprofile; the go-edge job merges them
  # with scripts/verify/merge-coverprofiles.py (repo-local, no third-party
  # tool). -coverpkg=./... keeps the full package set in every shard
  # profile so the merged totals match a single pass.
  go-edge-test:
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge-server
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: edge-server/go.sum

      - name: Test (unit only + race, shard ${{ matrix.shard }}/2)
        timeout-minutes: 15
        run: |
          PKG_LIST=$(go list ./...)
          SHARD_PKGS=$(echo "$PKG_LIST" | awk -v s=${{ matrix.shard }} 'NR % 2 == s - 1 {printf "%s ", $1}')
          if [ -z "$SHARD_PKGS" ]; then
            echo "::error::shard ${{ matrix.shard }} received 0 packages"
            exit 1
          fi
          go test $SHARD_PKGS -count=1 -short -race -coverpkg=./... \
            -coverprofile=shard-${{ matrix.shard }}.out -covermode=atomic -timeout=15m

      - name: Upload shard coverage data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: go-edge-coverage-shard-${{ matrix.shard }}
          path: edge-server/shard-${{ matrix.shard }}.out
          retention-days: 1

  # ── Go: Hub Server ──────────────────────────
  go-hub:
    needs: [changes, go-hub-test]
    # Required check: always report a result so a path-filtered skip cannot
    # block branch protection. Real gates below run only for Go changes.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub-server
    steps:
      - if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true'
        uses: actions/checkout@v7

      - if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true'
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: hub-server/go.sum

      - name: Lint
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true'
        # #1812: hard fail — the 17 baseline-registered complexity findings
        # are repaid and hub-lint-baseline.json is empty, so a full-repo lint
        # failure is a real regression. The fingerprint ratchet step below
        # still shares the same JSON report as the second line of defence.
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: hub-server
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=5m --output.json.path=${{ runner.temp }}/hub-lint-report.json

      # #1573: finding fingerprint ratchet — any finding NOT in the baseline
      # (new linter, new rule, escalated severity, replacement with same count)
      # hard-fails this job. The baseline is empty after the #1812 debt
      # repay, so every finding is a regression: it fails here as well as in
      # the Lint step above.
      # Reads the same JSON report the Lint step just produced (single source,
      # no version drift; gofmt is excluded as toolchain-drift-prone).
      - name: Verify Hub lint fingerprint ratchet (#1573)
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true'
        working-directory: .
        run: python ./scripts/verify/verify-hub-lint-ratchet.py --LintJsonPath "${{ runner.temp }}/hub-lint-report.json"

      - name: Self-test Hub lint fingerprint ratchet
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true'
        working-directory: .
        run: python ./scripts/verify/tests/verify-hub-lint-ratchet.Tests.py

      # CI5 wave2 (#1689): test execution lives in go-hub-test (2-shard
      # matrix). This job merges the shard text profiles with
      # scripts/verify/merge-coverprofiles.py and keeps the overall >=40%
      # gate hard-blocking.
      - name: Download shard coverage data
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true'
        uses: actions/download-artifact@v7
        with:
          pattern: go-hub-coverage-shard-*
          path: hub-server/cov-shards

      - name: Merge shard coverage (coverprofile text)
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true'
        run: |
          python ../scripts/verify/merge-coverprofiles.py \
            cov-shards/go-hub-coverage-shard-1/shard-1.out \
            cov-shards/go-hub-coverage-shard-2/shard-2.out \
            -o coverage.out

      - name: Coverage check (overall >= 40%)
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true'
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          THRESHOLD=40
          echo "Overall coverage: ${COVERAGE}% (threshold: ${THRESHOLD}%)"
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "::error::Coverage ${COVERAGE}% below ${THRESHOLD}% threshold"
            exit 1
          fi

      # CI7: staticcheck hard-blocking — hub-server findings zero-baselined;
      # version pinned to prevent new-check drift from breaking CI.
      # Binary cached across runs (gha cache keyed on pinned versions).
      # Restore must precede both gosec and staticcheck steps.
      - name: Cache static-analysis binaries (staticcheck + gosec)
        id: sa-cache
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true'
        uses: actions/cache@v5
        with:
          path: |
            ~/go/bin/staticcheck
            ~/go/bin/gosec
          key: sa-tools-2026-08

      - name: Security scan (gosec)
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true'
        # #1574: hard fail (findings zero-baselined), matching go-edge.
        run: |
          if [ ! -x ~/go/bin/gosec ]; then
            go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
          fi
          ~/go/bin/gosec -fmt=json ./... 2>/dev/null | bash ../scripts/verify/verify-gosec-gates.sh

      - name: Vet
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true'
        run: go vet ./...

      - name: staticcheck
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true'
        run: |
          if [ ! -x ~/go/bin/staticcheck ]; then
            go install honnef.co/go/tools/cmd/staticcheck@2026.1
          fi
          staticcheck ./... 2>&1

      # Fallback: keep the required check reported even when the Go path
      # filter deselects this job (skipped jobs never satisfy branch
      # protection and permanently block frontend-only PRs).
      # The job default cwd (hub-server) does not exist when checkout was
      # deselected; anchor the fallback at the repo root.
      - name: Report no-Go-changes skip (required check)
        if: ${{ !cancelled() && github.event_name != 'workflow_dispatch' && needs.changes.result == 'success' && needs.changes.outputs.go != 'true' }}
        working-directory: .
        run: |
          echo "skipped: no Go changes; reporting success for required check go-hub"
          exit 0

      # Fail-closed: when the path filter itself fails, the Go verdict is
      # unknown. Report failure instead of letting the skip fallback mask
      # the skipped real gates as green.
      - name: Fail when Go path filter failed
        if: ${{ !cancelled() && github.event_name != 'workflow_dispatch' && needs.changes.result != 'success' }}
        working-directory: .
        run: |
          echo "::error::changes job result: ${{ needs.changes.result }}; cannot decide Go gates for go-hub"
          exit 1

  # ── Go: Hub Server tests (shard×2) ───────────
  # CI5 wave2 (#1689): same 2-shard package split as go-edge-test
  # (Go has no native -shard flag; round-robin on `go list ./...`).
  # The non-zero PASS guard runs per shard, so a package-wide -short
  # escape hatch still trips a hard error.
  go-hub-test:
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub-server
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: hub-server/go.sum

      - name: Test (unit only + race, shard ${{ matrix.shard }}/2)
        timeout-minutes: 15
        run: |
          PKG_LIST=$(go list ./...)
          SHARD_PKGS=$(echo "$PKG_LIST" | awk -v s=${{ matrix.shard }} 'NR % 2 == s - 1 {printf "%s ", $1}')
          if [ -z "$SHARD_PKGS" ]; then
            echo "::error::shard ${{ matrix.shard }} received 0 packages"
            exit 1
          fi
          go test $SHARD_PKGS -count=1 -short -race -coverpkg=./... \
            -coverprofile=shard-${{ matrix.shard }}.out -covermode=atomic -v 2>&1 | tee unit-test-shard.log
          PASS_COUNT=$(grep -c "^--- PASS" unit-test-shard.log || true)
          echo "unit lane PASS count (shard ${{ matrix.shard }}/2): ${PASS_COUNT}"
          if [ "${PASS_COUNT}" -lt 1 ]; then
            echo "::error::unit lane shard executed 0 tests — hub-server/tests must not hide behind a package-wide -short exit"
            tail -50 unit-test-shard.log
            exit 1
          fi

      - name: Upload shard coverage data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: go-hub-coverage-shard-${{ matrix.shard }}
          path: hub-server/shard-${{ matrix.shard }}.out
          retention-days: 1

  # ── Go: Native Windows contract ───────────────
  # Ubuntu remains the fast, sharded Linux gate. This matrix runs the same
  # short backend suites on the native Windows runner so path handling,
  # process spawning, environment-key casing, and Windows-specific test
  # behavior cannot regress behind a Linux-only green build.
  windows-go-test:
    name: Native Windows Go (${{ matrix.module }})
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.go == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module: [edge-server, hub-server]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Run native Windows unit suite
        shell: pwsh
        run: go test ./... -short -count=1 -timeout 15m

  # ── Frontend: Native Windows contract ─────────
  # Linux owns the full frontend coverage and visual gates. Windows runs the
  # package unit/type/build contract in parallel for Desktop and Web, catching
  # path separators, filesystem casing, and Vite/Tauri platform drift without
  # paying for a second Playwright browser matrix on every PR.
  windows-frontend-test:
    name: Native Windows frontend (${{ matrix.package }})
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.frontend == 'true'
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        package: [agenthub-desktop, agenthub-web]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm --filter ${{ matrix.package }} typecheck

      - name: Unit tests
        run: pnpm --filter ${{ matrix.package }} test

      - name: Production build
        run: pnpm --filter ${{ matrix.package }} build

  # Stable required-check aggregators. GitHub exposes each matrix leg as a
  # separate check name; these two jobs keep branch protection independent of
  # matrix cardinality while treating an intentionally path-filtered suite as
  # a successful no-op.
  windows-go:
    name: windows-go
    needs: [changes, windows-go-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Assert Windows Go matrix result
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGE_RESULT: ${{ needs.changes.outputs.go }}
          MATRIX_RESULT: ${{ needs.windows-go-test.result }}
        run: |
          if [ "$EVENT_NAME" != "workflow_dispatch" ] && [ "$CHANGE_RESULT" != "true" ]; then
            echo "Windows Go contract not selected by path filter; treating as successful no-op."
            exit 0
          fi
          if [ "$MATRIX_RESULT" != "success" ]; then
            echo "::error::Windows Go contract result: $MATRIX_RESULT"
            exit 1
          fi

  windows-frontend:
    name: windows-frontend
    needs: [changes, windows-frontend-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Assert Windows frontend matrix result
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGE_RESULT: ${{ needs.changes.outputs.frontend }}
          MATRIX_RESULT: ${{ needs.windows-frontend-test.result }}
        run: |
          if [ "$EVENT_NAME" != "workflow_dispatch" ] && [ "$CHANGE_RESULT" != "true" ]; then
            echo "Windows frontend contract not selected by path filter; treating as successful no-op."
            exit 0
          fi
          if [ "$MATRIX_RESULT" != "success" ]; then
            echo "::error::Windows frontend contract result: $MATRIX_RESULT"
            exit 1
          fi

  # ── Backend E2E: Fixture-only ────────────────
  backend-e2e-fixture:
    name: Backend E2E (fixture-only)
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub-server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: hub-server/go.sum

      - name: TeamRun fixture E2E
        run: go test ./tests/teamrun -run '^TestTeamRunSmoke$' -count=1

      - name: P0 remote-control fixture readiness
        working-directory: .
        run: python ./scripts/verify/verify-p0-remote-control-fixture.py

  # ── Backend: Edge→Hub callback smoke (fixture-only) ──────────
  # edge-server/tests TestHubE2E_ series spins up a mock Hub + in-process
  # Edge ProcessExecutor and asserts ack/stream/done/fail direct-callback
  # delivery. It is guarded by testing.Short(), so the go-edge -short lane
  # skips it; this lane runs it explicitly with a non-zero PASS assertion
  # (same pattern as backend-integration) so a 0-test lane fails.
  backend-edge-e2e:
    name: Backend Edge E2E (fixture-only)
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge-server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: edge-server/go.sum

      - name: Edge→Hub callback smoke
        run: |
          go test ./tests/ -count=1 -run '^TestHubE2E_' -v -timeout 120s 2>&1 | tee edge-e2e.log
          PASS_COUNT=$(grep -c "^--- PASS" edge-e2e.log || true)
          echo "edge e2e lane PASS count: ${PASS_COUNT}"
          if [ "${PASS_COUNT}" -lt 1 ]; then
            echo "::error::edge e2e lane executed 0 tests — lane must prove non-zero execution"
            tail -50 edge-e2e.log
            exit 1
          fi

  # ── Backend: Integration (real PostgreSQL + Redis) ──────────
  # hub-server/tests/integration is `//go:build integration` (lane manifest):
  # the default -short lanes never compile it, so the suite can no longer
  # silently vanish via a package-wide TestMain escape hatch. This job
  # provisions PostgreSQL + Redis service containers and runs the lane with
  # `-tags integration`, asserting non-zero PASS count so a 0-test lane fails.
  # The -short jobs (go-edge / go-hub) cover unit tests and prove non-zero
  # execution the same way. (CI5: backend-focused-subset removed — its focused
  # package subset was fully redundant with the go-edge/go-hub full `go test
  # ./...` runs.)
  backend-integration:
    name: Backend integration (PostgreSQL + Redis)
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agenthub
          POSTGRES_PASSWORD: agenthub
          POSTGRES_DB: agenthub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agenthub -d agenthub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6
    env:
      # config.Load uses viper AutomaticEnv with AGENTHUB_ prefix; these wire
      # the test config at the service containers (host=127.0.0.1 on the
      # runner-host network for services with mapped ports).
      AGENTHUB_DB_HOST: 127.0.0.1
      AGENTHUB_DB_PORT: "5432"
      AGENTHUB_DB_USER: agenthub
      AGENTHUB_DB_PASSWORD: agenthub
      AGENTHUB_DB_NAME: agenthub
      AGENTHUB_DB_SSLMODE: disable
      AGENTHUB_REDIS_HOST: 127.0.0.1
      AGENTHUB_REDIS_PORT: "6379"
      AGENTHUB_JWT_SECRET: "ci-integration-jwt-secret-min-32-chars-ok!!"
      AGENTHUB_ENV: test
      # phase1_7 的 OIDC authorize 测试走真实 router，需要非空 OIDC 配置；
      # 占位值即可（GenerateAuthorizationURL 只组装 URL 不发起网络请求）。
      AGENTHUB_TOKENDANCE_ID_ISSUER_URL: "https://id.example.invalid"
      AGENTHUB_TOKENDANCE_ID_CLIENT_ID: "ci-integration-client"
      AGENTHUB_TOKENDANCE_ID_CLIENT_SECRET: "ci-integration-secret-not-a-real-secret"
      AGENTHUB_TOKENDANCE_ID_REDIRECT_URI: "http://127.0.0.1:8080/client/auth/oidc/callback"
      # migration_audit_test.go 需要 admin URL（superuser）来 CREATE/DROP 独立测试库。
      # agenthub:agenthub 是 CI PG 测试容器的 throwaway 凭据，127.0.0.1 是 runner loopback，非真实凭据。
      AGENTHUB_PG_MIGRATION_TEST_ADMIN_URL: "postgres://agenthub:agenthub@127.0.0.1:5432/agenthub?sslmode=disable"  # leak-guard-allow:LG-F4C6A155
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: hub-server/go.sum

      - name: Build hub-server
        working-directory: hub-server
        run: go build ./...

      - name: Integration tests (no -short; real PostgreSQL + Redis)
        working-directory: hub-server
        run: |
          go test -tags integration ./tests/integration/ -count=1 -timeout=20m -v 2>&1 | tee integration-test.log
          PASS_COUNT=$(grep -c "^--- PASS" integration-test.log || true)
          echo "integration lane PASS count: ${PASS_COUNT}"
          if [ "${PASS_COUNT}" -lt 1 ]; then
            echo "::error::integration lane executed 0 tests — lane must prove non-zero execution"
            tail -50 integration-test.log
            exit 1
          fi

      - name: Migration-up coverage (real PostgreSQL)
        working-directory: hub-server
        run: |
          go test ./internal/repository/ -run 'TestMigration0040' -count=1 -v -timeout=120s 2>&1 | tee migration-test.log
          PASS_COUNT=$(grep -c "^--- PASS" migration-test.log || true)
          echo "migration lane PASS count: ${PASS_COUNT}"
          if [ "${PASS_COUNT}" -lt 1 ]; then
            echo "::error::migration lane executed 0 tests — lane must prove non-zero execution"
            tail -50 migration-test.log
            exit 1
          fi

  # ── Docker: Hub Server ───────────────────────
  # cross-build removed (audit): matrix collapsed to ubuntu-latest only,
  # duplicating go-edge + go-hub build/test. Windows cross-build stays in
  # release / release-readiness. No gate asserted cross-build.
  # CI5: switched bare `docker build` to docker/build-push-action@v7 with a
  # GitHub Actions (type=gha) build cache — aligns with cd-hub-server.yml.
  # No push (PR/build-only smoke build); cache reuses layers across runs.
  docker:
    name: Docker build (Hub Server)
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image (cached)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: hub-server/deployments/Dockerfile
          push: false
          tags: agenthub-hub-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image
        run: docker images agenthub-hub-server

  # ── Benchmark Regression ─────────────────────
  # 仅手动：LIVE 产品的成本节流，避免每个 master push 烧分钟。
  benchmark:
    name: Benchmark regression check
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            edge-server/go.sum
            hub-server/go.sum

      - name: Run benchmarks
        run: |
          cd edge-server && go test -bench=. -benchtime=1s ./internal/events/ ./internal/adapters/
          cd ../hub-server && go test -bench=. -benchtime=1s ./internal/service/ ./internal/jwtutil/

  # ── Unified Path Filter ────────────────────────
  # P78: only run CI jobs when relevant paths change.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
      web: ${{ steps.filter.outputs.web }}
      shell: ${{ steps.filter.outputs.shell }}
      go: ${{ steps.filter.outputs.go }}
      mobile: ${{ steps.filter.outputs.mobile }}
      frontend: ${{ steps.filter.outputs.frontend }}
      design_css: ${{ steps.filter.outputs.design_css }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            desktop:
              - 'app/desktop/**'
              - 'app/shared/**'
              - 'app/workbench/**'
              - 'app/package.json'
              - 'app/pnpm-lock.yaml'
              - '.github/workflows/checks.yml'
            web:
              - 'app/web/**'
              - 'app/shared/**'
              - 'app/workbench/**'
              - 'app/package.json'
              - 'app/pnpm-lock.yaml'
              - '.github/workflows/checks.yml'
            shell:
              - 'app/workbench/**'
              - 'app/shared/src/styles/**'
              - 'app/shared/src/theme*.ts'
              - 'app/shared/src/themePresets.*'
              - 'app/shared/src/designTokens.*'
              - 'app/web/scripts/visual-qa*'
              - 'app/web/scripts/assert-visual-qa-shell.mjs'
              - 'app/desktop/scripts/visual-qa*'
              - 'app/web/src/**'
              - 'app/web/package.json'
              - 'app/desktop/package.json'
              - '.github/workflows/checks.yml'
            go:
              - 'hub-server/**'
              - 'edge-server/**'
              - 'pkg/**'
              - 'go.work*'
              - 'api/**'
              - 'scripts/verify/**'
              - '.github/workflows/checks.yml'
            mobile:
              - 'app/mobile-rn/**'
              - 'app/shared/src/hubClient*.ts'
              - 'app/shared/src/hubEvents*.ts'
              - 'app/package.json'
              - 'app/pnpm-lock.yaml'
              - '.github/workflows/checks.yml'
            # frontend = desktop ∪ web ∪ shared ∪ workbench (coverage gate +
            # vuln-scan-js trigger). Splits the heavy vitest coverage job out
            # of the unconditional validate lane so a Go-only PR no longer
            # pays for pnpm install + coverage.
            frontend:
              - 'app/desktop/**'
              - 'app/web/**'
              - 'app/shared/**'
              - 'app/workbench/**'
              - 'app/package.json'
              - 'app/pnpm-lock.yaml'
              - 'app/test-config/**'
              - '.github/workflows/checks.yml'
            # design_css = token/theme/preset CSS syntax gate (#1720): the
            # verifier scans tokens*/themes*/presets*.css anywhere under app/
            # (10 required paths are the minimum, new matches join the scan).
            design_css:
              - 'app/**/tokens*.css'
              - 'app/**/themes*.css'
              - 'app/**/presets*.css'
              - 'app/scripts/verify-design-css-syntax.mjs'
              - 'app/package.json'
              - 'app/pnpm-lock.yaml'
              - '.github/workflows/checks.yml'

  # ── Frontend: Desktop ────────────────────────
  # test:ci (4 sequential vitest configs, memory workaround) is fully green on
  # master — no known pre-existing failures. The old "15 pre-existing failures
  # (97.8%: 679/694)" note dated from when edge-real integration specs ran here;
  # those specs are excluded by the CI configs (src/__tests__/integration/**)
  # and the audit doc that tracked them (docs/audit/) has been removed.
  frontend-desktop:
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/desktop
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        continue-on-error: true
        run: pnpm lint --max-warnings 0

      # CI5: vitest shard matrix. `pnpm test:ci` chains 4 vitest configs
      # serially (≈337s). Split into 2 parallel shards; each shard re-runs
      # all 4 configs but only its slice of test files (--shard i/2).
      # --passWithNoTests guards configs whose file count leaves one shard
      # empty — it does NOT mask a config that lost all tests (still fails
      # in the other shard / in the baseline). vitest.config untouched.
      - name: Test Desktop (shard ${{ matrix.shard }}/2)
        run: |
          pnpm exec vitest run --config vitest.desktop-ts-ci.config.ts --shard ${{ matrix.shard }}/2 --passWithNoTests
          pnpm exec vitest run --config vitest.desktop-tsx-ci.config.ts --shard ${{ matrix.shard }}/2 --passWithNoTests
          pnpm exec vitest run --config vitest.edge-integration-ci.config.ts --shard ${{ matrix.shard }}/2 --passWithNoTests
          pnpm exec vitest run --config vitest.shared-ci.config.ts --shard ${{ matrix.shard }}/2 --passWithNoTests
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

  # ── Desktop Linux native build (Tauri) ──────
  # 重 job（Rust + webkit2gtk 编译），仅 workflow_dispatch 成本节流。
  # 作为 release.yml build-desktop-linux 的发布前预检：验证 Linux 桌面端
  # 前端构建 + Rust 编译 + edge sidecar 解析全链路，`--no-bundle` 不产出
  # 安装包、不需要 TAURI_SIGNING_PRIVATE_KEY。
  desktop-linux-build:
    name: Desktop Linux native build (Tauri)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri Linux system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build edge-server sidecar (Linux)
        shell: bash
        run: |
          mkdir -p app/desktop/src-tauri/binaries
          (cd edge-server && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ../app/desktop/src-tauri/binaries/agenthub-edge-x86_64-unknown-linux-gnu ./cmd/agenthub-edge/)
          chmod +x app/desktop/src-tauri/binaries/agenthub-edge-x86_64-unknown-linux-gnu

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install
        working-directory: app
        run: pnpm install --frozen-lockfile

      # Desktop↔Edge real E2E (#1678 P1-1): builds and runs the actual Go
      # Edge server (mock executor default) and asserts REST + WebSocket
      # contract + run lifecycle. Runs here because this job already has
      # setup-go + pnpm install.
      - name: Desktop↔Edge real E2E (Go edge server + REST/WS contract)
        working-directory: app/desktop
        run: pnpm exec vitest run --config vitest.edge-real-ci.config.ts --passWithNoTests

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/desktop/src-tauri

      - name: Build Tauri (no bundle)
        working-directory: app/desktop
        run: pnpm tauri build --no-bundle

  # ── Frontend: Web ────────────────────────────
  frontend-web:
    name: Frontend (web)
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app/web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint Web
        continue-on-error: true
        run: pnpm lint

      - name: Build Web
        run: pnpm build
      - name: Test
        run: pnpm test -- --run

  # ── Frontend: Mobile light (PR path-filtered) ──
  # typecheck + unit tests only. No Expo export / Playwright / doctor.
  # Closes the post-#1341 gap where mobile PRs skipped all mobile CI.
  frontend-mobile-light:
    name: Frontend (mobile light)
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./app
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Type check (mobile)
        run: pnpm --filter agenthub-mobile-rn typecheck
      - name: Unit tests (mobile)
        run: pnpm --filter agenthub-mobile-rn test

  # ── Frontend: Mobile full ───────────────────────
  # 重 job（Playwright/Expo export/coverage）；仅 workflow_dispatch 成本节流。
  # job 体保留以满足 verify-ci-gates.py；产品 LIVE，非停运。
  frontend-mobile:
    name: Frontend (mobile)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ./app
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type check (mobile)
        run: pnpm --filter agenthub-mobile-rn typecheck

      - name: Lint (mobile rules)
        continue-on-error: true
        run: pnpm --filter agenthub-mobile-rn lint

      # ── Hardened: Test with coverage reporting ──
      # Absolute floors live in vitest.config.ts (createCoverage factory,
      # #1535); no CLI overrides here. The provider is the workspace-root
      # @vitest/coverage-v8 (hoisted), so no add -D step is needed.
      - name: Test with coverage (mobile)
        run: |
          pnpm --filter agenthub-mobile-rn exec vitest run --coverage
          echo "::notice::Mobile coverage report generated (config thresholds apply)."

      # ── Hardened: Bundle size check (Expo web export) ──
      - name: Bundle size check (mobile web export)
        run: |
          echo "=== Mobile bundle size check ==="
          cd mobile-rn
          npx expo export --platform web --output-dir dist/web-export 2>&1
          if [ -d dist/web-export ]; then
            BUNDLE_SIZE_KB=$(du -sk dist/web-export | cut -f1)
            MAX_SIZE_KB=153600
            echo "Web export bundle size: ${BUNDLE_SIZE_KB} KB (max: ${MAX_SIZE_KB} KB)"
            if [ "${BUNDLE_SIZE_KB}" -gt "${MAX_SIZE_KB}" ]; then
              echo "::error::Web export bundle size ${BUNDLE_SIZE_KB} KB exceeds ${MAX_SIZE_KB} KB threshold"
              exit 1
            fi
            echo "::notice::Bundle size check passed: ${BUNDLE_SIZE_KB} KB under ${MAX_SIZE_KB} KB"
          else
            echo "::error::Web export did not produce output directory"
            exit 1
          fi

      # ── Hardened: Screenshot diff testing (visual QA) ──
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('app/pnpm-lock.yaml') }}
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Screenshot visual QA (mobile)
        timeout-minutes: 12
        run: |
          echo "=== Mobile screenshot visual QA ==="
          cd mobile-rn
          node scripts/visual-qa.mjs
        env:
          AGENTHUB_MOBILE_MOCK_HUB_PORT: '8088'
          CI: 'true'

      - name: Upload mobile screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-visual-qa-screenshots
          path: app/mobile-rn/screenshots/visual-qa/
          retention-days: 7

      - name: E2E (mock hub)
        timeout-minutes: 10
        run: |
          node mobile-rn/scripts/mock-hub.mjs &
          MOCK_HUB_PID=$!
          # Wait for mock hub to accept connections
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8088/health > /dev/null 2>&1; then
              echo "Mock hub ready at http://127.0.0.1:8088"
              break
            fi
            sleep 1
          done
          # Run vitest with mock hub available
          AGENTHUB_MOBILE_MOCK_HUB_PORT=8088 pnpm --filter agenthub-mobile-rn test
          E2E_EXIT_CODE=$?
          kill $MOCK_HUB_PID 2>/dev/null || true
          wait $MOCK_HUB_PID 2>/dev/null || true
          exit $E2E_EXIT_CODE

      # #1678 P1-4: wire the 6 mobile-rn Playwright __e2e__ specs (auth/chat/
      # settings/tasks/threads/workbench). The playwright.config.ts webServer
      # block starts the mock hub + `expo start --web` itself, so this is a
      # single command. Runs only on workflow_dispatch (S1 cost throttle).
      - name: E2E (Playwright, mock hub + Expo web)
        timeout-minutes: 25
        run: pnpm --filter agenthub-mobile-rn test:e2e

      - name: Verify Mobile RN
        run: pnpm --filter agenthub-mobile-rn verify
      - name: Expo Doctor
        run: pnpm --filter agenthub-mobile-rn run doctor
      - name: Native readiness
        run: pnpm --filter agenthub-mobile-rn run native:check
      - name: Mock Hub contract
        run: pnpm --filter agenthub-mobile-rn run mock:hub:check

  # ── Visual QA Shell (path-filtered) ──────────
  # P74 gate matrix evidence on relevant UI paths only (#1287).
  # Path filter merged into unified `changes` job (P78 #1333).
  visual-qa-shell:
    name: Visual QA shell (web, path-filtered)
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./app
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('app/pnpm-lock.yaml') }}
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Capture web visual:qa:shell
        timeout-minutes: 15
        working-directory: ./app/web
        run: pnpm visual:qa:shell
        env:
          CI: 'true'
          # Script spawns vite on 5174 with mock hub route; no real Hub required.

      - name: Assert non-blank shell screenshots
        working-directory: ./app/web
        run: pnpm assert:visual:qa:shell
        env:
          VISUAL_QA_SHELL_MIN_BYTES: '8000'

      - name: Upload visual QA shell screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-visual-qa-shell-screenshots
          path: app/web/screenshots/visual-qa/
          if-no-files-found: warn
          retention-days: 7

  # ── Web stubbed-hub E2E (path-filtered) ───────
  # #1839 B1: real-chromium behavior lane against a fully stubbed Hub
  # (pnpm test:e2e:stubbed-hub): chat-flow contract, stubbed-hub replay
  # smoke, task approval/artifact contract. Mock hub only — this is NOT a
  # real login / real Hub run (evidence level: stubbed-hub, real_tested=false).
  # Path filter reuses the unified `changes` job `web` output.
  web-e2e-stubbed:
    name: Web stubbed-hub E2E (path-filtered)
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./app
    steps:
      - uses: actions/checkout@v7
        with:
          # This job runs pnpm install (repo-controlled lifecycle scripts)
          # and never needs Git auth after checkout; do not persist the job
          # token into Git config (artipacked hardening).
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('app/pnpm-lock.yaml') }}
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run stubbed-hub E2E lane
        timeout-minutes: 15
        working-directory: ./app/web
        # Vite dev server + all Hub calls are stubbed via Playwright routes;
        # playwright.config.ts pins VITE_HUB_URL to hub.test.invalid so any
        # un-stubbed Hub call fails closed. No real Hub/Edge/login required.
        run: pnpm test:e2e:stubbed-hub
        env:
          CI: 'true'

      - name: Upload Playwright failure artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-e2e-stubbed-hub-results
          path: app/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # ── Backend perf / leak gates ─────────────────
  # Behavior + short microbench only (not production capacity).
  # Manual trigger only — residual T5 / post-polish risk assessment.
  backend-perf-leak-gates:
    name: Backend perf/leak gates
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            hub-server/go.sum
            edge-server/go.sum
      - name: Run backend perf/leak gates
        run: python ./scripts/verify/verify-backend-perf-leak-gates.py --Benchtime 100ms

  # ── E2E Smoke ─────────────────────────────────
  # 重 job；仅 workflow_dispatch 成本节流，需要时手动触发。
  e2e-smoke:
    name: E2E Smoke
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: ./app
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('app/pnpm-lock.yaml') }}
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
        working-directory: ./app
      - name: Smoke test
        # Only smoke.spec.ts runs in CI (static page checks against the web
        # dev server on 5174). chat-real.spec.ts requires live Hub (port 8080)
        # + Edge (port 3210) services which are not available in the CI
        # sandbox.
        # Run chat-real.spec.ts locally with all services up:
        #   pnpm --filter agenthub-web exec playwright test --config playwright.real.config.ts --project=chromium chat-real.spec.ts
        run: pnpm --filter agenthub-web exec playwright test --config playwright.config.ts --project=chromium smoke.spec.ts
        working-directory: ./app

  # ── Validation ───────────────────────────────
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check whitespace
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^..HEAD
          else
            git diff --check
          fi

      - name: Check workflows with actionlint
        # Community-standard GitHub Actions workflow linter (rhysd/actionlint):
        # catches syntax errors, broken expressions, and unsafe shell patterns
        # in every workflow on each push. Version pinned to the release asset
        # (no curl|bash) for supply-chain hygiene.
        shell: bash
        run: |
          curl -sSL -o actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color -shellcheck=

      - name: Verify commit messages (PR only)
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: origin/${{ github.base_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/verify/verify-commit-messages.sh "$BASE_REF" "$PR_HEAD_SHA"

      - name: Self-test commit-message gate
        shell: bash
        run: bash scripts/verify/tests/verify-commit-messages.Tests.sh

      - name: Secret guard
        continue-on-error: true  # Wave 10: mock/test secrets trigger false positive; re-enable after allowlist
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ "$BASE_REF" = "master" ] && [ "$HEAD_REF" = "dev/demo-user" ]; then
              bash scripts/verify/check-secrets.sh --range HEAD^2^..HEAD^2
            else
              bash scripts/verify/check-secrets.sh --range "origin/$BASE_REF...HEAD"
            fi
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            bash scripts/verify/check-secrets.sh --range HEAD^..HEAD
          else
            bash scripts/verify/check-secrets.sh --worktree
          fi

      - name: Verify CI gate policy
        run: python ./scripts/verify/verify-ci-gates.py

      - name: Self-test CI gate policy (workflow mutations)
        run: python scripts/verify/tests/verify-ci-gates.Tests.py

      - name: Self-test coverage baseline metadata/write safety
        run: python scripts/verify/tests/coverage-baseline.Tests.py

      - name: Verify remote devserver privacy/portability contract
        run: python scripts/verify/verify-devserver-contract.py

      - name: Verify action runtime allow-list (no Node-20 actions)
        run: python ./scripts/verify/verify-action-runtimes.py

      - name: Self-test action runtime allow-list gate
        run: python scripts/verify/tests/verify-action-runtimes.Tests.py

      - name: Verify project skill whitelist
        run: python ./scripts/verify/verify-project-skills.py

      - name: Verify doc SSOT
        run: python scripts/verify/verify-doc-ssot.py

      - name: Self-test doc entrypoint SSOT
        run: python scripts/verify/tests/verify-doc-entrypoints.Tests.py

      - name: Self-test vulnerability gates (fail-closed contract)
        shell: bash
        run: bash scripts/verify/tests/verify-vulnerability-gates.Tests.sh

      - name: Self-test gosec gate (fail-closed contract)
        shell: bash
        run: bash scripts/verify/tests/verify-gosec-gates.Tests.sh

      - name: Self-test secret guard (fail-closed contract)
        shell: bash
        run: bash scripts/verify/tests/check-secrets.Tests.sh

      - name: Verify Web Hub-only boundary
        run: python scripts/verify/verify-web-hub-boundary.py

      - name: Verify Hub pure package imports
        run: python scripts/verify/verify-hub-pure-packages.py

      - name: Verify Mobile Hub-only boundary
        run: python scripts/verify/verify-mobile-hub-boundary.py

      - name: Verify hubClient thin-shell SSOT
        run: python scripts/verify/verify-hubclient-ssot.py

      - name: Verify Design token SSOT
        run: python scripts/verify/verify-design-token-ssot.py

      - name: Verify real E2E contract
        run: python scripts/verify/verify-real-e2e-contract.py

      - name: Validate OpenAPI YAML
        run: |
          python -m pip install --quiet PyYAML
          python -c "import pathlib, yaml; yaml.safe_load(pathlib.Path('api/openapi.yaml').read_text(encoding='utf-8')); print('yaml ok')"

      - name: Verify OpenAPI↔hub router contract
        run: python ./scripts/verify/verify-openapi-contract.py

      # ── Architecture boundary gates (audit-A gate-ifiable candidates) ──
      # Shared workbench/chatview/ui must stay free of Edge client imports;
      # shared barrel must not leak Edge exports to platform apps; handler
      # must not import repository directly; router methods must be documented
      # in conventions.md.
      - name: Verify Shared Edge-free boundary
        run: python ./scripts/verify/verify-shared-boundary.py

      - name: Verify frontend package boundary (workbench -> shared only, #1759)
        run: python ./scripts/verify/verify-frontend-package-boundary.py

      - name: Self-test frontend package boundary gate (negative)
        run: python scripts/verify/tests/verify-frontend-package-boundary.Tests.py

      - name: Verify Shared barrel Edge-export ban
        run: python ./scripts/verify/verify-shared-barrel.py

      - name: Verify Hub handler layering
        run: python ./scripts/verify/verify-hub-layering.py

      - name: Verify Conventions method SSOT
        run: python ./scripts/verify/verify-conventions.py

      - name: Verify Outbound client hygiene (#1549)
        run: python ./scripts/verify/verify-outbound-client-hygiene.py

      - name: Verify test-sleep ratchet (#1550)
        run: python ./scripts/verify/verify-test-sleep-ratchet.py

      - name: Verify auth dependency ownership (#1551)
        run: python ./scripts/verify/verify-auth-dep-ownership.py

      - name: Verify quality-debt ratchet (#1536)
        run: python ./scripts/verify/verify-quality-debt-ratchet.py

      - name: Self-test quality-debt ratchet (negative)
        run: python scripts/verify/tests/verify-quality-debt-ratchet.Tests.py

      - name: Verify Shared REST contract Hub-client to Hub-router
        run: python ./scripts/verify/verify-shared-rest-contract.py

      - name: Verify Shared UI hubClient gate
        run: python ./scripts/verify/verify-shared-ui-hubclient.py

      - name: Verify Shared Edge surface isolation (web/mobile-rn)
        run: python ./scripts/verify/verify-shared-edge-surface-isolation.py

      - name: Self-test Shared Edge surface isolation gate
        run: python scripts/verify/tests/verify-shared-edge-surface-isolation.Tests.py

      - name: Verify v4 old UI active paths
        run: python ./scripts/verify/verify-v4-old-ui-active-paths.py

      # #1612: i18n callsites ratchet — shared UI must not add new CJK
      # string literals (every user-visible string routes through the i18n
      # dictionary). The gate enforces a non-increasing baseline; the script
      # exits non-zero when the current CJK-literal count exceeds baseline.
      # Wired advisory (continue-on-error) only because two frontend files
      # (ui/CodeBlock.tsx, workbench/workbenchTestMocks.ts) regressed the
      # baseline in the current working tree and this lane cannot touch app/.
      # Once those violations are backfilled below baseline, flip this to
      # hard-blocking by removing continue-on-error. The gate itself is not
      # weakened — the script runs on every PR and posts a failure annotation
      # either way.
      - name: Verify i18n callsites ratchet (#1612)
        continue-on-error: true
        run: python ./scripts/verify/verify-i18n-callsites.py

  # ── Frontend coverage baseline gate (path-filtered) ──
  # Split out of the unconditional validate lane (audit): a Go-only PR no
  # longer pays for pnpm install + vitest --coverage. v8 coverage is
  # execution-path based so numbers are cross-platform deterministic; a
  # small tolerance field in the baseline absorbs run-to-run async noise.
  # Fails if any coverage metric drops below scripts/verify/coverage-baseline.json
  # or if any test is skipped (.skip / .todo anti-cheat).
  frontend-coverage:
    name: Frontend coverage baseline (${{ matrix.package }})
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # CI5 wave2 (#1689): the gate ran all four packages serially in one job
      # (~10min). Split into a per-package matrix; each leg runs only its own
      # vitest --coverage (~1.5-4min) and fails with precise package scoping.
      # The negative include-contract self-test (mobile vitest run) executes
      # once, on the mobile leg.
      matrix:
        package: ['@agenthub/shared', '@agenthub/workbench', 'agenthub-web', 'agenthub-desktop', 'agenthub-mobile-rn']
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm (coverage gate)
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Setup Node (coverage gate)
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install frontend deps (coverage gate)
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Verify coverage baseline
        # 2026-08-15 收紧（原 Wave 10 advisory）：mobile re-baseline 后四包
        # 全绿（PR #1685 coverage 10m2s pass 验证），转 hard gate。
        run: python ./scripts/verify/verify-coverage-baseline.py --OnlyPackages "${{ matrix.package }}"
      # Negative self-test: an imported-by-nobody production file must be
      # counted as 0% and trip the uncovered ratchet (#1535). Cheap — mobile
      # only (339 tests, node env). Runs once on the mobile leg instead of
      # four times across the matrix.
      - name: Self-test coverage include contract (negative)
        if: matrix.package == 'agenthub-mobile-rn'
        run: python ./scripts/verify/tests/coverage-include.Tests.py

  # ── Design CSS syntax gate (fail-closed, #1720) ─
  # 核心 token/theme/preset CSS 被 .stylelintignore 排除在 Stylelint 之外，
  # 注释 `*/` 之类的语法错误因此假绿。本 job 只做 parser 语法检查
  # （config: { rules: {} }），不碰约 920 条历史规则债。正向扫描与负向
  # self-test 均为 hard-blocking（无 continue-on-error、无 || true）。
  design-css:
    name: Design CSS syntax (fail-closed)
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.design_css == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Verify design CSS syntax
        run: pnpm test:css-syntax

      - name: Self-test design CSS syntax gate (negative)
        run: pnpm test:css-syntax:self-test

  # ── Vuln Scan: JS (pnpm audit --prod) ─────────
  vuln-scan-js:
    name: Vuln scan (pnpm audit --prod)
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm audit --prod (fail-closed, #1534)
        shell: bash
        run: |
          # GHA bash 默认自带 -o pipefail：pnpm audit 发现漏洞时返回非零，
          # 会传播为管道失败，即使 verifier 已按例外登记判定通过。改为先
          # 落盘再喂给 verifier，verifier 退出码是唯一判定；pnpm 自身失败
          # （网络/错误 JSON/空输出）仍被 verifier 按 fail-closed 拒绝。
          pnpm audit --prod --json 2>&1 > /tmp/pnpm-audit.json || true
          bash ../scripts/verify/verify-vulnerability-gates.sh pnpm-audit < /tmp/pnpm-audit.json


  # ── Vuln Scan: Go (govulncheck) ───────────────
  vuln-scan-go:
    name: Vuln scan (govulncheck)
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [hub-server, edge-server]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: govulncheck (fail-closed, #1534)
        shell: bash
        run: |
          set -o pipefail
          # 事件流（NDJSON）经 verifier 按 summary 事件判定；解析失败/工具故障
          # 一律 fail-closed。旧实现把整段输出当单个 JSON 对象解析，
          # 解析失败后 exit 0 —— 假绿已修（#1534）。
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 -json ./... 2>&1             | bash ../scripts/verify/verify-vulnerability-gates.sh govulncheck

  # ── Vuln Scan: Rust (cargo audit, #1578) ───────
  vuln-scan-rust:
    name: Vuln scan (cargo audit)
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.96.0

      # CI7: cargo clippy advisory — 24 warnings not yet zero-baselined;
      # continue-on-error so CI stays green while the debt is triaged.
      # Promote to hard-blocking (cargo clippy --all-targets -- -D warnings)
      # once the lint debt is repaid to zero.
      - name: cargo clippy (advisory)
        continue-on-error: true
        working-directory: app/desktop/src-tauri
        run: cargo clippy --all-targets 2>&1

      # CI5: cargo-audit install sped up via cargo-binstall (prebuilt binary,
      # ~10s) instead of `cargo install cargo-audit --locked` which compiles
      # ~200 crates (2-4 min) on every desktop-changed run. cargo-binstall
      # is bootstrapped with its official installer script — no GitHub Action
      # step is introduced, so the action-runtime allow-list is unaffected.
      # Verified method per
      # https://github.com/cargo-bins/cargo-binstall#installation.
      - name: Install cargo-audit (prebuilt, via cargo-binstall)
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall cargo-audit --no-confirm --locked

      - name: Rust advisory gate (fail-closed, #1578)
        shell: bash
        run: bash scripts/verify/verify-rust-advisories.sh

      - name: Self-test Rust advisory gate (fail-closed contract, #1578)
        shell: bash
        run: bash scripts/verify/tests/verify-rust-advisories.Tests.sh
