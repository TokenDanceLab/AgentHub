    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./app
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-pnpm

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('app/pnpm-lock.yaml') }}
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Capture desktop visual:qa:shell
        timeout-minutes: 15
        working-directory: ./app/desktop
        run: |
          # Flake retry (#1949): browser capture can fail transiently on CI runners.
          for attempt in 1 2; do
            echo "::group::desktop visual:qa:shell attempt ${attempt}"
            if pnpm visual:qa:shell; then
              echo "::endgroup::"
              break
            fi
            echo "::endgroup::"
            if [ "$attempt" = "2" ]; then
              echo "::error::desktop visual:qa:shell failed after 2 attempts"
              exit 1
            fi
            echo "::warning::desktop visual:qa:shell attempt ${attempt} failed, retrying..."
            sleep 5
          done
        env:
          CI: 'true'
          # Script spawns vite on 5199 with demo workbench entry; no real Hub required.

      - name: Capture desktop visual:qa:chat
        timeout-minutes: 15
        working-directory: ./app/desktop
        run: |
          # Flake retry (#1949): browser capture can fail transiently on CI runners.
          for attempt in 1 2; do
            echo "::group::desktop visual:qa:chat attempt ${attempt}"
            if pnpm visual:qa:chat; then
              echo "::endgroup::"
              break
            fi
            echo "::endgroup::"
            if [ "$attempt" = "2" ]; then
              echo "::error::desktop visual:qa:chat failed after 2 attempts"
              exit 1
            fi
            echo "::warning::desktop visual:qa:chat attempt ${attempt} failed, retrying..."
            sleep 5
          done
        env:
          CI: 'true'
          # Script spawns vite on 5199 with demo workbench entry (builder
          # demo transcript renders completed cards); no real Hub required.

      - name: Assert non-blank shell screenshots (desktop)
        working-directory: ./app/desktop
        run: pnpm assert:visual:qa:shell
        env:
          VISUAL_QA_SHELL_MIN_BYTES: '8000'

      - name: Assert chat screenshots (desktop, non-blank + geometry contract)
        working-directory: ./app/desktop
        run: node scripts/assert-visual-qa-chat.mjs
        env:
          VISUAL_QA_CHAT_MIN_BYTES: '8000'

      - name: Upload visual QA shell screenshots (desktop)
        if: always()
        uses: actions/upload-artifact@v7
        with:
