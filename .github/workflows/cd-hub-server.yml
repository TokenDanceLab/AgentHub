name: CD - AgentHub Hub Server

on:
  push:
    branches: [master]
    paths:
      - "hub-server/**"
      - "pkg/**"
      - "go.*"
      - ".github/workflows/cd-hub-server.yml"
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/tokendancelab/agenthub-hub-server

jobs:
  build-and-push:
    name: Build and push Hub Server
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value={{date '20060102'}},enable=${{ github.ref == 'refs/heads/master' }}
            type=sha,prefix=,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: hub-server/deployments/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
