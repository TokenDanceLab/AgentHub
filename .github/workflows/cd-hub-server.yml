name: CD - AgentHub Hub Server

on:
  push:
    branches: [master]
    paths:
      - "hub-server/**"
      - ".dockerignore"
      - "edge-server/go.mod"
      - "edge-server/go.sum"
      - "pkg/**"
      - "go.*"
      - ".github/workflows/cd-hub-server.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # `latest` stays owned by cd-production.yml (after a release); this workflow
  # deliberately passes push-latest: false.
  image:
    uses: ./.github/workflows/cd-image.yml
    with:
      image: ghcr.io/tokendancelab/agenthub-hub-server
      context: .
      dockerfile: hub-server/deployments/Dockerfile
      cache-scope: hub-server
      build-args: VERSION=${{ github.sha }}
      push-latest: false
