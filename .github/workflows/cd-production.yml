name: CD Production

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag or ref to deploy (e.g. v1.2.3 or a commit SHA)"
        required: true
        type: string
      skip_staging:
        description: "Skip staging deployment (emergency only)"
        required: false
        default: false
        type: boolean

env:
  GO_VERSION: "1.25"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/agenthub-hub

jobs:
  # ── Gate: only proceed on Release success or manual dispatch ──
  gate:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    steps:
      - name: Gate passed
        run: |
          REF="${{ github.event.inputs.version || github.event.workflow_run.head_branch }}"
          echo "Proceeding with deployment for ref: ${REF}"
          echo "Trigger: ${{ github.event_name }}"

  # ── Build & Push Docker Image ──────────────────
  docker-build-push:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Determine checkout ref
        id: ref
        run: |
          REF="${{ github.event.inputs.version || github.event.workflow_run.head_branch }}"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.ref.outputs.ref }},priority=900
            type=sha,prefix=,priority=800
            type=raw,value=latest,enable=${{ startsWith(steps.ref.outputs.ref, 'v') && !contains(steps.ref.outputs.ref, '-') }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: hub-server/deployments/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Staging Deploy (automated, no approval gate) ──
  deploy-staging:
    needs: docker-build-push
    if: ${{ github.event.inputs.skip_staging != 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "::group::Staging Deploy"
          echo "Image: ${{ needs.docker-build-push.outputs.image_tag }}"
          echo "Digest: ${{ needs.docker-build-push.outputs.image_digest }}"
          echo "::notice::Staging deployment triggered."
          echo ""
          echo "Deployment uses hub-server/deployments/deploy.sh as reference."
          echo "Production server pulls from GHCR and runs docker compose up."
          echo "::endgroup::"

  # ── Manual Approval Gate ───────────────────────
  # ────────────────────────────────────────────────
  # PRODUCTION DEPLOYMENT APPROVAL GATE
  #
  # This job uses a GitHub Environment named "production" to enforce
  # manual approval before any production deployment proceeds.
  #
  # REPOSITORY ADMIN SETUP REQUIRED:
  #   1. Go to: Settings → Environments → New environment
  #   2. Name: "production"
  #   3. Under "Required reviewers": add at least 1 reviewer
  #   4. Optionally enable "Wait timer" (recommended: 5 minutes)
  #   5. Save
  #
  # Without required reviewers configured, GitHub will auto-approve
  # this step — defeating the purpose. SET UP REVIEWERS.
  #
  # When this job runs, GitHub pauses and sends a notification to
  # every configured reviewer. A reviewer must open the deployment
  # and click "Approve" (or "Reject") before the pipeline continues.
  # ────────────────────────────────────────────────
  approve-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Approval gate passed
        run: |
          echo "============================================================="
          echo "  PRODUCTION DEPLOYMENT APPROVED"
          echo "  Image:   ${{ needs.docker-build-push.outputs.image_tag }}"
          echo "  Digest:  ${{ needs.docker-build-push.outputs.image_digest }}"
          echo "  Approved by: ${{ github.actor }}"
          echo "  Time:    $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "============================================================="

  # ── Production Deploy ──────────────────────────
  deploy-production:
    needs: approve-production
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          echo "::group::Production Deploy"
          echo "Deploying image: ${{ needs.docker-build-push.outputs.image_tag }}"
          echo ""
          echo "Deployment entry point: hub-server/deployments/deploy.sh"
          echo "Typical production flow:"
          echo "  1. Production server pulls image from GHCR"
          echo "  2. docker compose -f docker-compose.prod.yml up -d --no-build --force-recreate"
          echo "  3. Health check via GET /health"
          echo "  4. Smoke test via GET /api/public/stats"
          echo ""
          echo "See hub-server/deployments/README.md for full deployment guide."
          echo "::endgroup::"

      # ──────────────────────────────────────────────
      # ROLLBACK INSTRUCTIONS
      # ──────────────────────────────────────────────
      # If this production deployment fails or causes a regression,
      # use one of the following rollback procedures.
      #
      # --- Option A: Re-deploy a known-good version via Actions ---
      #   1. Go to: Actions → CD Production → Run workflow
      #   2. Enter the LAST KNOWN GOOD version tag (e.g. v1.2.2)
      #   3. Trigger the workflow — it will rebuild + deploy that ref
      #
      # --- Option B: Rollback on the production server (fastest) ---
      #   Prerequisites: SSH access to the production server.
      #   1. SSH into the production host.
      #   2. List available Docker images:
      #        docker images ghcr.io/tokendancelab/agenthub-hub --format '{{.ID}} {{.Tag}} {{.CreatedAt}}'
      #   3. Tag the last known-good image as rollback:
      #        docker tag <safe-image-id> ghcr.io/tokendancelab/agenthub-hub:rollback
      #   4. Execute rollback via the deployment script:
      #        cd /path/to/hub-server/deployments
      #        AGENTHUB_HUB_IMAGE=ghcr.io/tokendancelab/agenthub-hub:rollback ./deploy.sh rollback
      #   5. Verify recovery:
      #        curl -s https://<hub-host>/health | jq .
      #        curl -sf https://<hub-host>/api/public/stats
      #
      # --- Option C: docker compose direct rollback ---
      #   If deploy.sh is unavailable, use docker compose directly:
      #   1. SSH into the production host.
      #   2. cd /path/to/hub-server/deployments
      #   3. Set the image to the previous working tag:
      #        export AGENTHUB_HUB_IMAGE=ghcr.io/tokendancelab/agenthub-hub:<previous-tag>
      #   4. Recreate the container:
      #        docker compose -f docker-compose.prod.yml --env-file .env.production \
      #          up -d --no-build --no-deps --force-recreate hub-server
      #   5. Follow logs until healthy:
      #        docker compose -f docker-compose.prod.yml logs -f hub-server
      #
      # --- Option D: Database rollback (if migrations caused issues) ---
      #   Reference: hub-server/deployments/README.md "备份与恢复" section.
      #   1. Stop hub-server: systemctl stop hub-server
      #   2. Restore DB: pg_restore -h <host> -U agenthub -d agenthub \
      #        --clean --if-exists <backup-file>.dump
      #   3. Deploy previous image (Option B or C above).
      #
      # --- Post-rollback verification checklist ---
      #   [ ] /health returns status "ok" with all checks passing
      #   [ ] /api/public/stats returns 200
      #   [ ] Login flow works (TokenDance ID OIDC callback)
      #   [ ] WebSocket connections succeed
      #   [ ] No spike in error logs (docker compose logs --tail=200 hub-server)
      #   [ ] Staging environment unaffected
      # ──────────────────────────────────────────────

  # ── Post-deploy health check (informational) ───
  health-check:
    needs: deploy-production
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Deployment summary
        run: |
          echo "::group::Deployment Summary"
          echo "Image:  ${{ needs.docker-build-push.outputs.image_tag || 'N/A' }}"
          echo "Digest: ${{ needs.docker-build-push.outputs.image_digest || 'N/A' }}"
          echo "Status: ${{ needs.deploy-production.result }}"
          echo ""
          if [ "${{ needs.deploy-production.result }}" = "success" ]; then
            echo "Production deployment completed."
            echo "Verify: curl https://<hub-host>/health"
          else
            echo "::warning::Production deployment did not succeed."
            echo "See rollback instructions in the 'deploy-production' job logs."
          fi
          echo "::endgroup::"
