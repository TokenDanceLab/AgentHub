name: CD Production

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag or ref to deploy (e.g. v1.2.3 or a commit SHA)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.3"
  REGISTRY: ghcr.io
  # Image name is the single product image; do not add a second alias.
  IMAGE_NAME: tokendancelab/agenthub-hub-server
  # Build and push only. Real deployment is a manual operation outside this
  # repository; deployment shape lives in deployments/production/.

jobs:
  # ── Build & Push Docker Image ──────────────────
  docker-build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Determine checkout ref
        id: ref
        run: |
          REF="${{ github.event.inputs.version || github.ref_name }}"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.ref.outputs.ref }},priority=900
            type=sha,prefix=,priority=800
            type=raw,value=latest,enable=${{ startsWith(steps.ref.outputs.ref, 'v') && !contains(steps.ref.outputs.ref, '-') }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: hub-server/deployments/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.ref.outputs.ref }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
