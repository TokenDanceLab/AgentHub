name: CD - AgentHub Web

on:
  push:
    branches: [master]
    paths:
      - "app/web/**"
      - "app/shared/**"
      - "app/workbench/**"
      - "app/package.json"
      - "app/pnpm-lock.yaml"
      - "app/pnpm-workspace.yaml"
      - "app/Dockerfile"
      - "app/.dockerignore"
      - "app/.npmrc"
      - ".github/workflows/cd-web.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  image:
    uses: ./.github/workflows/cd-image.yml
    with:
      image: ghcr.io/tokendancelab/agenthub-web
      context: app/
      dockerfile: app/Dockerfile
      cache-scope: web
      push-latest: true
